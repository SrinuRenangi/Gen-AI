<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="500" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="230" y="20" width="490" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    🌲 Random Forest: The Ensemble Voting Machine
  </text>

  <!-- Subtitle -->
  <text x="475" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    Bagging (Bootstrap Samples) + Random Features ➔ Hundreds of Diverse Trees ➔ Majority Vote!
  </text>

  <!-- Flowchart Workflow -->
  <!-- 1. Original Dataset (Top Center) -->
  <g transform="translate(375, 105)">
    <rect width="200" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="23" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">📊 FULL DATASET</text>
    <text x="100" y="40" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">N Rows, D Features</text>
  </g>

  <!-- Arrows branching down to 3 Bootstrap subsets -->
  <line x1="410" y1="155" x2="200" y2="200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="475" y1="155" x2="475" y2="200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="540" y1="155" x2="750" y2="200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- 2. Bootstrap Samples Layer -->
  <g transform="translate(100, 200)">
    <rect width="200" height="40" rx="6" fill="#0b1329" stroke="#475569" stroke-width="1"/>
    <text x="100" y="25" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">Bootstrap Sample 1</text>
  </g>

  <g transform="translate(375, 200)">
    <rect width="200" height="40" rx="6" fill="#0b1329" stroke="#475569" stroke-width="1"/>
    <text x="100" y="25" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">Bootstrap Sample 2</text>
  </g>

  <g transform="translate(650, 200)">
    <rect width="200" height="40" rx="6" fill="#0b1329" stroke="#475569" stroke-width="1"/>
    <text x="100" y="25" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">Bootstrap Sample N</text>
  </g>

  <!-- Arrows down to individual Trees -->
  <line x1="200" y1="240" x2="200" y2="265" stroke="#10b981" stroke-width="2"/>
  <line x1="475" y1="240" x2="475" y2="265" stroke="#10b981" stroke-width="2"/>
  <line x1="750" y1="240" x2="750" y2="265" stroke="#10b981" stroke-width="2"/>

  <!-- 3. Decision Trees Layer -->
  <g transform="translate(110, 265)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🌲 Tree #1</text>
    <text x="90" y="47" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Vote: Class 1 ✅</text>
  </g>

  <g transform="translate(385, 265)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🌲 Tree #2</text>
    <text x="90" y="47" fill="#fca5a5" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Vote: Class 0 ❌</text>
  </g>

  <g transform="translate(660, 265)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🌲 Tree #100</text>
    <text x="90" y="47" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Vote: Class 1 ✅</text>
  </g>

  <!-- Arrows converging into Majority Vote -->
  <line x1="200" y1="325" x2="400" y2="370" stroke="#f59e0b" stroke-width="2"/>
  <line x1="475" y1="325" x2="475" y2="370" stroke="#f59e0b" stroke-width="2"/>
  <line x1="750" y1="325" x2="550" y2="370" stroke="#f59e0b" stroke-width="2"/>

  <!-- 4. Majority Vote Container (Bottom Center) -->
  <g transform="translate(325, 370)">
    <rect width="300" height="60" rx="10" fill="#b45309" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="26" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🗳️ MAJORITY VOTING (78 vs 22)</text>
    <text x="150" y="48" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" text-anchor="middle">FINAL PREDICTION: CLASS 1 🎯</text>
  </g>

  <!-- Bottom Tip Banner -->
  <rect x="60" y="445" width="830" height="35" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <text x="475" y="468" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">
    💡 <tspan fill="#38bdf8" font-weight="600">The Wisdom of Crowds:</tspan> Individual trees make mistakes, but their errors cancel out. Random Forests rarely overfit!
  </text>
</svg>
