<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cpu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="gpu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <marker id="bus-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg-grad)" />

  <!-- Title Banner -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    HARDWARE ACCELERATION: CPU vs GPU TENSOR PIPELINE
  </text>
  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    What Really Happens When You Call tensor.to('cuda') Across the High-Speed PCIe Bus
  </text>

  <!-- Main Comparison Grid -->
  <g transform="translate(40, 95)">

    <!-- LEFT PANEL: HOST CPU & SYSTEM RAM -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="360" height="385" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
      <rect x="0" y="0" width="360" height="32" rx="12" fill="url(#cpu-grad)" />
      <text x="180" y="21" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">
        🖥️ HOST SYSTEM (CPU &amp; RAM)
      </text>

      <!-- CPU Architecture Diagram -->
      <g transform="translate(20, 50)">
        <rect width="320" height="120" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="160" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">CPU: 8 – 16 Powerful Heavyweight Cores</text>
        
        <!-- 8 Core Boxes -->
        <g transform="translate(30, 35)">
          <rect x="0" y="0" width="55" height="32" rx="4" fill="#1e293b" stroke="#0ea5e9" /><text x="27" y="20" font-family="monospace" font-size="10" fill="#f8fafc" text-anchor="middle">Core 0</text>
          <rect x="65" y="0" width="55" height="32" rx="4" fill="#1e293b" stroke="#0ea5e9" /><text x="92" y="20" font-family="monospace" font-size="10" fill="#f8fafc" text-anchor="middle">Core 1</text>
          <rect x="130" y="0" width="55" height="32" rx="4" fill="#1e293b" stroke="#0ea5e9" /><text x="157" y="20" font-family="monospace" font-size="10" fill="#f8fafc" text-anchor="middle">Core 2</text>
          <rect x="195" y="0" width="55" height="32" rx="4" fill="#1e293b" stroke="#0ea5e9" /><text x="222" y="20" font-family="monospace" font-size="10" fill="#f8fafc" text-anchor="middle">Core 3</text>

          <rect x="0" y="38" width="55" height="32" rx="4" fill="#1e293b" stroke="#0ea5e9" /><text x="27" y="58" font-family="monospace" font-size="10" fill="#f8fafc" text-anchor="middle">Core 4</text>
          <rect x="65" y="38" width="55" height="32" rx="4" fill="#1e293b" stroke="#0ea5e9" /><text x="92" y="58" font-family="monospace" font-size="10" fill="#f8fafc" text-anchor="middle">Core 5</text>
          <rect x="130" y="38" width="55" height="32" rx="4" fill="#1e293b" stroke="#0ea5e9" /><text x="157" y="58" font-family="monospace" font-size="10" fill="#f8fafc" text-anchor="middle">Core 6</text>
          <rect x="195" y="38" width="55" height="32" rx="4" fill="#1e293b" stroke="#0ea5e9" /><text x="222" y="58" font-family="monospace" font-size="10" fill="#f8fafc" text-anchor="middle">Core 7</text>
        </g>
        <text x="160" y="112" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Master of complex branching, OS calls, file I/O</text>
      </g>

      <!-- System RAM Box -->
      <g transform="translate(20, 185)">
        <rect width="320" height="75" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">SYSTEM RAM (e.g., 32 GB DDR5):</text>
        <text x="20" y="44" font-family="monospace" font-size="10" fill="#38bdf8">x = torch.randn(1000, 1000)</text>
        <text x="20" y="62" font-family="sans-serif" font-size="9" fill="#94a3b8">Default tensor location. Bandwidth: ~50 GB/s</text>
      </g>

      <!-- Python Logic Box -->
      <g transform="translate(20, 275)">
        <rect width="320" height="90" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">Python Control Flow:</text>
        <text x="20" y="44" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Data loading from disk (Dataset, DataLoader)</text>
        <text x="20" y="62" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Python while / for training loops</text>
        <text x="20" y="80" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Logging metrics to terminal / TensorBoard</text>
      </g>
    </g>

    <!-- CENTER BRIDGE: PCIe BUS -->
    <g transform="translate(380, 140)">
      <rect width="120" height="150" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" />
      <text x="60" y="32" font-family="sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">PCIe BUS</text>
      <text x="60" y="48" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">(Gen 4/5)</text>

      <!-- Arrow to GPU -->
      <line x1="20" y1="75" x2="100" y2="75" stroke="#38bdf8" stroke-width="3" marker-end="url(#bus-arrow)" />
      <text x="60" y="94" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">.to('cuda')</text>

      <!-- Arrow back to CPU -->
      <line x1="100" y1="115" x2="20" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#bus-arrow)" />
      <text x="60" y="134" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">.cpu().numpy()</text>
    </g>

    <!-- RIGHT PANEL: DISCRETE GPU & VRAM -->
    <g transform="translate(520, 0)" filter="url(#shadow)">
      <rect width="360" height="385" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <rect x="0" y="0" width="360" height="32" rx="12" fill="url(#gpu-grad)" />
      <text x="180" y="21" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">
        🚀 NVIDIA GPU (CUDA &amp; VRAM)
      </text>

      <!-- GPU Architecture Diagram -->
      <g transform="translate(20, 50)">
        <rect width="320" height="120" rx="8" fill="#0f172a" stroke="#065f46" />
        <text x="160" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">GPU: 10,000+ Lightweight Parallel Cores</text>
        
        <!-- Dense Grid of Cores -->
        <g transform="translate(25, 36)" fill="#10b981" opacity="0.8">
          <!-- Row 1 -->
          <rect x="0" y="0" width="12" height="10" rx="1"/><rect x="18" y="0" width="12" height="10" rx="1"/><rect x="36" y="0" width="12" height="10" rx="1"/><rect x="54" y="0" width="12" height="10" rx="1"/><rect x="72" y="0" width="12" height="10" rx="1"/><rect x="90" y="0" width="12" height="10" rx="1"/><rect x="108" y="0" width="12" height="10" rx="1"/><rect x="126" y="0" width="12" height="10" rx="1"/><rect x="144" y="0" width="12" height="10" rx="1"/><rect x="162" y="0" width="12" height="10" rx="1"/><rect x="180" y="0" width="12" height="10" rx="1"/><rect x="198" y="0" width="12" height="10" rx="1"/><rect x="216" y="0" width="12" height="10" rx="1"/><rect x="234" y="0" width="12" height="10" rx="1"/><rect x="252" y="0" width="12" height="10" rx="1"/>
          <!-- Row 2 -->
          <rect x="0" y="14" width="12" height="10" rx="1"/><rect x="18" y="14" width="12" height="10" rx="1"/><rect x="36" y="14" width="12" height="10" rx="1"/><rect x="54" y="14" width="12" height="10" rx="1"/><rect x="72" y="14" width="12" height="10" rx="1"/><rect x="90" y="14" width="12" height="10" rx="1"/><rect x="108" y="14" width="12" height="10" rx="1"/><rect x="126" y="14" width="12" height="10" rx="1"/><rect x="144" y="14" width="12" height="10" rx="1"/><rect x="162" y="14" width="12" height="10" rx="1"/><rect x="180" y="14" width="12" height="10" rx="1"/><rect x="198" y="14" width="12" height="10" rx="1"/><rect x="216" y="14" width="12" height="10" rx="1"/><rect x="234" y="14" width="12" height="10" rx="1"/><rect x="252" y="14" width="12" height="10" rx="1"/>
          <!-- Row 3 -->
          <rect x="0" y="28" width="12" height="10" rx="1"/><rect x="18" y="28" width="12" height="10" rx="1"/><rect x="36" y="28" width="12" height="10" rx="1"/><rect x="54" y="28" width="12" height="10" rx="1"/><rect x="72" y="28" width="12" height="10" rx="1"/><rect x="90" y="28" width="12" height="10" rx="1"/><rect x="108" y="28" width="12" height="10" rx="1"/><rect x="126" y="28" width="12" height="10" rx="1"/><rect x="144" y="28" width="12" height="10" rx="1"/><rect x="162" y="28" width="12" height="10" rx="1"/><rect x="180" y="28" width="12" height="10" rx="1"/><rect x="198" y="28" width="12" height="10" rx="1"/><rect x="216" y="28" width="12" height="10" rx="1"/><rect x="234" y="28" width="12" height="10" rx="1"/><rect x="252" y="28" width="12" height="10" rx="1"/>
        </g>
        <text x="160" y="112" font-family="sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">SIMD/Tensor Cores: Executes 10,000 dot products simultaneously!</text>
      </g>

      <!-- GPU VRAM Box -->
      <g transform="translate(20, 185)">
        <rect width="320" height="75" rx="8" fill="#0f172a" stroke="#065f46" />
        <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">GPU VRAM (e.g., 24 GB GDDR6X / HBM3):</text>
        <text x="20" y="44" font-family="monospace" font-size="10" fill="#34d399">x_gpu = x.to('cuda')</text>
        <text x="20" y="62" font-family="sans-serif" font-size="9" fill="#a7f3d0">Ultra-wide bus. Bandwidth: ~1,000 – 3,000 GB/s!</text>
      </g>

      <!-- GPU Operations Box -->
      <g transform="translate(20, 275)">
        <rect width="320" height="90" rx="8" fill="#0f172a" stroke="#065f46" />
        <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">Accelerated Computations:</text>
        <text x="20" y="44" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Massive Matrix Multiplications (GEMM)</text>
        <text x="20" y="62" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Forward activation passes across batch</text>
        <text x="20" y="80" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Autograd backward gradient computation</text>
      </g>
    </g>
  </g>

  <!-- Bottom Callout Footer -->
  <rect x="40" y="500" width="880" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="526" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    <tspan fill="#38bdf8" font-weight="700">Device Agnostic Code: </tspan> Always use <tspan fill="#f1f5f9" font-family="monospace">device = 'cuda' if torch.cuda.is_available() else 'cpu'</tspan> so your code runs seamlessly on laptops and GPU superclusters!
  </text>
</svg>
