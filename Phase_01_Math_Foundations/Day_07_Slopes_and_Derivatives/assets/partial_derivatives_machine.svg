<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="knobGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="knobGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="940" height="460" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="470" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">
    PARTIAL DERIVATIVES: TUNING MULTIPLE KNOBS
  </text>
  <text x="470" y="68" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    When your AI model has multiple weights: Freeze all other knobs and nudge ONLY ONE at a time!
  </text>

  <!-- Left Panel: ∂Error / ∂w1 -->
  <g transform="translate(60, 100)">
    <rect width="380" height="320" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="190" y="35" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#60a5fa" text-anchor="middle">
      1. Partial wrt Weight 1 (∂f / ∂w₁)
    </text>

    <!-- Knob 1 (Active) -->
    <circle cx="100" cy="120" r="45" fill="url(#knobGrad1)" stroke="#60a5fa" stroke-width="3"/>
    <line x1="100" y1="120" x2="135" y2="90" stroke="#ffffff" stroke-width="4"/>
    <circle cx="100" cy="120" r="12" fill="#1e293b"/>
    <text x="100" y="190" font-family="monospace" font-size="13" font-weight="bold" fill="#93c5fd" text-anchor="middle">Knob w₁ (Nudged! 🤏)</text>

    <!-- Knob 2 (Frozen) -->
    <circle cx="280" cy="120" r="45" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="280" cy="120" r="12" fill="#1e293b"/>
    <text x="280" y="125" font-size="24" text-anchor="middle">🔒</text>
    <text x="280" y="190" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">Knob w₂ (FROZEN)</text>

    <!-- Explanation Box -->
    <rect x="20" y="220" width="340" height="80" rx="8" fill="#0f172a"/>
    <text x="190" y="248" font-family="monospace" font-size="12" fill="#38bdf8" text-anchor="middle">
      slope_w1 = (f(w1+h, w2) - f(w1, w2)) / h
    </text>
    <text x="190" y="278" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">
      Tells us: How does moving Knob 1 affect Error?
    </text>
  </g>

  <!-- Right Panel: ∂Error / ∂w2 -->
  <g transform="translate(500, 100)">
    <rect width="380" height="320" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="190" y="35" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#c084fc" text-anchor="middle">
      2. Partial wrt Weight 2 (∂f / ∂w₂)
    </text>

    <!-- Knob 1 (Frozen) -->
    <circle cx="100" cy="120" r="45" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="100" cy="120" r="12" fill="#1e293b"/>
    <text x="100" y="125" font-size="24" text-anchor="middle">🔒</text>
    <text x="100" y="190" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">Knob w₁ (FROZEN)</text>

    <!-- Knob 2 (Active) -->
    <circle cx="280" cy="120" r="45" fill="url(#knobGrad2)" stroke="#a855f7" stroke-width="3"/>
    <line x1="280" y1="120" x2="315" y2="90" stroke="#ffffff" stroke-width="4"/>
    <circle cx="280" cy="120" r="12" fill="#1e293b"/>
    <text x="280" y="190" font-family="monospace" font-size="13" font-weight="bold" fill="#d8b4fe" text-anchor="middle">Knob w₂ (Nudged! 🤏)</text>

    <!-- Explanation Box -->
    <rect x="20" y="220" width="340" height="80" rx="8" fill="#0f172a"/>
    <text x="190" y="248" font-family="monospace" font-size="12" fill="#c084fc" text-anchor="middle">
      slope_w2 = (f(w1, w2+h) - f(w1, w2)) / h
    </text>
    <text x="190" y="278" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">
      Tells us: How does moving Knob 2 affect Error?
    </text>
  </g>
</svg>
