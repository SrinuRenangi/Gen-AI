<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="gw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="gw-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="gw-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="gw-arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="gw-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#gw-bg)" />

  <!-- Header -->
  <text x="480" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    ENTERPRISE MULTI-PROVIDER RESILIENCY GATEWAY
  </text>
  <text x="480" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">
    Unified Client Interface + Token Cost Accounting + Automatic Outage Failover &amp; Local Fallback
  </text>

  <g transform="translate(35, 80)" filter="url(#gw-shadow)">

    <!-- 1. Client App & Unified Gateway (Left) -->
    <g transform="translate(0, 0)">
      <rect width="250" height="440" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
      <rect x="0" y="0" width="250" height="34" rx="12" fill="#0369a1" />
      <text x="125" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
        UNIFIED API GATEWAY
      </text>

      <!-- App Caller Box -->
      <g transform="translate(20, 50)">
        <rect width="210" height="85" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="105" y="26" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle">
          Client Application
        </text>
        <text x="105" y="46" font-family="sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Single Uniform Call:</text>
        <text x="105" y="65" font-family="monospace" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">
          gateway.complete(prompt)
        </text>
      </g>

      <!-- Gateway Internal Engine -->
      <g transform="translate(20, 150)">
        <rect width="210" height="260" rx="8" fill="#0f172a" stroke="#0284c7" />
        <text x="105" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#93c5fd" text-anchor="middle">
          Gateway Policies
        </text>

        <g transform="translate(15, 38)">
          <text x="0" y="14" font-family="sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Token Budget Monitor</text>
          <text x="0" y="30" font-family="sans-serif" font-size="9" fill="#94a3b8">  Prevents run-away API bills</text>

          <text x="0" y="52" font-family="sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Jittered Backoff Engine</text>
          <text x="0" y="68" font-family="monospace" font-size="9" fill="#38bdf8">  T = min(T_max, 2^n) + rand</text>

          <text x="0" y="90" font-family="sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Circuit Breaker Matrix</text>
          <text x="0" y="106" font-family="sans-serif" font-size="9" fill="#94a3b8">  Auto-trips on 3x consecutive 503s</text>

          <text x="0" y="128" font-family="sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">• Universal Message Normalizer</text>
          <text x="0" y="144" font-family="sans-serif" font-size="9" fill="#94a3b8">  Translates OpenAI &harr; Claude &harr; Ollama</text>

          <rect x="0" y="165" width="180" height="42" rx="4" fill="#064e3b" />
          <text x="90" y="184" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#a7f3d0" text-anchor="middle">
            99.999% AVAILABILITY
          </text>
          <text x="90" y="198" font-family="sans-serif" font-size="8.5" fill="#d1fae5" text-anchor="middle">
            Zero Customer Outage Impact
          </text>
        </g>
      </g>
    </g>

    <!-- Connectors -->
    <path d="M 255 120 L 310 120" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#gw-arrow-blue)" />
    <path d="M 255 240 L 310 240" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#gw-arrow-rose)" />
    <path d="M 255 370 L 310 370" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#gw-arrow-green)" />

    <!-- 2. The 3 Failover Provider Tiers (Right) -->
    <g transform="translate(320, 0)">

      <!-- TIER 1: PRIMARY (OPENAI) -->
      <g transform="translate(0, 0)">
        <rect width="570" height="130" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.8" />
        <rect x="0" y="0" width="570" height="28" rx="10" fill="#065f46" />
        <text x="15" y="19" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">
          TIER 1 (PRIMARY): OPENAI CLOUD
        </text>
        <text x="555" y="19" font-family="sans-serif" font-size="10" font-weight="800" fill="#a7f3d0" text-anchor="end">
          STATUS: ACTIVE
        </text>

        <g transform="translate(20, 42)">
          <text x="0" y="14" font-family="monospace" font-size="12" font-weight="700" fill="#6ee7b7">Model: gpt-4o / gpt-4o-mini</text>
          <text x="0" y="34" font-family="sans-serif" font-size="10" fill="#cbd5e1">Endpoints: api.openai.com/v1/chat/completions</text>
          <text x="0" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8">Fastest TTFT, lowest cost for high-volume general reasoning.</text>
          <rect x="380" y="15" width="160" height="50" rx="6" fill="#450a0a" stroke="#ef4444" />
          <text x="460" y="35" font-family="sans-serif" font-size="9" font-weight="800" fill="#fca5a5" text-anchor="middle">FAILOVER TRIGGER:</text>
          <text x="460" y="52" font-family="monospace" font-size="9" fill="#fee2e2" text-anchor="middle">HTTP 429 / 503 Outage</text>
        </g>
      </g>

      <!-- TIER 2: SECONDARY (ANTHROPIC) -->
      <g transform="translate(0, 150)">
        <rect width="570" height="130" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8" />
        <rect x="0" y="0" width="570" height="28" rx="10" fill="#b45309" />
        <text x="15" y="19" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">
          TIER 2 (SECONDARY FAILOVER): ANTHROPIC CLAUDE
        </text>
        <text x="555" y="19" font-family="sans-serif" font-size="10" font-weight="800" fill="#fde68a" text-anchor="end">
          STATUS: HOT STANDBY
        </text>

        <g transform="translate(20, 42)">
          <text x="0" y="14" font-family="monospace" font-size="12" font-weight="700" fill="#fcd34d">Model: claude-3-5-sonnet-20241022</text>
          <text x="0" y="34" font-family="sans-serif" font-size="10" fill="#cbd5e1">Endpoints: api.anthropic.com/v1/messages</text>
          <text x="0" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8">Exceptional coding depth, 200k context window, nuanced writing.</text>
          <rect x="380" y="15" width="160" height="50" rx="6" fill="#450a0a" stroke="#ef4444" />
          <text x="460" y="35" font-family="sans-serif" font-size="9" font-weight="800" fill="#fca5a5" text-anchor="middle">FAILOVER TRIGGER:</text>
          <text x="460" y="52" font-family="monospace" font-size="9" fill="#fee2e2" text-anchor="middle">Multi-Region Cloud Failure</text>
        </g>
      </g>

      <!-- TIER 3: LOCAL ON-PREM FALLBACK (OLLAMA / VLLM) -->
      <g transform="translate(0, 300)">
        <rect width="570" height="135" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.8" />
        <rect x="0" y="0" width="570" height="28" rx="10" fill="#7e22ce" />
        <text x="15" y="19" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">
          TIER 3 (AIR-GAPPED ON-PREM FALLBACK): OLLAMA / VLLM
        </text>
        <text x="555" y="19" font-family="sans-serif" font-size="10" font-weight="800" fill="#f3e8ff" text-anchor="end">
          STATUS: 100% OFFLINE IMMUNITY
        </text>

        <g transform="translate(20, 42)">
          <text x="0" y="14" font-family="monospace" font-size="12" font-weight="700" fill="#d8b4fe">Model: llama-3.1-8b-instruct (Q4_K_M)</text>
          <text x="0" y="34" font-family="sans-serif" font-size="10" fill="#cbd5e1">Endpoints: localhost:11434/v1/chat/completions (OpenAI compatible!)</text>
          <text x="0" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8">Zero internet dependency, zero data leaks, zero rate-limit errors!</text>
          <rect x="380" y="15" width="160" height="50" rx="6" fill="#064e3b" stroke="#10b981" />
          <text x="460" y="35" font-family="sans-serif" font-size="9" font-weight="800" fill="#a7f3d0" text-anchor="middle">GUARANTEED UPTIME:</text>
          <text x="460" y="52" font-family="monospace" font-size="9" fill="#d1fae5" text-anchor="middle">Runs on Local GPU / CPU</text>
        </g>
      </g>

    </g>

  </g>
</svg>
