<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="torch-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg-grad)" />

  <!-- Title Banner -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    THE PYTORCH ARCHITECTURAL BLUEPRINT
  </text>
  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Deconstructing Tensors, Dynamic Autograd, nn.Module, and the Sacred 5-Step Training Loop
  </text>

  <!-- Top 3 Core Pillars -->
  <g transform="translate(40, 95)">

    <!-- Pillar 1: Torch Tensor -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="270" height="230" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="0" y="0" width="270" height="28" rx="10" fill="#0284c7" />
      <text x="135" y="19" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1. TORCH TENSORS</text>
      
      <rect x="15" y="42" width="240" height="80" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="25" y="62" font-family="monospace" font-size="10" fill="#38bdf8">x = torch.tensor([1.0, 2.0])</text>
      <text x="25" y="80" font-family="monospace" font-size="10" fill="#fbbf24">x.requires_grad = True</text>
      <text x="25" y="98" font-family="monospace" font-size="10" fill="#34d399">x = x.to('cuda')</text>
      <text x="25" y="114" font-family="sans-serif" font-size="9" fill="#94a3b8">NumPy array + GPU + Autograd</text>

      <text x="15" y="145" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Key Capabilities:</text>
      <text x="15" y="165" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Zero-overhead bridge with NumPy</text>
      <text x="15" y="185" font-family="sans-serif" font-size="10" fill="#cbd5e1">• 100x acceleration on CUDA VRAM</text>
      <text x="15" y="205" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Automatic memory reclamation</text>
    </g>

    <!-- Pillar 2: Dynamic Autograd -->
    <g transform="translate(305, 0)" filter="url(#shadow)">
      <rect width="270" height="230" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
      <rect x="0" y="0" width="270" height="28" rx="10" fill="url(#torch-grad)" />
      <text x="135" y="19" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2. DYNAMIC AUTOGRAD</text>

      <rect x="15" y="42" width="240" height="80" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="25" y="62" font-family="monospace" font-size="10" fill="#f97316">y = (x ** 2) + 3</text>
      <text x="25" y="80" font-family="monospace" font-size="10" fill="#f87171">y.backward()</text>
      <text x="25" y="98" font-family="monospace" font-size="10" fill="#34d399">print(x.grad)  # &rarr; 2x</text>
      <text x="25" y="114" font-family="sans-serif" font-size="9" fill="#94a3b8">Graph built dynamically on the fly</text>

      <text x="15" y="145" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Key Capabilities:</text>
      <text x="15" y="165" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Define-by-Run: No static compile</text>
      <text x="15" y="185" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Use standard Python if/for loops</text>
      <text x="15" y="205" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Inspect with standard debugger</text>
    </g>

    <!-- Pillar 3: nn.Module Container -->
    <g transform="translate(610, 0)" filter="url(#shadow)">
      <rect width="270" height="230" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <rect x="0" y="0" width="270" height="28" rx="10" fill="#7c3aed" />
      <text x="135" y="19" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3. nn.Module ARCHITECTURE</text>

      <rect x="15" y="42" width="240" height="80" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="25" y="62" font-family="monospace" font-size="10" fill="#c084fc">class Net(nn.Module):</text>
      <text x="25" y="80" font-family="monospace" font-size="10" fill="#cbd5e1">  def __init__(self): ...</text>
      <text x="25" y="98" font-family="monospace" font-size="10" fill="#c084fc">  def forward(self, x):</text>
      <text x="25" y="114" font-family="monospace" font-size="9" fill="#38bdf8">    return self.net(x)</text>

      <text x="15" y="145" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Key Capabilities:</text>
      <text x="15" y="165" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Tracks parameters automatically</text>
      <text x="15" y="185" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Instant serialization (.state_dict())</text>
      <text x="15" y="205" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Seamless model.eval() &amp; train()</text>
    </g>
  </g>

  <!-- Bottom Panel: The Sacred 5-Step Training Loop -->
  <g transform="translate(40, 345)" filter="url(#shadow)">
    <rect width="880" height="135" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="880" height="26" rx="10" fill="#065f46" />
    <text x="440" y="18" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      THE SACRED 5-STEP PYTORCH TRAINING LOOP
    </text>

    <!-- 5 Steps Horizontal Pipeline -->
    <!-- Step 1 -->
    <g transform="translate(15, 40)">
      <rect width="155" height="75" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="77" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">STEP 1: ZERO GRADS</text>
      <text x="77" y="44" font-family="monospace" font-size="10" fill="#f8fafc" text-anchor="middle">optimizer.zero_grad()</text>
      <text x="77" y="62" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Clears previous accumulation</text>
    </g>

    <line x1="175" y1="78" x2="190" y2="78" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 2 -->
    <g transform="translate(190, 40)">
      <rect width="155" height="75" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="77" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">STEP 2: FORWARD</text>
      <text x="77" y="44" font-family="monospace" font-size="10" fill="#f8fafc" text-anchor="middle">outputs = model(X)</text>
      <text x="77" y="62" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Computes predictions &amp; DAG</text>
    </g>

    <line x1="350" y1="78" x2="365" y2="78" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 3 -->
    <g transform="translate(365, 40)">
      <rect width="155" height="75" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="77" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#f87171" text-anchor="middle">STEP 3: LOSS</text>
      <text x="77" y="44" font-family="monospace" font-size="10" fill="#f8fafc" text-anchor="middle">loss = criterion(out, y)</text>
      <text x="77" y="62" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Calculates scalar error</text>
    </g>

    <line x1="525" y1="78" x2="540" y2="78" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 4 -->
    <g transform="translate(540, 40)">
      <rect width="155" height="75" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
      <text x="77" y="22" font-family="sans-serif" font-size="10" font-weight="800" fill="#f87171" text-anchor="middle">STEP 4: BACKPROP</text>
      <text x="77" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">loss.backward()</text>
      <text x="77" y="62" font-family="sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">Populates all .grad attributes</text>
    </g>

    <line x1="700" y1="78" x2="715" y2="78" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 5 -->
    <g transform="translate(715, 40)">
      <rect width="150" height="75" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="75" y="22" font-family="sans-serif" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle">STEP 5: UPDATE</text>
      <text x="75" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">optimizer.step()</text>
      <text x="75" y="62" font-family="sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">Adjusts weights via Adam/SGD</text>
    </g>
  </g>

  <!-- Bottom Callout Footer -->
  <rect x="40" y="500" width="880" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="526" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    <tspan fill="#ea580c" font-weight="700">Why zero_grad() is Mandatory: </tspan> By design, PyTorch <tspan fill="#fca5a5" font-weight="700">accumulates</tspan> gradients on each backward pass. If you omit <tspan fill="#f1f5f9" font-family="monospace">optimizer.zero_grad()</tspan>, gradients sum up across batches and explode!
  </text>
</svg>
