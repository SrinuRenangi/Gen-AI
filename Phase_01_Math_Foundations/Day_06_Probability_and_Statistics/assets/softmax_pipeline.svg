<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Header Title -->
  <text x="500" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    THE SOFTMAX PIPELINE: FROM RAW LOGITS TO PROBABILITIES
  </text>
  <text x="500" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    How Deep Learning &amp; LLMs convert raw unconstrained scores into valid 100% confidence percentages
  </text>

  <!-- STEP 1: RAW LOGITS -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="180" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect width="180" height="42" rx="12" fill="url(#cardGrad1)"/>
    <rect y="30" width="180" height="12" fill="url(#cardGrad1)"/>
    <text x="90" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">STEP 1: RAW LOGITS</text>
    
    <text x="90" y="75" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Neural Net Output (z)</text>

    <!-- Score 1 -->
    <rect x="20" y="95" width="140" height="50" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="35" y="125" font-family="sans-serif" font-size="13" fill="#cbd5e1">Cat:</text>
    <text x="140" y="126" font-family="monospace" font-size="16" font-weight="bold" fill="#f87171" text-anchor="end">+2.5</text>

    <!-- Score 2 -->
    <rect x="20" y="160" width="140" height="50" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="35" y="190" font-family="sans-serif" font-size="13" fill="#cbd5e1">Dog:</text>
    <text x="140" y="191" font-family="monospace" font-size="16" font-weight="bold" fill="#f87171" text-anchor="end">+1.0</text>

    <!-- Score 3 -->
    <rect x="20" y="225" width="140" height="50" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="35" y="255" font-family="sans-serif" font-size="13" fill="#cbd5e1">Bird:</text>
    <text x="140" y="256" font-family="monospace" font-size="16" font-weight="bold" fill="#f87171" text-anchor="end">-0.5</text>

    <text x="90" y="305" font-family="sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">❌ Problem: Has negatives</text>
    <text x="90" y="322" font-family="sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">❌ Sum = 3.0 (Not 100%)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 230 280 L 270 280" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4" fill="none"/>
  <polygon points="275,280 265,274 265,286" fill="#f59e0b"/>

  <!-- STEP 2: EXPONENTIATE -->
  <g transform="translate(285, 110)" filter="url(#shadow)">
    <rect width="180" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect width="180" height="42" rx="12" fill="url(#cardGrad2)"/>
    <rect y="30" width="180" height="12" fill="url(#cardGrad2)"/>
    <text x="90" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">STEP 2: e^(z)</text>
    
    <text x="90" y="75" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Euler's Exponentiation</text>

    <!-- Exp 1 -->
    <rect x="20" y="95" width="140" height="50" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="28" y="125" font-family="monospace" font-size="12" fill="#cbd5e1">e^2.5 =</text>
    <text x="145" y="126" font-family="monospace" font-size="15" font-weight="bold" fill="#fbbf24" text-anchor="end">12.182</text>

    <!-- Exp 2 -->
    <rect x="20" y="160" width="140" height="50" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="28" y="190" font-family="monospace" font-size="12" fill="#cbd5e1">e^1.0 =</text>
    <text x="145" y="191" font-family="monospace" font-size="15" font-weight="bold" fill="#fbbf24" text-anchor="end">2.718</text>

    <!-- Exp 3 -->
    <rect x="20" y="225" width="140" height="50" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="28" y="255" font-family="monospace" font-size="12" fill="#cbd5e1">e^-0.5 =</text>
    <text x="145" y="256" font-family="monospace" font-size="15" font-weight="bold" fill="#fbbf24" text-anchor="end">0.606</text>

    <text x="90" y="305" font-family="sans-serif" font-size="11" fill="#fde68a" text-anchor="middle">✅ All numbers now &gt; 0</text>
    <text x="90" y="322" font-family="sans-serif" font-size="11" fill="#fde68a" text-anchor="middle">✅ Top choice magnified!</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 475 280 L 515 280" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,4" fill="none"/>
  <polygon points="520,280 510,274 510,286" fill="#3b82f6"/>

  <!-- STEP 3: SUM EXPONENTIALS -->
  <g transform="translate(530, 110)" filter="url(#shadow)">
    <rect width="180" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect width="180" height="42" rx="12" fill="url(#cardGrad3)"/>
    <rect y="30" width="180" height="12" fill="url(#cardGrad3)"/>
    <text x="90" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">STEP 3: SUM (∑ e^z)</text>
    
    <text x="90" y="75" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">The Normalizer</text>

    <rect x="20" y="105" width="140" height="130" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="135" font-family="monospace" font-size="12" fill="#93c5fd" text-anchor="middle">12.182</text>
    <text x="90" y="160" font-family="monospace" font-size="12" fill="#93c5fd" text-anchor="middle">+  2.718</text>
    <text x="90" y="185" font-family="monospace" font-size="12" fill="#93c5fd" text-anchor="middle">+  0.606</text>
    <line x1="35" y1="195" x2="145" y2="195" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="222" font-family="monospace" font-size="16" font-weight="bold" fill="#60a5fa" text-anchor="middle">15.506</text>

    <text x="90" y="295" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">This total serves as</text>
    <text x="90" y="312" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">the common denominator</text>
    <text x="90" y="329" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">for normalization</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 720 280 L 760 280" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" fill="none"/>
  <polygon points="765,280 755,274 755,286" fill="#10b981"/>

  <!-- STEP 4: PROBABILITIES -->
  <g transform="translate(775, 110)" filter="url(#shadow)">
    <rect width="185" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect width="185" height="42" rx="12" fill="url(#cardGrad4)"/>
    <rect y="30" width="185" height="12" fill="url(#cardGrad4)"/>
    <text x="92" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">STEP 4: PROBABILITIES</text>
    
    <text x="92" y="75" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">e^z / ∑ e^z</text>

    <!-- Prob 1 -->
    <rect x="15" y="95" width="155" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="125" font-family="sans-serif" font-size="12" fill="#cbd5e1">Cat:</text>
    <text x="160" y="126" font-family="monospace" font-size="15" font-weight="bold" fill="#34d399" text-anchor="end">78.5%</text>

    <!-- Prob 2 -->
    <rect x="15" y="160" width="155" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="190" font-family="sans-serif" font-size="12" fill="#cbd5e1">Dog:</text>
    <text x="160" y="191" font-family="monospace" font-size="15" font-weight="bold" fill="#34d399" text-anchor="end">17.5%</text>

    <!-- Prob 3 -->
    <rect x="15" y="225" width="155" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="255" font-family="sans-serif" font-size="12" fill="#cbd5e1">Bird:</text>
    <text x="160" y="256" font-family="monospace" font-size="15" font-weight="bold" fill="#34d399" text-anchor="end">3.9%</text>

    <text x="92" y="305" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="middle">🎉 TOTAL = 100.0%!</text>
    <text x="92" y="322" font-family="sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">Prediction: Cat! 🐱</text>
  </g>

  <!-- Footer Banner -->
  <text x="500" y="490" font-family="monospace" font-size="13" fill="#cbd5e1" text-anchor="middle">
    Softmax Formula: S(z_i) = exp(z_i) / sum(exp(z_j))  |  Valid across any range of numbers!
  </text>
</svg>
