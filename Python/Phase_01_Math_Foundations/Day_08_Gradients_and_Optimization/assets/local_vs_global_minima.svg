<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <radialGradient id="ballRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <radialGradient id="ballGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="260" y="24" width="430" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="51" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    🏔️ Local Minima vs. Global Minimum
  </text>

  <!-- Subtitle -->
  <text x="475" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    Why AI Loss Landscapes have potholes, and how optimization reaches the true bottom
  </text>

  <!-- Axes -->
  <line x1="80" y1="410" x2="880" y2="410" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="410" x2="80" y2="120" stroke="#475569" stroke-width="2"/>
  <!-- Arrow heads -->
  <polygon points="880,405 892,410 880,415" fill="#475569"/>
  <polygon points="75,120 80,108 85,120" fill="#475569"/>

  <text x="885" y="432" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Weight Parameter (W)</text>
  <text x="35" y="115" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Loss (Error)</text>

  <!-- Loss Curve Landscape -->
  <!-- Starts high at (100, 160), dips to local min at (320, 270), rises to bump at (460, 210), dips to global min at (680, 370), rises up to (850, 180) -->
  <path d="M 100 160 
           C 160 170, 220 270, 320 270 
           C 380 270, 410 210, 470 210 
           C 540 210, 580 370, 680 370 
           C 760 370, 810 210, 850 180" 
        fill="none" stroke="url(#curveGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Shaded Area Under Curve -->
  <path d="M 100 160 
           C 160 170, 220 270, 320 270 
           C 380 270, 410 210, 470 210 
           C 540 210, 580 370, 680 370 
           C 760 370, 810 210, 850 180 
           L 850 410 L 100 410 Z" 
        fill="#3b82f6" fill-opacity="0.04"/>

  <!-- Tangent line at Local Min (flat slope) -->
  <line x1="260" y1="270" x2="380" y2="270" stroke="#f87171" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Ball at Local Minimum -->
  <circle cx="320" cy="254" r="16" fill="url(#ballRed)" filter="url(#shadow)"/>

  <!-- Tangent line at Global Min (flat slope) -->
  <line x1="620" y1="370" x2="740" y2="370" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Ball at Global Minimum -->
  <circle cx="680" cy="354" r="16" fill="url(#ballGreen)" filter="url(#shadow)"/>

  <!-- Card: Local Minimum -->
  <g transform="translate(160, 100)" filter="url(#shadow)">
    <rect width="250" height="110" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="15" y="26" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">⚠️ Local Minimum (Trap)</text>
    <text x="15" y="48" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• Slope = 0 (Ground feels flat!)</text>
    <text x="15" y="68" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• Error is still significantly high</text>
    <text x="15" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Naive optimizer stops here thinking it won</text>
    <line x1="125" y1="110" x2="160" y2="154" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Card: Global Minimum -->
  <g transform="translate(560, 110)" filter="url(#shadow)">
    <rect width="270" height="120" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="26" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">🎯 Global Minimum (The Goal!)</text>
    <text x="15" y="48" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• Slope = 0 (Ground is perfectly flat)</text>
    <text x="15" y="68" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• Absolute lowest error possible</text>
    <text x="15" y="88" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">The optimal neural network weights!</text>
    <text x="15" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Escaped with Momentum / Adam / SGD</text>
  </g>

  <!-- Bottom Insight Footer -->
  <rect x="120" y="435" width="710" height="32" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <text x="475" y="456" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">
    💡 <tspan fill="#38bdf8" font-weight="600">Modern AI Secret:</tspan> High-dimensional spaces have billions of dimensions, making true local traps rare (saddle points exist instead!).
  </text>
</svg>
