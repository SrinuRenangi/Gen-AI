<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="rowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="colGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="520" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="250" y="20" width="450" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    📊 Anatomy of a Matrix: Rows, Columns & Indexing
  </text>

  <!-- Subtitle -->
  <text x="475" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    The golden rule: Always ROWS first, then COLUMNS (Shape = M × N, Index = [row][col])
  </text>

  <!-- Main Visual Grid (Left Side: The Matrix Table) -->
  <g transform="translate(60, 110)">
    <!-- Column Headers Indicator -->
    <rect x="130" y="0" width="100" height="30" rx="6" fill="#047857" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="180" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Col 0</text>

    <rect x="240" y="0" width="100" height="30" rx="6" fill="#047857" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="290" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Col 1</text>

    <rect x="350" y="0" width="100" height="30" rx="6" fill="#047857" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="400" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Col 2</text>

    <!-- Row 0 Indicator -->
    <rect x="20" y="40" width="100" height="70" rx="6" fill="#1d4ed8" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="80" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Row 0 →</text>

    <!-- Row 1 Indicator -->
    <rect x="20" y="120" width="100" height="70" rx="6" fill="#1d4ed8" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="160" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Row 1 →</text>

    <!-- Row 2 Indicator -->
    <rect x="20" y="200" width="100" height="70" rx="6" fill="#1d4ed8" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="240" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Row 2 →</text>

    <!-- Grid Cells -->
    <!-- Row 0 -->
    <rect x="130" y="40" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="180" y="75" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" text-anchor="middle">12</text>
    <text x="180" y="95" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">[0][0]</text>

    <rect x="240" y="40" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="290" y="75" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" text-anchor="middle">45</text>
    <text x="290" y="95" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">[0][1]</text>

    <rect x="350" y="40" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="400" y="75" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" text-anchor="middle">78</text>
    <text x="400" y="95" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">[0][2]</text>

    <!-- Row 1 -->
    <rect x="130" y="120" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="180" y="155" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" text-anchor="middle">91</text>
    <text x="180" y="175" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">[1][0]</text>

    <!-- Highlighted Cell [1][1] -->
    <rect x="240" y="120" width="100" height="70" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="290" y="155" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" text-anchor="middle">33</text>
    <text x="290" y="175" fill="#fcd34d" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">[1][1] 🎯</text>

    <rect x="350" y="120" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="400" y="155" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" text-anchor="middle">64</text>
    <text x="400" y="175" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">[1][2]</text>

    <!-- Row 2 -->
    <rect x="130" y="200" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="180" y="235" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" text-anchor="middle">50</text>
    <text x="180" y="255" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">[2][0]</text>

    <rect x="240" y="200" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="290" y="235" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" text-anchor="middle">82</text>
    <text x="290" y="255" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">[2][1]</text>

    <rect x="350" y="200" width="100" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="400" y="235" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" text-anchor="middle">19</text>
    <text x="400" y="255" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">[2][2]</text>
  </g>

  <!-- Right Side Explanation Cards -->
  <g transform="translate(540, 110)">
    <!-- Card 1: Shape Notation -->
    <rect width="360" height="110" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="30" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">📐 Matrix Shape = 3 × 3</text>
    <text x="20" y="55" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• <tspan fill="#60a5fa" font-weight="600">Rows (M = 3):</tspan> len(matrix) → 3 inner lists</text>
    <text x="20" y="75" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• <tspan fill="#34d399" font-weight="600">Cols (N = 3):</tspan> len(matrix[0]) → 3 elements per row</text>
    <text x="20" y="95" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Memory Trick: "RC Cola" or "Row then Column"</text>

    <!-- Card 2: Accessing Elements in Python -->
    <rect y="130" width="360" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="158" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">🐍 Python Access Cheatsheet</text>
    <text x="20" y="185" fill="#e2e8f0" font-family="monospace" font-size="12">matrix[1][1]   # Target cell → 33</text>
    <text x="20" y="208" fill="#e2e8f0" font-family="monospace" font-size="12">matrix[0]      # Entire Row 0 → [12, 45, 78]</text>
    <text x="20" y="231" fill="#e2e8f0" font-family="monospace" font-size="12">[r[1] for r in matrix] # Col 1 → [45, 33, 82]</text>
    <text x="20" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">⚠️ Never do matrix[col][row] - that will flip your data!</text>
  </g>

  <!-- Bottom Tip Banner -->
  <rect x="60" y="450" width="840" height="42" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <text x="480" y="476" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">
    💡 <tspan fill="#38bdf8" font-weight="600">In AI & Deep Learning:</tspan> Every image is an (H × W) matrix of pixel values, and every dataset is a (Samples × Features) matrix!
  </text>
</svg>
