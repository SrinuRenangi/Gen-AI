<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="head-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg-grad)" />

  <!-- Header -->
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    MULTI-HEAD ATTENTION ARCHITECTURE
  </text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    MultiHead(Q, K, V) = Concat(head₁, head₂, ..., head_h) Wᴼ &mdash; Parallel Relational Subspaces
  </text>

  <!-- Main Multi-Head Architecture Box -->
  <g transform="translate(60, 85)" filter="url(#shadow)">
    <rect width="840" height="440" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- 1. Input Q, K, V (Bottom) -->
    <g transform="translate(260, 395)">
      <rect x="0" y="0" width="90" height="30" rx="6" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="45" y="20" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">V (d_model)</text>

      <rect x="115" y="0" width="90" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="160" y="20" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">K (d_model)</text>

      <rect x="230" y="0" width="90" height="30" rx="6" fill="#701a75" stroke="#f472b6" stroke-width="1.5" />
      <text x="275" y="20" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">Q (d_model)</text>
    </g>

    <!-- 2. Linear Projections (W_i^Q, W_i^K, W_i^V) -->
    <g transform="translate(140, 325)">
      <!-- Line connections from inputs to projection layer -->
      <line x1="165" y1="70" x2="280" y2="40" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
      <line x1="280" y1="70" x2="280" y2="40" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" />
      <line x1="395" y1="70" x2="280" y2="40" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="3,3" />

      <rect width="560" height="35" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
      <text x="280" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#cbd5e1" text-anchor="middle">
        LINEAR PROJECTIONS INTO h SUBSPACE HEADS (dₖ = dᵥ = d_model / h)
      </text>
    </g>

    <!-- 3. Parallel Attention Heads (The Multi-Head Swarm) -->
    <g transform="translate(50, 195)">
      <!-- Head 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="95" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
        <rect x="0" y="0" width="165" height="22" rx="8" fill="#1e3a8a" />
        <text x="82" y="15" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">HEAD 1: SYNTAX</text>
        <text x="82" y="44" font-family="monospace" font-size="10" fill="#93c5fd" text-anchor="middle">Scaled Dot-Product</text>
        <text x="82" y="60" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">dim: dₖ = 64</text>
        <text x="82" y="80" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle">Tracks: Verb &rarr; Object</text>
      </g>

      <!-- Head 2 -->
      <g transform="translate(190, 0)">
        <rect width="165" height="95" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
        <rect x="0" y="0" width="165" height="22" rx="8" fill="#064e3b" />
        <text x="82" y="15" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">HEAD 2: PRONOUNS</text>
        <text x="82" y="44" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">Scaled Dot-Product</text>
        <text x="82" y="60" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">dim: dₖ = 64</text>
        <text x="82" y="80" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle">Tracks: "it" &rarr; "dog"</text>
      </g>

      <!-- Head 3 (Ellipsis/Dots in middle) -->
      <g transform="translate(380, 0)">
        <rect width="165" height="95" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
        <rect x="0" y="0" width="165" height="22" rx="8" fill="#78350f" />
        <text x="82" y="15" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">HEAD 3: ENTITIES</text>
        <text x="82" y="44" font-family="monospace" font-size="10" fill="#fde68a" text-anchor="middle">Scaled Dot-Product</text>
        <text x="82" y="60" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">dim: dₖ = 64</text>
        <text x="82" y="80" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle">Tracks: Names &amp; Places</text>
      </g>

      <!-- Head h -->
      <g transform="translate(575, 0)">
        <rect width="165" height="95" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
        <rect x="0" y="0" width="165" height="22" rx="8" fill="#581c87" />
        <text x="82" y="15" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">HEAD h (e.g. 8 or 16)</text>
        <text x="82" y="44" font-family="monospace" font-size="10" fill="#e9d5ff" text-anchor="middle">Scaled Dot-Product</text>
        <text x="82" y="60" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">dim: dₖ = 64</text>
        <text x="82" y="80" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle">Tracks: Long-Range Topic</text>
      </g>
    </g>

    <!-- 4. Concatenation Layer -->
    <g transform="translate(140, 115)">
      <!-- Lines from 4 heads into Concat -->
      <line x1="-10" y1="80" x2="180" y2="35" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="180" y1="80" x2="250" y2="35" stroke="#10b981" stroke-width="1.5" />
      <line x1="370" y1="80" x2="310" y2="35" stroke="#f59e0b" stroke-width="1.5" />
      <line x1="565" y1="80" x2="380" y2="35" stroke="#c084fc" stroke-width="1.5" />

      <rect width="560" height="32" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="2" />
      <text x="280" y="21" font-family="monospace" font-size="11" font-weight="900" fill="#a7f3d0" text-anchor="middle">
        CONCAT(head₁, head₂, ..., head_h) &rarr; Shape: (N &times; [h &middot; dᵥ]) = (N &times; d_model)
      </text>
    </g>

    <!-- 5. Final Linear Projection W^O (Top) -->
    <g transform="translate(240, 35)">
      <line x1="180" y1="80" x2="180" y2="35" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)" />
      <rect width="360" height="35" rx="6" fill="url(#head-grad)" />
      <text x="180" y="22" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">
        FINAL LINEAR PROJECTION Wᴼ &rarr; OUTPUT (N &times; d_model)
      </text>
    </g>
  </g>
</svg>
