<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="230" y="20" width="490" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    🧠 Memory Layout: Python List vs. NumPy Array
  </text>

  <!-- Subtitle -->
  <text x="475" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    Why NumPy is 50x–100x faster: Scattered Heap Pointers vs. Contiguous C-Memory Blocks
  </text>

  <!-- Left Container: Python List -->
  <g transform="translate(60, 110)">
    <rect width="390" height="310" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="360" height="32" rx="6" fill="#991b1b" fill-opacity="0.2"/>
    <text x="195" y="36" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      ❌ Python List: [10, 20, 30]
    </text>

    <!-- Pointer List Box -->
    <rect x="25" y="65" width="100" height="150" rx="8" fill="#0b1329" stroke="#475569" stroke-width="1"/>
    <text x="75" y="85" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Pointers</text>
    
    <rect x="35" y="95" width="80" height="28" rx="4" fill="#334155"/>
    <text x="75" y="113" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">ptr -&gt; 0x4A</text>
    
    <rect x="35" y="130" width="80" height="28" rx="4" fill="#334155"/>
    <text x="75" y="148" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">ptr -&gt; 0x9B</text>

    <rect x="35" y="165" width="80" height="28" rx="4" fill="#334155"/>
    <text x="75" y="183" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">ptr -&gt; 0x1F</text>

    <!-- Scattered Memory Objects -->
    <!-- Object 1 -->
    <rect x="170" y="70" width="190" height="36" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="265" y="92" fill="#c7d2fe" font-family="monospace" font-size="11" text-anchor="middle">Int Object '10' (28 bytes)</text>
    <line x1="115" y1="109" x2="170" y2="88" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Object 2 -->
    <rect x="170" y="125" width="190" height="36" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="265" y="147" fill="#c7d2fe" font-family="monospace" font-size="11" text-anchor="middle">Int Object '20' (28 bytes)</text>
    <line x1="115" y1="144" x2="170" y2="143" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Object 3 -->
    <rect x="170" y="180" width="190" height="36" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="265" y="202" fill="#c7d2fe" font-family="monospace" font-size="11" text-anchor="middle">Int Object '30' (28 bytes)</text>
    <line x1="115" y1="179" x2="170" y2="198" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Bullet Points -->
    <text x="25" y="245" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• Scattered in RAM (Cache misses!)</text>
    <text x="25" y="268" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• Massive overhead: ~84 bytes for 3 numbers</text>
    <text x="25" y="291" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• Python interpreter type-checks each cell</text>
  </g>

  <!-- Right Container: NumPy Array -->
  <g transform="translate(500, 110)">
    <rect width="390" height="310" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="360" height="32" rx="6" fill="#065f46" fill-opacity="0.2"/>
    <text x="195" y="36" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      ✅ NumPy Array: np.array([10, 20, 30])
    </text>

    <!-- Contiguous Memory Block -->
    <rect x="25" y="85" width="340" height="85" rx="8" fill="#0b1329" stroke="#10b981" stroke-width="2"/>
    <text x="195" y="110" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      Single Contiguous Memory Block (Raw Bytes)
    </text>

    <!-- 3 adjacent cells -->
    <g transform="translate(45, 120)">
      <rect x="0" y="0" width="95" height="40" rx="4" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
      <text x="47" y="25" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">10</text>
      <text x="47" y="52" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">8 bytes</text>

      <rect x="102" y="0" width="95" height="40" rx="4" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
      <text x="149" y="25" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">20</text>
      <text x="149" y="52" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">8 bytes</text>

      <rect x="204" y="0" width="95" height="40" rx="4" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
      <text x="251" y="25" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">30</text>
      <text x="251" y="52" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">8 bytes</text>
    </g>

    <!-- Bullet Points -->
    <text x="25" y="245" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• 100% Contiguous in RAM (Blazing CPU Cache Hits!)</text>
    <text x="25" y="268" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• Zero pointer overhead: Exactly 24 bytes total</text>
    <text x="25" y="291" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">• Vectorized SIMD hardware execution in C</text>
  </g>

  <!-- Bottom Tip Banner -->
  <rect x="60" y="435" width="830" height="32" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <text x="475" y="456" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">
    🚀 <tspan fill="#38bdf8" font-weight="600">Hardware Reality:</tspan> Contiguous memory allows modern CPUs to load entire blocks into L1/L2 cache and run vector math in a single CPU cycle!
  </text>
</svg>
