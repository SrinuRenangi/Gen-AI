<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="500" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="230" y="20" width="490" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    🛡️ The 2D Decision Boundary: Drawing the Dividing Line
  </text>

  <!-- Subtitle -->
  <text x="475" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    Where the Sigmoid Probability = 0.50 (w₁·x₁ + w₂·x₂ + b = 0)
  </text>

  <!-- Left Side: 2D Feature Space Plot (Center at 300, 270) -->
  <g transform="translate(60, 110)">
    <!-- Shaded Regions -->
    <!-- Region 1: Buy (Green background upper-right) -->
    <polygon points="60,280 440,80 440,40 60,40" fill="#10b981" fill-opacity="0.08"/>
    <!-- Region 0: No Buy (Red background lower-left) -->
    <polygon points="60,280 440,80 440,280 60,280" fill="#ef4444" fill-opacity="0.08"/>

    <!-- Axes -->
    <line x1="60" y1="280" x2="460" y2="280" stroke="#64748b" stroke-width="2"/>
    <line x1="60" y1="280" x2="60" y2="40" stroke="#64748b" stroke-width="2"/>
    <polygon points="460,275 472,280 460,285" fill="#64748b"/>
    <polygon points="55,40 60,28 65,40" fill="#64748b"/>

    <text x="460" y="305" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Feature 1: Age (x₁)</text>
    <text x="50" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Feature 2: Salary (x₂)</text>

    <!-- The Decision Boundary Line: from (80, 270) to (420, 90) -->
    <line x1="80" y1="270" x2="420" y2="90" stroke="#f59e0b" stroke-width="3.5" stroke-dasharray="6 3" filter="url(#shadow)"/>
    <text x="320" y="125" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700" transform="rotate(-28 320 125)">
      Decision Boundary (P = 0.50)
    </text>

    <!-- Red Dots: Did Not Buy (y = 0) -->
    <circle cx="100" cy="240" r="7" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
    <circle cx="140" cy="210" r="7" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
    <circle cx="180" cy="250" r="7" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
    <circle cx="210" cy="200" r="7" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
    <circle cx="120" cy="170" r="7" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
    <circle cx="260" cy="230" r="7" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>

    <!-- Green Dots: Bought (y = 1) -->
    <circle cx="260" cy="110" r="7" fill="#10b981" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="310" cy="80"  r="7" fill="#10b981" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="340" cy="140" r="7" fill="#10b981" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="380" cy="95"  r="7" fill="#10b981" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="410" cy="65"  r="7" fill="#10b981" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="300" cy="160" r="7" fill="#10b981" stroke="#86efac" stroke-width="1.5"/>
  </g>

  <!-- Right Side: Explanation Cards -->
  <g transform="translate(560, 110)">
    <!-- Card 1: Boundary Formula -->
    <rect width="340" height="95" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="28" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">📐 The Boundary Equation</text>
    <text x="20" y="58" fill="#f8fafc" font-family="monospace" font-size="15" font-weight="700">
      w₁·x₁ + w₂·x₂ + b = 0
    </text>
    <text x="20" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      At this line, raw logit z = 0 → Sigmoid(0) = exactly 0.50!
    </text>

    <!-- Card 2: Probability Zones -->
    <rect y="115" width="340" height="110" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="142" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">🎯 The Two Zones</text>
    <text x="20" y="170" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      • <tspan font-weight="700">Above the Line:</tspan> P(Buy) &gt; 0.50 → Class 1
    </text>
    <text x="20" y="195" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      • <tspan font-weight="700">Below the Line:</tspan> P(Buy) &lt; 0.50 → Class 0
    </text>
    <text x="20" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
      Further away from line = higher confidence (e.g. 99% or 1%)
    </text>

    <!-- Card 3: In Neural Networks -->
    <rect y="245" width="340" height="75" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="272" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">🤖 Connection to Neural Nets</text>
    <text x="20" y="295" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      A single artificial neuron with a Sigmoid activation is literally a Logistic Regression model!
    </text>
  </g>

  <!-- Bottom Tip Banner -->
  <rect x="60" y="445" width="840" height="35" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <text x="480" y="468" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">
    💡 <tspan fill="#38bdf8" font-weight="600">Threshold Flexibility:</tspan> In cancer diagnosis, we lower the threshold to 0.20 to catch even faint possibilities of disease!
  </text>
</svg>
