<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="api-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="api-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#api-bg)" />

  <!-- Header -->
  <text x="480" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    LLM API REQUEST LIFECYCLE &amp; SSE TOKEN STREAMING
  </text>
  <text x="480" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">
    Contrasting High-Latency Blocking JSON vs Real-Time Server-Sent Events (SSE) Stream
  </text>

  <!-- Main Comparison Columns -->
  <g transform="translate(40, 85)" filter="url(#api-shadow)">

    <!-- LEFT: Blocking Request (Bad UX) -->
    <g transform="translate(0, 0)">
      <rect width="425" height="435" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.8" />
      <rect x="0" y="0" width="425" height="32" rx="12" fill="#881337" />
      <text x="212" y="21" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffe4e6" text-anchor="middle">
        1. STANDARD BLOCKING REQUEST (HIGH PERCEIVED LATENCY)
      </text>

      <!-- Client & Server Timeline -->
      <g transform="translate(20, 48)">
        <rect width="385" height="150" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="15" y="22" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#fca5a5">TIMELINE: 0 TO 8 SECONDS</text>

        <!-- t=0 Send -->
        <circle cx="35" cy="45" r="5" fill="#38bdf8" />
        <text x="50" y="49" font-family="sans-serif" font-size="10" fill="#cbd5e1">t = 0.0s: POST /v1/chat/completions (stream=false)</text>

        <!-- Dead Time / Spinner -->
        <rect x="35" y="60" width="320" height="40" rx="4" fill="#450a0a" stroke="#ef4444" stroke-dasharray="3 3" />
        <text x="195" y="85" font-family="sans-serif" font-size="11" font-weight="800" fill="#fca5a5" text-anchor="middle">
          ⏳ USER WAITS IN TOTAL SILENCE (8,200 ms)
        </text>

        <!-- t=8.2s Return -->
        <circle cx="35" cy="120" r="5" fill="#f43f5e" />
        <text x="50" y="124" font-family="sans-serif" font-size="10" fill="#cbd5e1">t = 8.2s: Complete 600-word JSON payload arrives all at once</text>
      </g>

      <!-- Metrics -->
      <g transform="translate(20, 215)">
        <rect width="385" height="95" rx="8" fill="#0f172a" stroke="#475569" />
        <text x="15" y="22" font-family="sans-serif" font-size="10" font-weight="800" fill="#94a3b8">PERFORMANCE PROFILE:</text>
        <text x="15" y="44" font-family="sans-serif" font-size="10" fill="#fee2e2">• Time to First Token (TTFT): <tspan font-weight="800" fill="#f87171">8,200 ms (Horrible UX!)</tspan></text>
        <text x="15" y="64" font-family="sans-serif" font-size="10" fill="#fee2e2">• User Perception: Feels frozen, unresponsive, or crashed</text>
        <text x="15" y="84" font-family="sans-serif" font-size="10" fill="#fee2e2">• Gateway Timeouts: Frequent 504 errors on long documents</text>
      </g>

      <!-- Code snippet -->
      <g transform="translate(20, 325)">
        <rect width="385" height="90" rx="6" fill="#0f172a" stroke="#1e293b" />
        <text x="12" y="20" font-family="monospace" font-size="9" fill="#94a3b8"># Blocking Client Call</text>
        <text x="12" y="36" font-family="monospace" font-size="9" fill="#fca5a5">response = client.chat.completions.create(</text>
        <text x="12" y="52" font-family="monospace" font-size="9" fill="#cbd5e1">    model="gpt-4o", messages=msgs, <tspan fill="#f87171">stream=False</tspan></text>
        <text x="12" y="68" font-family="monospace" font-size="9" fill="#fca5a5">)</text>
        <text x="12" y="84" font-family="monospace" font-size="9" fill="#cbd5e1">print(response.choices[0].message.content)</text>
      </g>
    </g>

    <!-- RIGHT: Streaming Request (Great UX) -->
    <g transform="translate(455, 0)">
      <rect width="425" height="435" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8" />
      <rect x="0" y="0" width="425" height="32" rx="12" fill="#065f46" />
      <text x="212" y="21" font-family="sans-serif" font-size="12" font-weight="800" fill="#d1fae5" text-anchor="middle">
        2. SSE STREAMING REQUEST (INSTANT FEEDBACK)
      </text>

      <!-- Client & Server Timeline -->
      <g transform="translate(20, 48)">
        <rect width="385" height="150" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="15" y="22" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#6ee7b7">TIMELINE: SERVER-SENT EVENTS</text>

        <!-- t=0 Send -->
        <circle cx="35" cy="45" r="5" fill="#38bdf8" />
        <text x="50" y="49" font-family="sans-serif" font-size="10" fill="#cbd5e1">t = 0.0s: POST /v1/chat/completions (stream=true)</text>

        <!-- First Token at 220ms -->
        <rect x="35" y="60" width="320" height="24" rx="4" fill="#064e3b" stroke="#10b981" />
        <text x="195" y="76" font-family="sans-serif" font-size="10" font-weight="800" fill="#6ee7b7" text-anchor="middle">
          ⚡ FIRST TOKEN ARRIVES AT t = 220 ms (TTFT!)
        </text>

        <!-- Continuous Flow -->
        <circle cx="35" cy="102" r="4" fill="#10b981"/><circle cx="50" cy="102" r="4" fill="#10b981"/>
        <circle cx="65" cy="102" r="4" fill="#10b981"/><circle cx="80" cy="102" r="4" fill="#10b981"/>
        <text x="95" y="106" font-family="monospace" font-size="9.5" fill="#a7f3d0">data: {"delta":{"content":"The"}}</text>

        <text x="50" y="132" font-family="sans-serif" font-size="10" fill="#cbd5e1">Continuous smooth typewriter effect (~60 tokens/sec)</text>
      </g>

      <!-- Metrics -->
      <g transform="translate(20, 215)">
        <rect width="385" height="95" rx="8" fill="#0f172a" stroke="#475569" />
        <text x="15" y="22" font-family="sans-serif" font-size="10" font-weight="800" fill="#94a3b8">PERFORMANCE PROFILE:</text>
        <text x="15" y="44" font-family="sans-serif" font-size="10" fill="#d1fae5">• Time to First Token (TTFT): <tspan font-weight="800" fill="#34d399">220 ms (Instantaneous!)</tspan></text>
        <text x="15" y="64" font-family="sans-serif" font-size="10" fill="#d1fae5">• User Perception: Feels immediate, magical, and alive</text>
        <text x="15" y="84" font-family="sans-serif" font-size="10" fill="#d1fae5">• User can cancel early if model goes off track, saving money</text>
      </g>

      <!-- Code snippet -->
      <g transform="translate(20, 325)">
        <rect width="385" height="90" rx="6" fill="#0f172a" stroke="#1e293b" />
        <text x="12" y="20" font-family="monospace" font-size="9" fill="#94a3b8"># Streaming Client Generator</text>
        <text x="12" y="36" font-family="monospace" font-size="9" fill="#6ee7b7">stream = client.chat.completions.create(</text>
        <text x="12" y="52" font-family="monospace" font-size="9" fill="#cbd5e1">    model="gpt-4o", messages=msgs, <tspan fill="#34d399">stream=True</tspan></text>
        <text x="12" y="68" font-family="monospace" font-size="9" fill="#6ee7b7">)</text>
        <text x="12" y="84" font-family="monospace" font-size="9" fill="#cbd5e1">for chunk in stream: print(chunk.delta.content, end="")</text>
      </g>
    </g>

  </g>
</svg>
