<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="enc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="dec-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f472b6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" rx="16" fill="url(#bg-grad)" />

  <!-- Header -->
  <text x="480" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    THE FULL TRANSFORMER ARCHITECTURE
  </text>
  <text x="480" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    The Dual-Tower Canonical Model: Encoder Stack, Decoder Stack &amp; Cross-Attention (Vaswani et al., 2017)
  </text>

  <!-- LEFT TOWER: ENCODER STACK -->
  <g transform="translate(80, 75)" filter="url(#shadow)">
    <rect width="360" height="515" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect x="0" y="0" width="360" height="28" rx="12" fill="url(#enc-grad)" />
    <text x="180" y="19" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">
      ENCODER TOWER (N&times; BLOCKS) &mdash; BIDIRECTIONAL
    </text>

    <!-- 1. Input Embeddings & Pos Encoding (Bottom) -->
    <g transform="translate(60, 440)">
      <rect width="240" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="120" y="18" font-family="sans-serif" font-size="10" font-weight="800" fill="#93c5fd" text-anchor="middle">
        Inputs: "The cat sat on mat"
      </text>

      <line x1="120" y1="0" x2="120" y2="-20" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
      <!-- Pos encoding add circle -->
      <circle cx="120" cy="-28" r="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
      <text x="120" y="-24" font-family="sans-serif" font-size="12" font-weight="900" fill="#fbbf24" text-anchor="middle">&oplus;</text>
      <text x="145" y="-24" font-family="sans-serif" font-size="9" font-weight="800" fill="#fbbf24">Positional Encoding</text>
    </g>

    <!-- Encoder Repeated Block Container -->
    <g transform="translate(40, 75)">
      <rect width="280" height="300" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
      <rect x="0" y="0" width="280" height="20" rx="8" fill="#334155" />
      <text x="140" y="14" font-family="sans-serif" font-size="9" font-weight="800" fill="#cbd5e1" text-anchor="middle">
        REPEATED N&times; ENCODER LAYERS
      </text>

      <!-- Sublayer 1: Self-Attention -->
      <g transform="translate(30, 215)">
        <rect width="220" height="34" rx="6" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.5" />
        <text x="110" y="21" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">
          Multi-Head Self-Attention
        </text>
      </g>

      <!-- Add & Norm 1 -->
      <g transform="translate(30, 160)">
        <line x1="110" y1="55" x2="110" y2="30" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
        <rect width="220" height="26" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
        <text x="110" y="17" font-family="sans-serif" font-size="10" font-weight="800" fill="#fbbf24" text-anchor="middle">
          Add &amp; LayerNorm
        </text>
      </g>

      <!-- Sublayer 2: Feed-Forward -->
      <g transform="translate(30, 95)">
        <line x1="110" y1="65" x2="110" y2="40" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
        <rect width="220" height="34" rx="6" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
        <text x="110" y="21" font-family="sans-serif" font-size="10" font-weight="800" fill="#f5d0fe" text-anchor="middle">
          Feed-Forward Network (FFN)
        </text>
      </g>

      <!-- Add & Norm 2 -->
      <g transform="translate(30, 35)">
        <line x1="110" y1="60" x2="110" y2="30" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
        <rect width="220" height="26" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
        <text x="110" y="17" font-family="sans-serif" font-size="10" font-weight="800" fill="#fbbf24" text-anchor="middle">
          Add &amp; LayerNorm
        </text>
      </g>
    </g>

    <!-- Encoder Output Line (K, V Bridge to Decoder) -->
    <path d="M 220 110 L 220 40 L 400 40" fill="none" stroke="#38bdf8" stroke-width="3" />
    <text x="310" y="32" font-family="sans-serif" font-size="10" font-weight="900" fill="#38bdf8">K, V TO DECODER &rarr;</text>
  </g>

  <!-- RIGHT TOWER: DECODER STACK -->
  <g transform="translate(520, 75)" filter="url(#shadow)">
    <rect width="360" height="515" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="360" height="28" rx="12" fill="url(#dec-grad)" />
    <text x="180" y="19" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">
      DECODER TOWER (N&times; BLOCKS) &mdash; CAUSAL AUTOREGRESSIVE
    </text>

    <!-- Decoder Inputs (Bottom) -->
    <g transform="translate(60, 440)">
      <rect width="240" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="120" y="18" font-family="sans-serif" font-size="10" font-weight="800" fill="#a7f3d0" text-anchor="middle">
        Targets (Shifted Right: &lt;SOS&gt; Le chat)
      </text>

      <line x1="120" y1="0" x2="120" y2="-20" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
      <circle cx="120" cy="-28" r="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
      <text x="120" y="-24" font-family="sans-serif" font-size="12" font-weight="900" fill="#fbbf24" text-anchor="middle">&oplus;</text>
      <text x="145" y="-24" font-family="sans-serif" font-size="9" font-weight="800" fill="#fbbf24">Positional Encoding</text>
    </g>

    <!-- Decoder Repeated Block Container -->
    <g transform="translate(40, 75)">
      <rect width="280" height="300" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
      <rect x="0" y="0" width="280" height="20" rx="8" fill="#334155" />
      <text x="140" y="14" font-family="sans-serif" font-size="9" font-weight="800" fill="#cbd5e1" text-anchor="middle">
        REPEATED N&times; DECODER LAYERS
      </text>

      <!-- Sublayer 1: Masked Self-Attention -->
      <g transform="translate(30, 230)">
        <rect width="220" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
        <text x="110" y="19" font-family="sans-serif" font-size="10" font-weight="800" fill="#a7f3d0" text-anchor="middle">
          Masked Self-Attention (Causal)
        </text>
      </g>

      <!-- Add & Norm 1 -->
      <g transform="translate(30, 190)">
        <line x1="110" y1="40" x2="110" y2="25" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
        <rect width="220" height="22" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
        <text x="110" y="15" font-family="sans-serif" font-size="9" font-weight="800" fill="#fbbf24" text-anchor="middle">
          Add &amp; LayerNorm
        </text>
      </g>

      <!-- Sublayer 2: CROSS-ATTENTION (The Bridge!) -->
      <g transform="translate(30, 120)">
        <line x1="110" y1="70" x2="110" y2="40" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
        <rect width="220" height="34" rx="6" fill="#be123c" stroke="#f43f5e" stroke-width="2" />
        <text x="110" y="16" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">
          CROSS-ATTENTION
        </text>
        <text x="110" y="28" font-family="sans-serif" font-size="8.5" fill="#fda4af" text-anchor="middle">
          Q from Decoder; K, V from Encoder!
        </text>
      </g>

      <!-- Add & Norm 2 -->
      <g transform="translate(30, 80)">
        <line x1="110" y1="40" x2="110" y2="25" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
        <rect width="220" height="22" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
        <text x="110" y="15" font-family="sans-serif" font-size="9" font-weight="800" fill="#fbbf24" text-anchor="middle">
          Add &amp; LayerNorm
        </text>
      </g>

      <!-- Sublayer 3: Feed-Forward -->
      <g transform="translate(30, 25)">
        <line x1="110" y1="55" x2="110" y2="35" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
        <rect width="220" height="28" rx="6" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
        <text x="110" y="18" font-family="sans-serif" font-size="10" font-weight="800" fill="#f5d0fe" text-anchor="middle">
          Feed-Forward (FFN)
        </text>
      </g>
    </g>

    <!-- Cross-Attention incoming lines from Encoder (Top left bridge) -->
    <path d="M -40 40 L 110 40 L 110 195" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3,3" marker-end="url(#arrow-blue)" />

    <!-- Final Output Head (Linear + Softmax) -->
    <g transform="translate(70, 35)">
      <line x1="80" y1="40" x2="80" y2="15" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
      <rect width="160" height="24" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
      <text x="80" y="16" font-family="sans-serif" font-size="10" font-weight="900" fill="#6ee7b7" text-anchor="middle">
        Linear &rarr; Softmax
      </text>
      <text x="80" y="-8" font-family="monospace" font-size="10" font-weight="800" fill="#a7f3d0" text-anchor="middle">
        Output Token: "noir"
      </text>
    </g>
  </g>
</svg>
