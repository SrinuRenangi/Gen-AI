<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <radialGradient id="compassGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="520" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="230" y="20" width="490" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    🧭 The Cosine Similarity Compass: -1.0 to +1.0
  </text>

  <!-- Subtitle -->
  <text x="475" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    How AI Vector Databases (RAG) and Transformers measure conceptual alignment
  </text>

  <!-- Left Side: Circular Compass Diagram (Center at 260, 290, Radius 150) -->
  <g transform="translate(40, 10)">
    <!-- Outer Ring -->
    <circle cx="260" cy="270" r="140" fill="url(#compassGrad)" stroke="#475569" stroke-width="2"/>
    <circle cx="260" cy="270" r="90" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="260" cy="270" r="40" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Crosshairs -->
    <line x1="100" y1="270" x2="420" y2="270" stroke="#475569" stroke-width="1.5"/>
    <line x1="260" y1="110" x2="260" y2="430" stroke="#475569" stroke-width="1.5"/>

    <!-- Reference Vector (Blue, along +X axis) -->
    <!-- Base Vector A at angle 0° -->
    <line x1="260" y1="270" x2="390" y2="270" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    <polygon points="390,265 400,270 390,275" fill="#3b82f6"/>
    <text x="350" y="260" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Vector A ("King")</text>

    <!-- Vector B1: Identical direction (Green, near angle 0°) -->
    <!-- Angle 20° -->
    <line x1="260" y1="270" x2="375" y2="228" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <polygon points="372,223 385,225 377,235" fill="#10b981"/>
    <text x="380" y="215" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">"Queen" (+0.94)</text>

    <!-- Vector B2: Orthogonal (Yellow, angle 90°) -->
    <line x1="260" y1="270" x2="260" y2="140" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="255,140 260,130 265,140" fill="#f59e0b"/>
    <text x="270" y="150" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">"Sandwich" (0.00)</text>

    <!-- Vector B3: Opposite (Red, angle 180°) -->
    <line x1="260" y1="270" x2="130" y2="270" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <polygon points="130,265 120,270 130,275" fill="#ef4444"/>
    <text x="130" y="260" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">"Peasant" (-0.85)</text>

    <!-- Center Origin Dot -->
    <circle cx="260" cy="270" r="5" fill="#f8fafc"/>
  </g>

  <!-- Right Side: Explanation Cards -->
  <g transform="translate(480, 110)">
    <!-- Card 1: The Core Formula -->
    <rect width="420" height="95" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="28" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">📐 The Cosine Similarity Formula</text>
    <text x="20" y="58" fill="#f8fafc" font-family="monospace" font-size="15" font-weight="700">
      Cosine Sim = (A • B) / (||A|| × ||B||)
    </text>
    <text x="20" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      = Dot Product divided by product of both lengths (cancels length bias!)
    </text>

    <!-- Card 2: The Three Anchor Points -->
    <rect y="115" width="420" height="215" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="142" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">🧭 Interpretation Scale</text>
    
    <!-- Item +1.0 -->
    <rect x="20" y="155" width="380" height="42" rx="6" fill="#047857" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="35" y="180" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">+1.0</text>
    <text x="90" y="180" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Same Direction → Synonyms, High Similarity</text>

    <!-- Item 0.0 -->
    <rect x="20" y="205" width="380" height="42" rx="6" fill="#b45309" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="35" y="230" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700"> 0.0</text>
    <text x="90" y="230" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Perpendicular (Orthogonal) → Completely Unrelated</text>

    <!-- Item -1.0 -->
    <rect x="20" y="255" width="380" height="42" rx="6" fill="#991b1b" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
    <text x="35" y="280" fill="#f87171" font-family="monospace" font-size="13" font-weight="700">-1.0</text>
    <text x="90" y="280" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Opposite Direction → Diametrically Opposed Concepts</text>
  </g>

  <!-- Bottom Global Summary Banner -->
  <rect x="40" y="455" width="870" height="42" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <text x="475" y="481" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">
    🚀 <tspan fill="#38bdf8" font-weight="600">In Production RAG:</tspan> Pinecone, ChromaDB, and Milvus index embeddings using Cosine Similarity to find the top-k most relevant text chunks!
  </text>
</svg>
