<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="num-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="cat-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="est-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="num-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="cat-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg-grad)" />

  <!-- Title Banner -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    SCIKIT-LEARN PIPELINE ARCHITECTURE &amp; DATA FLOW
  </text>
  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Automating Imputation, Scaling, One-Hot Encoding, and Estimation Without Data Leakage
  </text>

  <!-- Outer Pipeline Container Box -->
  <rect x="230" y="90" width="570" height="390" rx="12" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8,6" />
  <text x="515" y="112" font-family="sans-serif" font-size="12" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    ENCLOSED PRODUCTION PIPELINE (ZERO DATA LEAKAGE)
  </text>

  <!-- 1. Raw Heterogeneous Input -->
  <g transform="translate(30, 190)" filter="url(#card-shadow)">
    <rect width="160" height="190" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <rect x="0" y="0" width="160" height="34" rx="10" fill="#334155" />
    <text x="80" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle">RAW INPUT DATA</text>
    
    <text x="14" y="60" font-family="monospace" font-size="11" fill="#38bdf8">Age: 29, NaN, 45</text>
    <text x="14" y="82" font-family="monospace" font-size="11" fill="#38bdf8">Salary: $85k, $120k</text>
    <text x="14" y="104" font-family="monospace" font-size="11" fill="#c084fc">City: "NY", "Paris"</text>
    <text x="14" y="126" font-family="monospace" font-size="11" fill="#c084fc">Tier: "Gold", NaN</text>
    
    <rect x="10" y="145" width="140" height="32" rx="4" fill="#0f172a" />
    <text x="80" y="165" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Mixed Types + Missing</text>
  </g>

  <!-- Connectors from Raw to Pipeline Branches -->
  <path d="M 190 250 C 215 250, 225 180, 255 180" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#num-arrow)" />
  <path d="M 190 320 C 215 320, 225 380, 255 380" stroke="#c084fc" stroke-width="2.5" fill="none" marker-end="url(#cat-arrow)" />

  <!-- 2. ColumnTransformer Container -->
  <!-- Top Branch: Numerical Sub-Pipeline -->
  <g transform="translate(260, 130)" filter="url(#card-shadow)">
    <rect width="270" height="110" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
    <rect x="0" y="0" width="270" height="26" rx="8" fill="url(#num-grad)" />
    <text x="135" y="18" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">NUMERICAL SUB-PIPELINE</text>
    
    <!-- Step 1: Imputer -->
    <rect x="12" y="38" width="115" height="56" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <text x="69" y="58" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">SimpleImputer</text>
    <text x="69" y="74" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">strategy='median'</text>
    <text x="69" y="87" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Replaces NaNs</text>

    <!-- arrow -->
    <path d="M 127 66 L 143 66" stroke="#38bdf8" stroke-width="2" marker-end="url(#num-arrow)" />

    <!-- Step 2: Scaler -->
    <rect x="145" y="38" width="115" height="56" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <text x="202" y="58" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">StandardScaler</text>
    <text x="202" y="74" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">z = (x - &mu;) / &sigma;</text>
    <text x="202" y="87" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Mean=0, Std=1</text>
  </g>

  <!-- Bottom Branch: Categorical Sub-Pipeline -->
  <g transform="translate(260, 320)" filter="url(#card-shadow)">
    <rect width="270" height="110" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <rect x="0" y="0" width="270" height="26" rx="8" fill="url(#cat-grad)" />
    <text x="135" y="18" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">CATEGORICAL SUB-PIPELINE</text>
    
    <!-- Step 1: Imputer -->
    <rect x="12" y="38" width="115" height="56" rx="6" fill="#0f172a" stroke="#7c3aed" stroke-width="1" />
    <text x="69" y="58" font-family="sans-serif" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">SimpleImputer</text>
    <text x="69" y="74" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">strategy='constant'</text>
    <text x="69" y="87" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">fill_value='Missing'</text>

    <!-- arrow -->
    <path d="M 127 66 L 143 66" stroke="#c084fc" stroke-width="2" marker-end="url(#cat-arrow)" />

    <!-- Step 2: OneHotEncoder -->
    <rect x="145" y="38" width="115" height="56" rx="6" fill="#0f172a" stroke="#7c3aed" stroke-width="1" />
    <text x="202" y="58" font-family="sans-serif" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">OneHotEncoder</text>
    <text x="202" y="74" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">handle_unknown</text>
    <text x="202" y="87" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Creates 0/1 vectors</text>
  </g>

  <!-- Feature Union / Concatenation Node -->
  <g transform="translate(565, 250)">
    <circle cx="20" cy="35" r="22" fill="#334155" stroke="#f8fafc" stroke-width="2" />
    <text x="20" y="41" font-family="sans-serif" font-size="20" font-weight="900" fill="#f8fafc" text-anchor="middle">&oplus;</text>
    <text x="20" y="72" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">CONCAT</text>
  </g>

  <!-- Connectors into Concat -->
  <path d="M 530 185 C 555 185, 555 270, 565 280" stroke="#38bdf8" stroke-width="2" fill="none" />
  <path d="M 530 375 C 555 375, 555 295, 565 288" stroke="#c084fc" stroke-width="2" fill="none" />
  <path d="M 607 285 L 635 285" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 3. Final Estimator Stage -->
  <g transform="translate(640, 205)" filter="url(#card-shadow)">
    <rect width="145" height="160" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="145" height="30" rx="8" fill="url(#est-grad)" />
    <text x="72" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">FINAL ESTIMATOR</text>
    
    <text x="72" y="60" font-family="sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle">Classifier / Regressor</text>
    <text x="72" y="80" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">e.g. Random Forest,</text>
    <text x="72" y="96" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Logistic Regression</text>

    <rect x="12" y="112" width="121" height="34" rx="4" fill="#0f172a" />
    <text x="72" y="128" font-family="sans-serif" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">.fit(X, y)</text>
    <text x="72" y="140" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">.predict(X_new)</text>
  </g>

  <!-- Output Arrow and Result Card -->
  <path d="M 785 285 L 825 285" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)" />
  
  <g transform="translate(835, 230)" filter="url(#card-shadow)">
    <rect width="105" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="105" height="24" rx="8" fill="#0284c7" />
    <text x="52" y="17" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">PREDICTION</text>
    <text x="52" y="55" font-family="sans-serif" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle">Loan: 1</text>
    <text x="52" y="75" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">(Approved)</text>
    <text x="52" y="95" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle">Prob: 89.4%</text>
  </g>

  <!-- Bottom Callout Footer -->
  <rect x="40" y="500" width="880" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="526" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    <tspan fill="#38bdf8" font-weight="700">Production Secret: </tspan> Calling <tspan fill="#f1f5f9" font-family="monospace">pipeline.fit(X_train)</tspan> computes means and categories solely on training data. <tspan fill="#10b981" font-weight="700">Zero data leaks</tspan> into test or prod!
  </text>
</svg>
