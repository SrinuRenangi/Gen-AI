<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="ldm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#ldm-bg)" />

  <!-- Header -->
  <text x="480" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    LATENT DIFFUSION (STABLE DIFFUSION) &amp; CLASSIFIER-FREE GUIDANCE
  </text>
  <text x="480" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">
    48&times; Spatial Compression via VAE + Cross-Attention Text Conditioning + Extrapolation Vector Steering
  </text>

  <g transform="translate(30, 75)" filter="url(#shadow)">

    <!-- UPPER SECTION: Latent Space Architecture Flow -->
    <!-- 1. Pixel Space (Left: VAE Encoder) -->
    <g transform="translate(0, 0)">
      <rect width="180" height="230" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="90" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#93c5fd" text-anchor="middle">
        PIXEL SPACE (512&times;512&times;3)
      </text>

      <rect x="25" y="40" width="130" height="90" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="90" y="80" font-family="sans-serif" font-size="28" text-anchor="middle">🖼️</text>
      <text x="90" y="112" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">786,432 Floats</text>

      <rect x="25" y="145" width="130" height="65" rx="6" fill="#1d4ed8" />
      <text x="90" y="170" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">VAE Encoder ε</text>
      <text x="90" y="192" font-family="sans-serif" font-size="9.5" fill="#bfdbfe" text-anchor="middle">Spatial Factor 8&times; Down</text>
    </g>

    <!-- Arrow from Pixel to Latent -->
    <path d="M 185 178 L 225 178" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr-blue)" />
    <text x="205" y="165" font-family="sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">z = ε(x)</text>

    <!-- 2. Latent Space (Center: Denoising U-Net) -->
    <g transform="translate(235, 0)">
      <rect width="430" height="230" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 3" />
      <rect x="0" y="0" width="430" height="28" rx="10" fill="#581c87" />
      <text x="215" y="19" font-family="sans-serif" font-size="11" font-weight="800" fill="#f3e8ff" text-anchor="middle">
        LATENT SPACE (64&times;64&times;4 = 16,384 Floats &mdash; 48&times; Memory Reduction!)
      </text>

      <!-- U-Net Box -->
      <rect x="20" y="40" width="220" height="170" rx="8" fill="#1e293b" stroke="#7e22ce" />
      <text x="130" y="65" font-family="sans-serif" font-size="12" font-weight="800" fill="#d8b4fe" text-anchor="middle">
        Denoising U-Net (ε_θ)
      </text>
      <text x="130" y="85" font-family="sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">ResNet Down-Blocks &darr;</text>
      <text x="130" y="105" font-family="sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Cross-Attention Bottleneck</text>
      <text x="130" y="125" font-family="sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">ResNet Up-Blocks &uarr;</text>
      <rect x="35" y="145" width="190" height="50" rx="4" fill="#0f172a" stroke="#a855f7" />
      <text x="130" y="165" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#e9d5ff" text-anchor="middle">Timestep Embedding t</text>
      <text x="130" y="182" font-family="monospace" font-size="9" fill="#93c5fd" text-anchor="middle">Sinusoidal + Linear</text>

      <!-- Text Conditioning Injection -->
      <g transform="translate(255, 40)">
        <rect width="160" height="170" rx="8" fill="#1e293b" stroke="#10b981" />
        <text x="80" y="24" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#6ee7b7" text-anchor="middle">
          TEXT CONDITIONING
        </text>
        <rect x="10" y="35" width="140" height="32" rx="4" fill="#0f172a" stroke="#334155" />
        <text x="80" y="55" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">"cyberpunk cat..."</text>

        <path d="M 80 67 L 80 82" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)" />

        <rect x="10" y="85" width="140" height="35" rx="4" fill="#065f46" />
        <text x="80" y="102" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">CLIP Text Encoder</text>
        <text x="80" y="115" font-family="monospace" font-size="8.5" fill="#a7f3d0" text-anchor="middle">77 tokens &times; 768 dim</text>

        <!-- Cross attention arrow to U-Net -->
        <path d="M 10 145 L -10 145" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arr-purple)" />
        <text x="75" y="152" font-family="sans-serif" font-size="9" font-weight="700" fill="#d8b4fe">Cross-Attn (K, V)</text>
      </g>
    </g>

    <!-- Arrow from Latent to Decoder -->
    <path d="M 670 115 L 710 115" stroke="#10b981" stroke-width="3" marker-end="url(#arr-green)" />
    <text x="690" y="102" font-family="sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">x̂ = D(z_0)</text>

    <!-- 3. Pixel Space (Right: VAE Decoder) -->
    <g transform="translate(720, 0)">
      <rect width="180" height="230" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="90" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" text-anchor="middle">
        OUTPUT IMAGE (512&times;512)
      </text>

      <rect x="25" y="40" width="130" height="65" rx="6" fill="#059669" />
      <text x="90" y="66" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">VAE Decoder D</text>
      <text x="90" y="88" font-family="sans-serif" font-size="9.5" fill="#d1fae5" text-anchor="middle">Spatial Factor 8&times; Up</text>

      <rect x="25" y="120" width="130" height="90" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="90" y="160" font-family="sans-serif" font-size="30" text-anchor="middle">🎨 ✨</text>
      <text x="90" y="195" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">Photorealistic Output</text>
    </g>

    <!-- LOWER SECTION: Classifier-Free Guidance (CFG) Deep Dive -->
    <g transform="translate(0, 245)">
      <rect width="900" height="215" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8" />
      <rect x="0" y="0" width="900" height="30" rx="12" fill="#b45309" />
      <text x="450" y="20" font-family="sans-serif" font-size="12" font-weight="800" fill="#fef3c7" text-anchor="middle">
        CLASSIFIER-FREE GUIDANCE (CFG) &mdash; THE SECRET TO PROMPT ADHERENCE
      </text>

      <!-- CFG Formula Box -->
      <g transform="translate(25, 45)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="800" fill="#fde68a">THE CFG FORMULA:</text>
        <rect x="0" y="22" width="410" height="42" rx="6" fill="#0f172a" stroke="#d97706" />
        <text x="205" y="48" font-family="monospace" font-size="12" font-weight="800" fill="#fcd34d" text-anchor="middle">
          ε̂ = ε_θ(z_t, ∅) + s · [ ε_θ(z_t, c) - ε_θ(z_t, ∅) ]
        </text>

        <text x="0" y="85" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• <tspan font-family="monospace" fill="#38bdf8">ε_θ(z_t, ∅)</tspan>: Unconditional prediction (empty prompt / negative prompt)</text>
        <text x="0" y="103" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• <tspan font-family="monospace" fill="#34d399">ε_θ(z_t, c)</tspan>: Conditioned prediction (guided by user text prompt c)</text>
        <text x="0" y="121" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• <tspan font-family="monospace" fill="#f59e0b">s</tspan>: Guidance Scale factor (typically 7.0 &le; s &le; 9.0)</text>
        <text x="0" y="139" font-family="sans-serif" font-size="10" fill="#94a3b8">Effect: Extrapolates away from generic images in the direction of the prompt!</text>
      </g>

      <!-- Visual Vector Steering Graphic -->
      <g transform="translate(470, 42)">
        <rect width="405" height="155" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="15" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b">VECTOR EXTRAPOLATION DYNAMICS</text>

        <!-- Origin Dot (Unconditional) -->
        <circle cx="50" cy="95" r="5" fill="#38bdf8" />
        <text x="50" y="115" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">ε_∅</text>
        <text x="50" y="130" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">(Generic / Null)</text>

        <!-- Conditioned Dot (s = 1.0) -->
        <circle cx="160" cy="95" r="5" fill="#34d399" />
        <path d="M 55 95 L 155 95" stroke="#34d399" stroke-width="2" marker-end="url(#arr-green)" />
        <text x="160" y="115" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">ε_c (s = 1.0)</text>
        <text x="160" y="130" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Standard prompt</text>

        <!-- Guided Extrapolation (s = 7.5) -->
        <circle cx="340" cy="95" r="6" fill="#f59e0b" />
        <path d="M 165 95 L 332 95" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 3" marker-end="url(#arr-blue)" />
        <text x="340" y="115" font-family="monospace" font-size="11" font-weight="800" fill="#fcd34d" text-anchor="middle">ε̂ (s = 7.5)</text>
        <text x="340" y="130" font-family="sans-serif" font-size="9" font-weight="700" fill="#fef3c7" text-anchor="middle">★ High Fidelity &amp; Adherence</text>

        <text x="245" y="80" font-family="sans-serif" font-size="9" font-weight="800" fill="#fde68a" text-anchor="middle">Extrapolated Vector +s &middot; &Delta;ε &rarr;</text>
      </g>

    </g>

  </g>
</svg>
