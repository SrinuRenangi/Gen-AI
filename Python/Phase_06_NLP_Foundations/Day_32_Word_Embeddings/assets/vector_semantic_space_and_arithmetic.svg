<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bg-grad)" />

  <!-- Header -->
  <text x="480" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    THE GEOMETRY OF EMBEDDINGS &amp; VECTOR ARITHMETIC
  </text>
  <text x="480" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Linear Semantic Subspaces: King - Man + Woman &approx; Queen
  </text>

  <!-- Main Container -->
  <g transform="translate(60, 90)" filter="url(#shadow)">
    <rect width="840" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- Grid lines for coordinate space feel -->
    <g stroke="#334155" stroke-width="1" stroke-dasharray="4,4">
      <line x1="40" y1="80" x2="800" y2="80" />
      <line x1="40" y1="160" x2="800" y2="160" />
      <line x1="40" y1="240" x2="800" y2="240" />
      <line x1="40" y1="320" x2="800" y2="320" />
      <line x1="280" y1="30" x2="280" y2="390" />
      <line x1="560" y1="30" x2="560" y2="390" />
    </g>

    <!-- SECTION 1: ROYALTY & GENDER (LEFT PANEL) -->
    <g transform="translate(30, 20)">
      <rect width="230" height="28" rx="6" fill="#1e3a8a" />
      <text x="115" y="19" font-family="sans-serif" font-size="11" font-weight="800" fill="#93c5fd" text-anchor="middle">
        1. GENDER / ROYALTY SUBSPACE
      </text>

      <!-- Man point -->
      <circle cx="50" cy="220" r="7" fill="#38bdf8" />
      <text x="45" y="245" font-family="monospace" font-size="12" font-weight="800" fill="#e2e8f0">Man</text>

      <!-- Woman point -->
      <circle cx="170" cy="250" r="7" fill="#f43f5e" />
      <text x="165" y="275" font-family="monospace" font-size="12" font-weight="800" fill="#fda4af">Woman</text>

      <!-- Gender shift arrow: Man -> Woman -->
      <line x1="57" y1="222" x2="160" y2="248" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow-pink)" />
      <text x="100" y="225" font-family="sans-serif" font-size="10" font-weight="700" fill="#fda4af">&plus; &Delta;Gender</text>

      <!-- King point -->
      <circle cx="60" cy="90" r="7" fill="#38bdf8" />
      <text x="55" y="75" font-family="monospace" font-size="12" font-weight="800" fill="#e2e8f0">King</text>

      <!-- Queen point -->
      <circle cx="180" cy="120" r="7" fill="#f43f5e" />
      <text x="175" y="105" font-family="monospace" font-size="12" font-weight="800" fill="#fda4af">Queen</text>

      <!-- Gender shift arrow: King -> Queen -->
      <line x1="67" y1="92" x2="170" y2="118" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrow-pink)" />
      <text x="110" y="95" font-family="sans-serif" font-size="10" font-weight="700" fill="#fda4af">&plus; &Delta;Gender</text>

      <!-- Royalty vertical arrows -->
      <line x1="50" y1="210" x2="58" y2="105" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3" />
      <text x="15" y="160" font-family="sans-serif" font-size="9" font-weight="700" fill="#fbbf24">&plus; Royalty</text>

      <line x1="170" y1="240" x2="178" y2="135" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3" />
      <text x="185" y="190" font-family="sans-serif" font-size="9" font-weight="700" fill="#fbbf24">&plus; Royalty</text>

      <!-- Subtitle note -->
      <rect x="10" y="320" width="220" height="55" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="120" y="342" font-family="monospace" font-size="10" font-weight="800" fill="#67e8f9" text-anchor="middle">
        v_King - v_Man + v_Woman
      </text>
      <text x="120" y="360" font-family="sans-serif" font-size="11" font-weight="900" fill="#10b981" text-anchor="middle">
        &approx; v_Queen (&plusmn;0.05)
      </text>
    </g>

    <!-- SECTION 2: COUNTRY & CAPITAL (MIDDLE PANEL) -->
    <g transform="translate(305, 20)">
      <rect width="230" height="28" rx="6" fill="#064e3b" />
      <text x="115" y="19" font-family="sans-serif" font-size="11" font-weight="800" fill="#a7f3d0" text-anchor="middle">
        2. CAPITAL - COUNTRY RELATION
      </text>

      <!-- France -> Paris -->
      <circle cx="40" cy="100" r="6" fill="#3b82f6" />
      <text x="30" y="85" font-family="monospace" font-size="11" fill="#cbd5e1">France</text>
      <circle cx="160" cy="80" r="6" fill="#10b981" />
      <text x="165" y="75" font-family="monospace" font-size="11" font-weight="800" fill="#6ee7b7">Paris</text>
      <line x1="48" y1="98" x2="150" y2="82" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)" />

      <!-- Italy -> Rome -->
      <circle cx="50" cy="180" r="6" fill="#3b82f6" />
      <text x="40" y="165" font-family="monospace" font-size="11" fill="#cbd5e1">Italy</text>
      <circle cx="170" cy="160" r="6" fill="#10b981" />
      <text x="175" y="155" font-family="monospace" font-size="11" font-weight="800" fill="#6ee7b7">Rome</text>
      <line x1="58" y1="178" x2="160" y2="162" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)" />

      <!-- Japan -> Tokyo -->
      <circle cx="60" cy="260" r="6" fill="#3b82f6" />
      <text x="50" y="245" font-family="monospace" font-size="11" fill="#cbd5e1">Japan</text>
      <circle cx="180" cy="240" r="6" fill="#10b981" />
      <text x="185" y="235" font-family="monospace" font-size="11" font-weight="800" fill="#6ee7b7">Tokyo</text>
      <line x1="68" y1="258" x2="170" y2="242" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)" />

      <!-- Subtitle note -->
      <rect x="10" y="320" width="220" height="55" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="120" y="342" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
        All arrows share same vector:
      </text>
      <text x="120" y="360" font-family="monospace" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">
        &Delta;r = v_Capital - v_Country
      </text>
    </g>

    <!-- SECTION 3: VERB TENSE & MORPHOLOGY (RIGHT PANEL) -->
    <g transform="translate(585, 20)">
      <rect width="230" height="28" rx="6" fill="#581c87" />
      <text x="115" y="19" font-family="sans-serif" font-size="11" font-weight="800" fill="#e9d5ff" text-anchor="middle">
        3. VERB TENSE / SYNTAX
      </text>

      <!-- Walk -> Walking -->
      <circle cx="50" cy="110" r="6" fill="#c084fc" />
      <text x="40" y="95" font-family="monospace" font-size="11" fill="#cbd5e1">walk</text>
      <circle cx="160" cy="130" r="6" fill="#f472b6" />
      <text x="165" y="145" font-family="monospace" font-size="11" font-weight="800" fill="#fbcfe8">walking</text>
      <line x1="58" y1="112" x2="150" y2="128" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arrow-pink)" />

      <!-- Swim -> Swimming -->
      <circle cx="60" cy="200" r="6" fill="#c084fc" />
      <text x="50" y="185" font-family="monospace" font-size="11" fill="#cbd5e1">swim</text>
      <circle cx="170" cy="220" r="6" fill="#f472b6" />
      <text x="175" y="235" font-family="monospace" font-size="11" font-weight="800" fill="#fbcfe8">swimming</text>
      <line x1="68" y1="202" x2="160" y2="218" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arrow-pink)" />

      <!-- Subtitle note -->
      <rect x="10" y="320" width="220" height="55" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="120" y="342" font-family="monospace" font-size="10" font-weight="800" fill="#c084fc" text-anchor="middle">
        v_Swim - v_Swam + v_Walked
      </text>
      <text x="120" y="360" font-family="sans-serif" font-size="11" font-weight="900" fill="#e9d5ff" text-anchor="middle">
        &approx; v_Walking
      </text>
    </g>
  </g>
</svg>
