<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="520" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="250" y="20" width="450" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    ⚡ The Matrix Multiplication Mechanism
  </text>

  <!-- Subtitle -->
  <text x="475" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    Row of Matrix A (Horizontal) • Column of Matrix B (Vertical) = Single Cell in Matrix C
  </text>

  <!-- Diagram Flow: Matrix A (2x3) x Matrix B (3x2) = Matrix C (2x2) -->
  <g transform="translate(50, 110)">
    <!-- Matrix A Container -->
    <rect x="0" y="30" width="200" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="100" y="20" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Matrix A (2 × 3)</text>
    
    <!-- Row 0 Highlighted in Blue -->
    <rect x="10" y="45" width="180" height="55" rx="6" fill="#1d4ed8" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
    <text x="40" y="80" fill="#93c5fd" font-family="monospace" font-size="18" font-weight="700">1</text>
    <text x="100" y="80" fill="#93c5fd" font-family="monospace" font-size="18" font-weight="700">2</text>
    <text x="160" y="80" fill="#93c5fd" font-family="monospace" font-size="18" font-weight="700">3</text>
    
    <!-- Row 1 -->
    <text x="40" y="145" fill="#64748b" font-family="monospace" font-size="18">4</text>
    <text x="100" y="145" fill="#64748b" font-family="monospace" font-size="18">5</text>
    <text x="160" y="145" fill="#64748b" font-family="monospace" font-size="18">6</text>

    <!-- Times symbol -->
    <text x="235" y="115" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700" text-anchor="middle">×</text>

    <!-- Matrix B Container -->
    <rect x="270" y="10" width="150" height="190" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="345" y="0" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Matrix B (3 × 2)</text>
    
    <!-- Col 0 Highlighted in Green -->
    <rect x="280" y="20" width="60" height="170" rx="6" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="2"/>
    <text x="310" y="55" fill="#a7f3d0" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">7</text>
    <text x="385" y="55" fill="#64748b" font-family="monospace" font-size="18" text-anchor="middle">8</text>

    <text x="310" y="115" fill="#a7f3d0" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">9</text>
    <text x="385" y="115" fill="#64748b" font-family="monospace" font-size="18" text-anchor="middle">10</text>

    <text x="310" y="175" fill="#a7f3d0" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">11</text>
    <text x="385" y="175" fill="#64748b" font-family="monospace" font-size="18" text-anchor="middle">12</text>

    <!-- Equals symbol -->
    <text x="455" y="115" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700" text-anchor="middle">=</text>

    <!-- Matrix C Container -->
    <rect x="490" y="30" width="160" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="570" y="20" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Result C (2 × 2)</text>

    <!-- Cell [0][0] Highlighted in Gold -->
    <rect x="500" y="45" width="65" height="55" rx="6" fill="#b45309" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow)"/>
    <text x="532" y="80" fill="#fde68a" font-family="monospace" font-size="20" font-weight="800" text-anchor="middle">58</text>
    <text x="605" y="80" fill="#64748b" font-family="monospace" font-size="18" text-anchor="middle">64</text>

    <text x="532" y="145" fill="#64748b" font-family="monospace" font-size="18" text-anchor="middle">139</text>
    <text x="605" y="145" fill="#64748b" font-family="monospace" font-size="18" text-anchor="middle">154</text>
  </g>

  <!-- Step-by-Step Calculation Breakdown Card (Bottom Left) -->
  <g transform="translate(50, 330)">
    <rect width="550" height="120" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="28" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">
      🔍 How Cell C[0][0] = 58 Was Calculated (Dot Product):
    </text>
    <text x="20" y="55" fill="#e2e8f0" font-family="monospace" font-size="13">
      C[0][0] = (Row 0 of A) • (Col 0 of B)
    </text>
    <text x="20" y="78" fill="#e2e8f0" font-family="monospace" font-size="13">
      = (<tspan fill="#60a5fa">1</tspan> × <tspan fill="#34d399">7</tspan>) + (<tspan fill="#60a5fa">2</tspan> × <tspan fill="#34d399">9</tspan>) + (<tspan fill="#60a5fa">3</tspan> × <tspan fill="#34d399">11</tspan>)
    </text>
    <text x="20" y="101" fill="#fde68a" font-family="monospace" font-size="13" font-weight="700">
      = 7 + 18 + 33 = 58 🎯
    </text>
  </g>

  <!-- Shape Rule Card (Right Side) -->
  <g transform="translate(630, 330)">
    <rect width="270" height="120" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="28" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">
      📐 The Golden Shape Rule
    </text>
    <text x="20" y="55" fill="#e2e8f0" font-family="monospace" font-size="13">
      (2 × <tspan fill="#38bdf8" font-weight="700">3</tspan>) × (<tspan fill="#38bdf8" font-weight="700">3</tspan> × 2)
    </text>
    <text x="20" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      • Inner shapes match: <tspan fill="#38bdf8" font-weight="600">3 == 3</tspan> ✅
    </text>
    <text x="20" y="98" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">
      • Outer shapes define result: (2 × 2)
    </text>
  </g>

  <!-- Bottom Global Summary -->
  <rect x="50" y="470" width="850" height="32" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <text x="475" y="491" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">
    🚀 <tspan fill="#38bdf8" font-weight="600">In Neural Networks:</tspan> Input Vector (1 × D) @ Weight Matrix (D × N) calculates the activations for all N neurons in a single parallel operation!
  </text>
</svg>
