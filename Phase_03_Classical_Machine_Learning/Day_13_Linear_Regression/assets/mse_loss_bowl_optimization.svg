<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="230" y="20" width="490" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    🥣 The MSE Error Bowl: Optimization in Action
  </text>

  <!-- Subtitle -->
  <text x="475" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    Because MSE squares the errors, it forms a convex bowl with a single guaranteed minimum!
  </text>

  <!-- Axes -->
  <g transform="translate(80, 70)">
    <line x1="80" y1="330" x2="800" y2="330" stroke="#475569" stroke-width="2"/>
    <line x1="80" y1="330" x2="80" y2="50" stroke="#475569" stroke-width="2"/>
    <polygon points="800,325 812,330 800,335" fill="#475569"/>
    <polygon points="75,50 80,38 85,50" fill="#475569"/>

    <text x="805" y="355" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Weight Parameter (w)</text>
    <text x="35" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Loss (MSE)</text>

    <!-- Parabolic Curve -->
    <path d="M 140 100 Q 440 370 740 100" fill="none" stroke="url(#bowlGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Shading under the bowl -->
    <path d="M 140 100 Q 440 370 740 100 L 740 330 L 140 330 Z" fill="#3b82f6" fill-opacity="0.04"/>

    <!-- Ball at start (w=0.5, steep left side) -->
    <circle cx="215" cy="185" r="16" fill="url(#ballGrad)" filter="url(#shadow)"/>
    <text x="215" y="155" fill="#fde68a" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Initial Guess (High MSE!)</text>

    <!-- Roll Arrow -->
    <path d="M 245 205 Q 320 270 410 270" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 4"/>
    <polygon points="410,265 420,270 410,275" fill="#f59e0b"/>

    <!-- Optimal Point at the bottom (440, 270) -->
    <circle cx="440" cy="270" r="8" fill="#10b981" stroke="#a7f3d0" stroke-width="2"/>
    <line x1="440" y1="270" x2="440" y2="330" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="440" y="350" fill="#34d399" font-family="monospace" font-size="13" font-weight="800" text-anchor="middle">w* (Optimal Weight)</text>
    <text x="440" y="250" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🎯 Lowest Possible Error!</text>

    <!-- Tangent slope line at bottom (flat) -->
    <line x1="370" y1="270" x2="510" y2="270" stroke="#34d399" stroke-width="2"/>
  </g>

  <!-- Bottom Tip Banner -->
  <rect x="60" y="435" width="830" height="32" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <text x="475" y="456" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">
    ✨ <tspan fill="#38bdf8" font-weight="600">The Convex Guarantee:</tspan> Because Linear Regression MSE has a single global minimum, Gradient Descent will ALWAYS find the best line!
  </text>
</svg>
