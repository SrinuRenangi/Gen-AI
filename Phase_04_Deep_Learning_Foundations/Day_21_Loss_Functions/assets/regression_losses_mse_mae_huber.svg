<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg-grad)" />

  <!-- Title Banner -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    REGRESSION LOSS LANDSCAPE: MSE vs MAE vs HUBER
  </text>
  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Comparing How Quadratic, Linear, and Hybrid Formulations Penalize Residual Errors (y - ŷ)
  </text>

  <!-- Left Main Coordinate Plot -->
  <g transform="translate(60, 100)" filter="url(#shadow)">
    <rect width="520" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- Plot Area: Origin is at (260, 320) -->
    <!-- Grid lines -->
    <line x1="60" y1="320" x2="480" y2="320" stroke="#64748b" stroke-width="2" />
    <line x1="260" y1="50" x2="260" y2="340" stroke="#64748b" stroke-width="2" />

    <!-- Grid dashes -->
    <line x1="60" y1="230" x2="480" y2="230" stroke="#334155" stroke-dasharray="2,2" />
    <line x1="60" y1="140" x2="480" y2="140" stroke="#334155" stroke-dasharray="2,2" />
    <line x1="160" y1="50" x2="160" y2="330" stroke="#334155" stroke-dasharray="2,2" />
    <line x1="360" y1="50" x2="360" y2="330" stroke="#334155" stroke-dasharray="2,2" />

    <!-- Ticks & Labels -->
    <text x="260" y="340" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0</text>
    <text x="160" y="340" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">-2</text>
    <text x="60" y="340" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">-4</text>
    <text x="360" y="340" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">+2</text>
    <text x="460" y="340" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">+4</text>
    <text x="270" y="365" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Residual Error e = (y - ŷ) &rarr;</text>
    <text x="245" y="45" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="end">Loss L(e) &uarr;</text>

    <!-- 1. MSE Parabola (Red): L = e^2 -->
    <!-- Scaled: e=0 -> y=320, e=2 -> y=240, e=3 -> y=140, e=3.8 -> y=60 -->
    <path d="M 70 70 Q 260 380 450 70" fill="none" stroke="#ef4444" stroke-width="3" />

    <!-- 2. MAE V-Shape (Blue): L = |e| -->
    <!-- Scaled: e=0 -> y=320, e=2 -> y=260, e=4 -> y=200 -->
    <path d="M 80 140 L 260 320 L 440 140" fill="none" stroke="#38bdf8" stroke-width="3" />

    <!-- 3. Huber Curve (Green): Quadratic near center, Linear outside |e| > delta -->
    <path d="M 90 100 L 210 280 Q 260 330 310 280 L 430 100" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" />

    <!-- Labels pointing to curves -->
    <text x="460" y="80" font-family="sans-serif" font-size="11" font-weight="800" fill="#f87171">MSE (L₂)</text>
    <text x="445" y="145" font-family="sans-serif" font-size="11" font-weight="800" fill="#38bdf8">MAE (L₁)</text>
    <text x="435" y="105" font-family="sans-serif" font-size="11" font-weight="800" fill="#34d399">Huber (&delta;=1)</text>

    <!-- Outlier impact callout marker -->
    <circle cx="430" cy="90" r="5" fill="#ef4444" />
    <text x="430" y="60" font-family="sans-serif" font-size="10" font-weight="700" fill="#fca5a5" text-anchor="end">Extreme Outlier Penalty!</text>
  </g>

  <!-- Right Side Comparison Cards -->
  <g transform="translate(610, 100)">

    <!-- Card 1: MSE -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="290" height="115" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
      <rect x="0" y="0" width="290" height="24" rx="8" fill="#991b1b" />
      <text x="145" y="17" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">MSE (MEAN SQUARED ERROR)</text>
      
      <text x="14" y="44" font-family="monospace" font-size="12" font-weight="700" fill="#f87171">L(y, ŷ) = (y - ŷ)²</text>
      <text x="14" y="66" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Derivative is continuous: <tspan fill="#fca5a5">2(ŷ - y)</tspan></text>
      <text x="14" y="84" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Easy for Gradient Descent to optimize.</text>
      <text x="14" y="102" font-family="sans-serif" font-size="10" font-weight="600" fill="#f87171">⚠️ Outliers dominate and distort the model!</text>
    </g>

    <!-- Card 2: MAE -->
    <g transform="translate(0, 130)" filter="url(#shadow)">
      <rect width="290" height="115" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="0" y="0" width="290" height="24" rx="8" fill="#0369a1" />
      <text x="145" y="17" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">MAE (MEAN ABSOLUTE ERROR)</text>
      
      <text x="14" y="44" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">L(y, ŷ) = |y - ŷ|</text>
      <text x="14" y="66" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Derivative is constant: <tspan fill="#93c5fd">&plusmn;1</tspan></text>
      <text x="14" y="84" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Robust against giant outliers.</text>
      <text x="14" y="102" font-family="sans-serif" font-size="10" font-weight="600" fill="#fbbf24">⚠️ Derivative is discontinuous at error = 0.</text>
    </g>

    <!-- Card 3: HUBER -->
    <g transform="translate(0, 260)" filter="url(#shadow)">
      <rect width="290" height="120" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <rect x="0" y="0" width="290" height="24" rx="8" fill="#065f46" />
      <text x="145" y="17" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">HUBER LOSS (THE BEST OF BOTH)</text>
      
      <text x="14" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">0.5e² if |e| &le; &delta; else &delta;|e| - 0.5&delta;²</text>
      <text x="14" y="66" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Smooth quadratic curve near zero.</text>
      <text x="14" y="84" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Switches to gentle linear slope for outliers.</text>
      <text x="14" y="104" font-family="sans-serif" font-size="10" font-weight="700" fill="#a7f3d0">✅ The standard loss for robust regression.</text>
    </g>
  </g>

  <!-- Bottom Callout Footer -->
  <rect x="40" y="500" width="880" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="526" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    <tspan fill="#38bdf8" font-weight="700">The Takeaway: </tspan> If an outlier error is 10, MSE penalizes it by <tspan fill="#ef4444" font-weight="700">100</tspan>, while MAE penalizes it by <tspan fill="#38bdf8" font-weight="700">10</tspan>. Choose based on whether outliers are noise or critical hazards.
  </text>
</svg>
