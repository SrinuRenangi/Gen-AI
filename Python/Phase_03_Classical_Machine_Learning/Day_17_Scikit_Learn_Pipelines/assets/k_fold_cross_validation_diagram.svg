<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="train-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="val-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg-grad)" />

  <!-- Title Banner -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    5-FOLD CROSS-VALIDATION ARCHITECTURE
  </text>
  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Eliminating Single-Split Luck by Testing Every Data Point on an Unseen Model
  </text>

  <!-- Legend -->
  <g transform="translate(340, 95)">
    <rect x="0" y="0" width="20" height="14" rx="3" fill="url(#train-grad)" />
    <text x="28" y="12" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Training Fold (80%)</text>
    
    <rect x="175" y="0" width="20" height="14" rx="3" fill="url(#val-grad)" />
    <text x="203" y="12" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Validation Fold (20%)</text>
  </g>

  <!-- 5 FOLDS TABLE -->
  <g transform="translate(60, 130)">

    <!-- Fold Labels on Top -->
    <text x="170" y="10" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">FOLD 1</text>
    <text x="280" y="10" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">FOLD 2</text>
    <text x="390" y="10" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">FOLD 3</text>
    <text x="500" y="10" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">FOLD 4</text>
    <text x="610" y="10" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">FOLD 5</text>
    <text x="740" y="10" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle">SCORE</text>

    <!-- Split 1 -->
    <g transform="translate(0, 25)" filter="url(#shadow)">
      <text x="70" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="end">Split 1 :</text>
      <rect x="120" y="8" width="100" height="32" rx="4" fill="url(#val-grad)" stroke="#ea580c" stroke-width="1.5" />
      <text x="170" y="29" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">VALIDATION</text>
      
      <rect x="230" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="280" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>
      <rect x="340" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="390" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>
      <rect x="450" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="500" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>
      <rect x="560" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="610" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>

      <rect x="680" y="8" width="120" height="32" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="740" y="29" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Score₁ = 91.2%</text>
    </g>

    <!-- Split 2 -->
    <g transform="translate(0, 75)" filter="url(#shadow)">
      <text x="70" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="end">Split 2 :</text>
      <rect x="120" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="170" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>
      
      <rect x="230" y="8" width="100" height="32" rx="4" fill="url(#val-grad)" stroke="#ea580c" stroke-width="1.5" />
      <text x="280" y="29" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">VALIDATION</text>

      <rect x="340" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="390" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>
      <rect x="450" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="500" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>
      <rect x="560" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="610" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>

      <rect x="680" y="8" width="120" height="32" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="740" y="29" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Score₂ = 88.5%</text>
    </g>

    <!-- Split 3 -->
    <g transform="translate(0, 125)" filter="url(#shadow)">
      <text x="70" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="end">Split 3 :</text>
      <rect x="120" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="170" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>
      <rect x="230" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="280" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>

      <rect x="340" y="8" width="100" height="32" rx="4" fill="url(#val-grad)" stroke="#ea580c" stroke-width="1.5" />
      <text x="390" y="29" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">VALIDATION</text>

      <rect x="450" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="500" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>
      <rect x="560" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="610" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>

      <rect x="680" y="8" width="120" height="32" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="740" y="29" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Score₃ = 93.1%</text>
    </g>

    <!-- Split 4 -->
    <g transform="translate(0, 175)" filter="url(#shadow)">
      <text x="70" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="end">Split 4 :</text>
      <rect x="120" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="170" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>
      <rect x="230" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="280" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>
      <rect x="340" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="390" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>

      <rect x="450" y="8" width="100" height="32" rx="4" fill="url(#val-grad)" stroke="#ea580c" stroke-width="1.5" />
      <text x="500" y="29" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">VALIDATION</text>

      <rect x="560" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="610" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>

      <rect x="680" y="8" width="120" height="32" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="740" y="29" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Score₄ = 89.9%</text>
    </g>

    <!-- Split 5 -->
    <g transform="translate(0, 225)" filter="url(#shadow)">
      <text x="70" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="end">Split 5 :</text>
      <rect x="120" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="170" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>
      <rect x="230" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="280" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>
      <rect x="340" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="390" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>
      <rect x="450" y="8" width="100" height="32" rx="4" fill="url(#train-grad)" />
      <text x="500" y="28" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Train</text>

      <rect x="560" y="8" width="100" height="32" rx="4" fill="url(#val-grad)" stroke="#ea580c" stroke-width="1.5" />
      <text x="610" y="29" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">VALIDATION</text>

      <rect x="680" y="8" width="120" height="32" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="740" y="29" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Score₅ = 92.4%</text>
    </g>

    <!-- Horizontal separator line -->
    <line x1="60" y1="280" x2="810" y2="280" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Aggregation Result Card -->
    <g transform="translate(180, 298)" filter="url(#shadow)">
      <rect width="480" height="52" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
      <text x="240" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#a7f3d0" text-anchor="middle">
        CROSS-VALIDATION GENERALIZATION ESTIMATE
      </text>
      <text x="240" y="44" font-family="monospace" font-size="15" font-weight="800" fill="#34d399" text-anchor="middle">
        Mean Accuracy = 91.02%  &plusmn;  1.68% (std dev)
      </text>
    </g>
  </g>

  <!-- Bottom Callout Footer -->
  <rect x="40" y="500" width="880" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="526" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    <tspan fill="#34d399" font-weight="700">Why Cross-Validation? </tspan> Standard train/test splits can give lucky 95% scores or unlucky 82% scores. K-Fold provides a statistically robust, high-confidence benchmark.
  </text>
</svg>
