<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bg-grad)" />

  <!-- Header -->
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    CHATTEMPLATE LOSS MASKING IN SFT
  </text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Why Cross-Entropy Loss Must Ignore System &amp; User Prompts (target = -100) and Train Only on Assistant Tokens
  </text>

  <!-- Main Container -->
  <g transform="translate(60, 90)" filter="url(#shadow)">
    <rect width="840" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- ChatML Structure Banner -->
    <g transform="translate(30, 20)">
      <rect width="780" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#94a3b8">CHATML FORMATTED STRING:</text>
      <text x="20" y="48" font-family="monospace" font-size="11" fill="#38bdf8">
        &lt;|im_start|&gt;system You are a helpful AI.&lt;|im_end|&gt;&lt;|im_start|&gt;user What is 2+2?&lt;|im_end|&gt;&lt;|im_start|&gt;assistant 4&lt;|im_end|&gt;
      </text>
    </g>

    <!-- SECTION 1: SYSTEM & USER PROMPT (MASKED OUT!) -->
    <g transform="translate(30, 110)">
      <rect width="450" height="180" rx="8" fill="#450a0a" stroke="#f43f5e" stroke-width="2" />
      <rect x="0" y="0" width="450" height="28" rx="8" fill="#9f1239" />
      <text x="225" y="19" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">
        SYSTEM &amp; USER TOKENS &mdash; MASKED OUT! (NO LOSS) ❌
      </text>

      <g transform="translate(20, 45)">
        <text x="0" y="16" font-family="sans-serif" font-size="11" font-weight="800" fill="#fda4af">Input Tokens (Fed to Model):</text>
        <text x="0" y="36" font-family="monospace" font-size="10.5" fill="#fecdd3">
          ['&lt;|im_start|&gt;', 'system', 'You', 'are', '...', 'user', 'What', 'is', '2+2?']
        </text>

        <text x="0" y="68" font-family="sans-serif" font-size="11" font-weight="800" fill="#fca5a5">Target Training Labels:</text>
        <text x="0" y="88" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff">
          [-100, -100, -100, -100, -100, -100, -100, -100, -100]
        </text>

        <rect x="0" y="105" width="410" height="34" rx="4" fill="#0f172a" stroke="#f43f5e" />
        <text x="205" y="126" font-family="sans-serif" font-size="10" font-weight="800" fill="#fda4af" text-anchor="middle">
          PyTorch nn.CrossEntropyLoss(ignore_index=-100) skips these tokens!
        </text>
      </g>
    </g>

    <!-- SECTION 2: ASSISTANT COMPLETION (ACTIVE LOSS!) -->
    <g transform="translate(500, 110)">
      <rect width="310" height="180" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2.5" />
      <rect x="0" y="0" width="310" height="28" rx="8" fill="#047857" />
      <text x="155" y="19" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">
        ASSISTANT TOKENS &mdash; ACTIVE LOSS ⭐
      </text>

      <g transform="translate(20, 45)">
        <text x="0" y="16" font-family="sans-serif" font-size="11" font-weight="800" fill="#a7f3d0">Input Tokens:</text>
        <text x="0" y="36" font-family="monospace" font-size="10.5" fill="#6ee7b7">
          ['assistant', ' 4', '&lt;|im_end|&gt;']
        </text>

        <text x="0" y="68" font-family="sans-serif" font-size="11" font-weight="800" fill="#34d399">Target Training Labels:</text>
        <text x="0" y="88" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff">
          [151644, 220, 151645] (Real Token IDs!)
        </text>

        <rect x="0" y="105" width="270" height="34" rx="4" fill="#0f172a" stroke="#10b981" />
        <text x="135" y="126" font-family="sans-serif" font-size="10" font-weight="900" fill="#a7f3d0" text-anchor="middle">
          LOSS IS COMPUTED &amp; BACKPROPAGATED!
        </text>
      </g>
    </g>

    <!-- Bottom Explanation Card -->
    <g transform="translate(30, 310)">
      <rect width="780" height="90" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="25" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#fbbf24">
        WHY PROMPT MASKING IS CRITICAL FOR INSTRUCTION TUNING:
      </text>
      <text x="25" y="44" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">
        1. If you compute loss on the user's prompt, the model wastes capacity learning to generate user questions.
      </text>
      <text x="25" y="62" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">
        2. We want to maximize the conditional probability: P(Assistant Response | User Prompt).
      </text>
      <text x="25" y="80" font-family="sans-serif" font-size="10.5" fill="#34d399" font-weight="800">
        3. By masking prompt tokens with -100, 100% of gradient updates shape the model's helpful assistant persona!
      </text>
    </g>
  </g>
</svg>
