<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg-grad)" />

  <!-- Title Banner -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    THE MILESTONE: CONQUERING INTERLOCKING SPIRALS
  </text>
  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Visualizing Decision Boundary Evolution in Our From-Scratch NumPy Neural Network
  </text>

  <!-- 3 PANELS: EVOLUTION OF THE BOUNDARY -->
  <g transform="translate(40, 95)">

    <!-- PANEL 1: EPOCH 0 (RANDOM STATIC) -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="270" height="280" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
      <rect x="0" y="0" width="270" height="28" rx="10" fill="#334155" />
      <text x="135" y="19" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">EPOCH 0: RANDOM INIT</text>

      <!-- Plot Area -->
      <g transform="translate(15, 38)">
        <rect width="240" height="190" rx="6" fill="#0f172a" stroke="#475569" />
        
        <!-- Clueless random flat line boundary -->
        <line x1="20" y1="60" x2="220" y2="140" stroke="#f87171" stroke-width="2.5" stroke-dasharray="4,4" />

        <!-- Data points: Interlocking spirals -->
        <!-- Spiral A (Blue dots) -->
        <circle cx="120" cy="95" r="3" fill="#38bdf8" /><circle cx="135" cy="85" r="3" fill="#38bdf8" />
        <circle cx="150" cy="88" r="3" fill="#38bdf8" /><circle cx="160" cy="105" r="3" fill="#38bdf8" />
        <circle cx="155" cy="125" r="3" fill="#38bdf8" /><circle cx="130" cy="140" r="3" fill="#38bdf8" />
        <circle cx="95" cy="130" r="3" fill="#38bdf8" /><circle cx="80" cy="100" r="3" fill="#38bdf8" />
        <circle cx="90" cy="65" r="3" fill="#38bdf8" /><circle cx="130" cy="50" r="3" fill="#38bdf8" />
        <circle cx="180" cy="60" r="3" fill="#38bdf8" /><circle cx="205" cy="100" r="3" fill="#38bdf8" />

        <!-- Spiral B (Orange dots) -->
        <circle cx="120" cy="105" r="3" fill="#fb923c" /><circle cx="105" cy="115" r="3" fill="#fb923c" />
        <circle cx="90" cy="110" r="3" fill="#fb923c" /><circle cx="80" cy="90" r="3" fill="#fb923c" />
        <circle cx="85" cy="70" r="3" fill="#fb923c" /><circle cx="110" cy="55" r="3" fill="#fb923c" />
        <circle cx="145" cy="65" r="3" fill="#fb923c" /><circle cx="160" cy="95" r="3" fill="#fb923c" />
        <circle cx="150" cy="130" r="3" fill="#fb923c" /><circle cx="110" cy="145" r="3" fill="#fb923c" />
        <circle cx="60" cy="135" r="3" fill="#fb923c" /><circle cx="35" cy="95" r="3" fill="#fb923c" />
      </g>

      <rect x="15" y="238" width="240" height="30" rx="4" fill="#0f172a" />
      <text x="135" y="258" font-family="monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">
        Accuracy: 50.5% | Loss: 0.6931
      </text>
    </g>

    <!-- PANEL 2: EPOCH 50 (BENDING SPACE) -->
    <g transform="translate(305, 0)" filter="url(#shadow)">
      <rect width="270" height="280" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="0" y="0" width="270" height="28" rx="10" fill="#b45309" />
      <text x="135" y="19" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">EPOCH 50: BENDING SPACE</text>

      <!-- Plot Area -->
      <g transform="translate(15, 38)">
        <rect width="240" height="190" rx="6" fill="#0f172a" stroke="#475569" />
        
        <!-- Curved decision boundary beginning to adapt -->
        <path d="M 30 150 C 70 80, 100 130, 140 70 C 180 30, 220 120, 220 160" fill="none" stroke="#fbbf24" stroke-width="3" />

        <!-- Data points: Interlocking spirals -->
        <!-- Spiral A (Blue dots) -->
        <circle cx="120" cy="95" r="3" fill="#38bdf8" /><circle cx="135" cy="85" r="3" fill="#38bdf8" />
        <circle cx="150" cy="88" r="3" fill="#38bdf8" /><circle cx="160" cy="105" r="3" fill="#38bdf8" />
        <circle cx="155" cy="125" r="3" fill="#38bdf8" /><circle cx="130" cy="140" r="3" fill="#38bdf8" />
        <circle cx="95" cy="130" r="3" fill="#38bdf8" /><circle cx="80" cy="100" r="3" fill="#38bdf8" />
        <circle cx="90" cy="65" r="3" fill="#38bdf8" /><circle cx="130" cy="50" r="3" fill="#38bdf8" />
        <circle cx="180" cy="60" r="3" fill="#38bdf8" /><circle cx="205" cy="100" r="3" fill="#38bdf8" />

        <!-- Spiral B (Orange dots) -->
        <circle cx="120" cy="105" r="3" fill="#fb923c" /><circle cx="105" cy="115" r="3" fill="#fb923c" />
        <circle cx="90" cy="110" r="3" fill="#fb923c" /><circle cx="80" cy="90" r="3" fill="#fb923c" />
        <circle cx="85" cy="70" r="3" fill="#fb923c" /><circle cx="110" cy="55" r="3" fill="#fb923c" />
        <circle cx="145" cy="65" r="3" fill="#fb923c" /><circle cx="160" cy="95" r="3" fill="#fb923c" />
        <circle cx="150" cy="130" r="3" fill="#fb923c" /><circle cx="110" cy="145" r="3" fill="#fb923c" />
        <circle cx="60" cy="135" r="3" fill="#fb923c" /><circle cx="35" cy="95" r="3" fill="#fb923c" />
      </g>

      <rect x="15" y="238" width="240" height="30" rx="4" fill="#0f172a" />
      <text x="135" y="258" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">
        Accuracy: 78.4% | Loss: 0.3812
      </text>
    </g>

    <!-- PANEL 3: EPOCH 300 (PERFECT SPIRAL WRAP) -->
    <g transform="translate(610, 0)" filter="url(#shadow)">
      <rect width="270" height="280" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
      <rect x="0" y="0" width="270" height="28" rx="10" fill="#065f46" />
      <text x="135" y="19" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">EPOCH 300: PERFECT SPIRAL</text>

      <!-- Plot Area -->
      <g transform="translate(15, 38)">
        <rect width="240" height="190" rx="6" fill="#0f172a" stroke="#475569" />
        
        <!-- Fully wrapped double-spiral boundary -->
        <path d="M 120 100 C 130 90, 140 100, 135 115 C 120 135, 90 120, 90 95 C 90 60, 150 45, 175 75 C 200 105, 175 155, 125 160 C 65 165, 45 110, 50 70" 
              fill="none" stroke="#10b981" stroke-width="3" />

        <!-- Data points: Interlocking spirals -->
        <!-- Spiral A (Blue dots) -->
        <circle cx="120" cy="95" r="3" fill="#38bdf8" /><circle cx="135" cy="85" r="3" fill="#38bdf8" />
        <circle cx="150" cy="88" r="3" fill="#38bdf8" /><circle cx="160" cy="105" r="3" fill="#38bdf8" />
        <circle cx="155" cy="125" r="3" fill="#38bdf8" /><circle cx="130" cy="140" r="3" fill="#38bdf8" />
        <circle cx="95" cy="130" r="3" fill="#38bdf8" /><circle cx="80" cy="100" r="3" fill="#38bdf8" />
        <circle cx="90" cy="65" r="3" fill="#38bdf8" /><circle cx="130" cy="50" r="3" fill="#38bdf8" />
        <circle cx="180" cy="60" r="3" fill="#38bdf8" /><circle cx="205" cy="100" r="3" fill="#38bdf8" />

        <!-- Spiral B (Orange dots) -->
        <circle cx="120" cy="105" r="3" fill="#fb923c" /><circle cx="105" cy="115" r="3" fill="#fb923c" />
        <circle cx="90" cy="110" r="3" fill="#fb923c" /><circle cx="80" cy="90" r="3" fill="#fb923c" />
        <circle cx="85" cy="70" r="3" fill="#fb923c" /><circle cx="110" cy="55" r="3" fill="#fb923c" />
        <circle cx="145" cy="65" r="3" fill="#fb923c" /><circle cx="160" cy="95" r="3" fill="#fb923c" />
        <circle cx="150" cy="130" r="3" fill="#fb923c" /><circle cx="110" cy="145" r="3" fill="#fb923c" />
        <circle cx="60" cy="135" r="3" fill="#fb923c" /><circle cx="35" cy="95" r="3" fill="#fb923c" />
      </g>

      <rect x="15" y="238" width="240" height="30" rx="4" fill="#0f172a" stroke="#10b981" />
      <text x="135" y="258" font-family="monospace" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">
        Accuracy: 98.8% | Loss: 0.0412
      </text>
    </g>
  </g>

  <!-- BOTTOM LOSS CURVE STRIP -->
  <g transform="translate(40, 395)" filter="url(#shadow)">
    <rect width="880" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">TRAINING LOSS DECAY (ADAM OPTIMIZER):</text>
    
    <!-- Mini Loss Axis -->
    <line x1="250" y1="65" x2="840" y2="65" stroke="#64748b" stroke-width="1.5" />
    <line x1="250" y1="65" x2="250" y2="15" stroke="#64748b" stroke-width="1.5" />
    <text x="240" y="22" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="end">0.7</text>
    <text x="240" y="68" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="end">0.0</text>
    
    <!-- Loss decay curve -->
    <path d="M 250 22 C 300 28, 380 50, 480 58 C 600 62, 720 63, 840 64" fill="none" stroke="#10b981" stroke-width="2.5" />
    
    <text x="250" y="78" font-family="monospace" font-size="9" fill="#64748b">Epoch 0</text>
    <text x="545" y="78" font-family="monospace" font-size="9" fill="#64748b">Epoch 150</text>
    <text x="840" y="78" font-family="monospace" font-size="9" fill="#64748b" text-anchor="end">Epoch 300</text>
  </g>

  <!-- Bottom Callout Footer -->
  <rect x="40" y="500" width="880" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="526" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    <tspan fill="#34d399" font-weight="700">Milestone Achievement: </tspan> By combining modular Dense layers, ReLU activations, Binary Cross-Entropy, and Adam, our pure NumPy engine conquered the hardest non-linear benchmark in classical deep learning!
  </text>
</svg>
