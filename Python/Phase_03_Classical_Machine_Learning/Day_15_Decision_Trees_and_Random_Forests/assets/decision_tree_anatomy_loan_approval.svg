<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="500" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="230" y="20" width="490" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    🌳 Anatomy of a Decision Tree (Loan Approval)
  </text>

  <!-- Subtitle -->
  <text x="475" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    Root Node (Top Question) ➔ Internal Decision Splits ➔ Terminal Leaf Nodes (Final Answers)
  </text>

  <!-- Tree Flowchart -->
  <!-- 1. ROOT NODE (Center: 475, 120) -->
  <g transform="translate(365, 110)">
    <rect width="220" height="55" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="110" y="24" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🌱 ROOT NODE</text>
    <text x="110" y="44" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">Salary &gt;= ₹50,000?</text>
  </g>

  <!-- Left Branch (NO) -->
  <line x1="410" y1="165" x2="250" y2="220" stroke="#ef4444" stroke-width="2.5"/>
  <rect x="300" y="180" width="45" height="22" rx="4" fill="#991b1b" fill-opacity="0.5"/>
  <text x="322" y="195" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">NO</text>

  <!-- Right Branch (YES) -->
  <line x1="540" y1="165" x2="700" y2="220" stroke="#10b981" stroke-width="2.5"/>
  <rect x="605" y="180" width="45" height="22" rx="4" fill="#065f46" fill-opacity="0.5"/>
  <text x="627" y="195" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">YES</text>

  <!-- 2. LEFT INTERNAL NODE (Center: 250, 245) -->
  <g transform="translate(140, 220)">
    <rect width="220" height="55" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="110" y="24" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🔀 INTERNAL SPLIT</text>
    <text x="110" y="44" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Existing Debt &lt; ₹1L?</text>
  </g>

  <!-- 3. RIGHT INTERNAL NODE (Center: 700, 245) -->
  <g transform="translate(590, 220)">
    <rect width="220" height="55" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="110" y="24" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🔀 INTERNAL SPLIT</text>
    <text x="110" y="44" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Credit Score &gt;= 700?</text>
  </g>

  <!-- Level 2 Branches to Leaves -->
  <!-- Left-Left: NO to Reject -->
  <line x1="200" y1="275" x2="140" y2="340" stroke="#ef4444" stroke-width="2"/>
  <!-- Left-Right: YES to Approve -->
  <line x1="300" y1="275" x2="360" y2="340" stroke="#10b981" stroke-width="2"/>

  <!-- Right-Left: NO to Reject -->
  <line x1="650" y1="275" x2="590" y2="340" stroke="#ef4444" stroke-width="2"/>
  <!-- Right-Right: YES to Approve -->
  <line x1="750" y1="275" x2="810" y2="340" stroke="#10b981" stroke-width="2"/>

  <!-- 4. LEAF NODES (Bottom Layer) -->
  <!-- Leaf 1: Reject -->
  <g transform="translate(60, 340)">
    <rect width="160" height="60" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="26" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🍃 LEAF NODE</text>
    <text x="80" y="48" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" text-anchor="middle">REJECT ❌</text>
  </g>

  <!-- Leaf 2: Approve -->
  <g transform="translate(280, 340)">
    <rect width="160" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🍃 LEAF NODE</text>
    <text x="80" y="48" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" text-anchor="middle">APPROVE ✅</text>
  </g>

  <!-- Leaf 3: Reject -->
  <g transform="translate(510, 340)">
    <rect width="160" height="60" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="26" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🍃 LEAF NODE</text>
    <text x="80" y="48" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" text-anchor="middle">REJECT ❌</text>
  </g>

  <!-- Leaf 4: Approve -->
  <g transform="translate(730, 340)">
    <rect width="160" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🍃 LEAF NODE</text>
    <text x="80" y="48" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" text-anchor="middle">APPROVE ✅</text>
  </g>

  <!-- Bottom Tip Banner -->
  <rect x="60" y="445" width="830" height="35" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <text x="475" y="468" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">
    💡 <tspan fill="#38bdf8" font-weight="600">The Power of Trees:</tspan> 100% white-box explainability! Every decision can be printed as human-readable if/else logic for loan audits.
  </text>
</svg>
