<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bg-grad)" />

  <!-- Title -->
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    DISCRIMINATIVE VS GENERATIVE AI PARADIGM
  </text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Drawing a Decision Boundary P(Y | X) vs Learning the True Underlying Data Distribution P(X)
  </text>

  <!-- Two Main Comparison Panels -->
  <g transform="translate(45, 85)" filter="url(#shadow)">

    <!-- LEFT: Discriminative Modeling -->
    <g transform="translate(0, 0)">
      <rect width="420" height="430" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8" />
      <rect x="0" y="0" width="420" height="36" rx="12" fill="#1e40af" />
      <text x="210" y="24" font-family="sans-serif" font-size="13" font-weight="800" fill="#dbeafe" text-anchor="middle">
        DISCRIMINATIVE AI: P(Y | X) (THE JUDGE)
      </text>

      <!-- Subtitle & Math -->
      <g transform="translate(20, 50)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Mathematical Goal:</text>
        <rect x="0" y="22" width="380" height="32" rx="6" fill="#0f172a" stroke="#1d4ed8" />
        <text x="190" y="43" font-family="monospace" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">
          Model P(Y | X) &mdash; Probability of Label given Input
        </text>
      </g>

      <!-- Visual Scatter Plot: Decision Boundary -->
      <g transform="translate(20, 115)">
        <rect width="380" height="175" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="15" y="20" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#64748b">FEATURE SPACE &amp; SEPARATING HYPERPLANE</text>
        
        <!-- Class A Dots (Cats / Blue) -->
        <circle cx="70" cy="65" r="7" fill="#3b82f6" />
        <circle cx="100" cy="50" r="7" fill="#3b82f6" />
        <circle cx="60" cy="110" r="7" fill="#3b82f6" />
        <circle cx="115" cy="95" r="7" fill="#3b82f6" />
        <circle cx="140" cy="70" r="7" fill="#3b82f6" />
        <text x="80" y="140" font-family="sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Class 0: "Cat"</text>

        <!-- Decision Boundary Line -->
        <line x1="190" y1="30" x2="190" y2="160" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4" />
        <text x="190" y="24" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#fb7185" text-anchor="middle">DECISION BOUNDARY</text>

        <!-- Class B Dots (Dogs / Emerald) -->
        <circle cx="260" cy="60" r="7" fill="#10b981" />
        <circle cx="310" cy="80" r="7" fill="#10b981" />
        <circle cx="280" cy="120" r="7" fill="#10b981" />
        <circle cx="330" cy="135" r="7" fill="#10b981" />
        <circle cx="240" cy="100" r="7" fill="#10b981" />
        <text x="270" y="155" font-family="sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">Class 1: "Dog"</text>
      </g>

      <!-- Characteristics -->
      <g transform="translate(20, 305)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc">Key Characteristics:</text>
        <text x="0" y="32" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Does not care how data was created or what pixels mean</text>
        <text x="0" y="50" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Finds minimal mathematical surface separating classes</text>
        <text x="0" y="68" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Cannot create new cats or dogs &mdash; only classifies</text>
        <text x="0" y="86" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Examples: Logistic Reg, ResNet, BERT, XGBoost, YOLO</text>
        <text x="0" y="104" font-family="sans-serif" font-size="10.5" fill="#93c5fd">→ Output dimensionality: Low (scalar probability or class index)</text>
      </g>
    </g>

    <!-- RIGHT: Generative Modeling -->
    <g transform="translate(450, 0)">
      <rect width="420" height="430" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.8" />
      <rect x="0" y="0" width="420" height="36" rx="12" fill="#7e22ce" />
      <text x="210" y="24" font-family="sans-serif" font-size="13" font-weight="800" fill="#f3e8ff" text-anchor="middle">
        GENERATIVE AI: P(X) OR P(X | Y) (THE CREATOR)
      </text>

      <!-- Subtitle & Math -->
      <g transform="translate(20, 50)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="700" fill="#d8b4fe">Mathematical Goal:</text>
        <rect x="0" y="22" width="380" height="32" rx="6" fill="#0f172a" stroke="#7e22ce" />
        <text x="190" y="43" font-family="monospace" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">
          Model P(X) &mdash; True Probability Density of High-Dim Data
        </text>
      </g>

      <!-- Visual Distribution Density Manifold -->
      <g transform="translate(20, 115)">
        <rect width="380" height="175" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="15" y="20" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#64748b">LATENT DENSITY CONTOURS &amp; NOVEL SAMPLING</text>

        <!-- Density Contours -->
        <ellipse cx="120" cy="95" rx="85" ry="55" fill="none" stroke="#6b21a8" stroke-width="1.5" stroke-dasharray="4 2" />
        <ellipse cx="120" cy="95" rx="55" ry="35" fill="none" stroke="#9333ea" stroke-width="2" />
        <ellipse cx="120" cy="95" rx="25" ry="15" fill="#a855f7" fill-opacity="0.3" stroke="#c084fc" stroke-width="2" />

        <!-- Sampling Vector -->
        <circle cx="120" cy="95" r="4" fill="#f8fafc" />
        <text x="120" y="125" font-family="sans-serif" font-size="9" fill="#e9d5ff" text-anchor="middle">Modes of High Density P(X)</text>

        <!-- Generation Arrow to New Image -->
        <path d="M 215 95 L 265 95" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow-purple)" />
        <text x="240" y="85" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#d8b4fe" text-anchor="middle">SAMPLE x ~ P</text>

        <!-- Generated Sample Box -->
        <rect x="275" y="50" width="90" height="90" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
        <text x="320" y="88" font-family="sans-serif" font-size="18" text-anchor="middle">🎨 🐱</text>
        <text x="320" y="112" font-family="sans-serif" font-size="9" font-weight="700" fill="#c7d2fe" text-anchor="middle">Novel Synthetic</text>
        <text x="320" y="125" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Data Point x*</text>
      </g>

      <!-- Characteristics -->
      <g transform="translate(20, 305)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc">Key Characteristics:</text>
        <text x="0" y="32" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Learns structural correlations across all features/pixels</text>
        <text x="0" y="50" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Enables sampling: draw random vectors z to make new data</text>
        <text x="0" y="68" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Solves inverse problem: generating complex output from noise/prompt</text>
        <text x="0" y="86" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Examples: GPT-4, Stable Diffusion, Midjourney, VAEs, GANs</text>
        <text x="0" y="104" font-family="sans-serif" font-size="10.5" fill="#d8b4fe">→ Output dimensionality: Massive (millions of pixels or tokens)</text>
      </g>
    </g>

  </g>
</svg>
