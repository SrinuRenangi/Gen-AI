<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="500" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="230" y="20" width="490" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    📡 NumPy Broadcasting: Automatic Dimension Alignment
  </text>

  <!-- Subtitle -->
  <text x="475" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    How NumPy stretches dimensions of size 1 across larger arrays with ZERO memory copy
  </text>

  <!-- Visual Workflow: (3x3 Matrix) + (1x3 Row Vector) -->
  <g transform="translate(60, 110)">
    <!-- Array A: Shape (3 x 3) -->
    <rect x="0" y="30" width="180" height="180" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="20" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Array A (3 × 3)</text>
    
    <!-- Row 0 -->
    <text x="35" y="70" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">1</text>
    <text x="90" y="70" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">2</text>
    <text x="145" y="70" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">3</text>

    <!-- Row 1 -->
    <text x="35" y="125" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">4</text>
    <text x="90" y="125" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">5</text>
    <text x="145" y="125" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">6</text>

    <!-- Row 2 -->
    <text x="35" y="180" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">7</text>
    <text x="90" y="180" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">8</text>
    <text x="145" y="180" fill="#f8fafc" font-family="monospace" font-size="16" text-anchor="middle">9</text>

    <!-- Plus Symbol -->
    <text x="215" y="130" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="700" text-anchor="middle">+</text>

    <!-- Array B: Shape (1 x 3) [Original] -->
    <rect x="250" y="90" width="180" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="340" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Array B (1 × 3)</text>
    <text x="340" y="75" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Single row in memory</text>

    <text x="285" y="128" fill="#a7f3d0" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">10</text>
    <text x="340" y="128" fill="#a7f3d0" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">20</text>
    <text x="395" y="128" fill="#a7f3d0" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">30</text>

    <!-- Broadcast Stretch Indicator Arrow -->
    <path d="M 450 120 L 500 120" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 4"/>
    <polygon points="500,115 510,120 500,125" fill="#f59e0b"/>
    <text x="480" y="105" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">NumPy Stretches</text>

    <!-- Array B Virtual Stretched Copy (3 x 3) -->
    <rect x="525" y="30" width="180" height="180" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="615" y="20" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Stretched (Virtual 3 × 3)</text>

    <text x="560" y="70" fill="#fbbf24" font-family="monospace" font-size="16" text-anchor="middle">10</text>
    <text x="615" y="70" fill="#fbbf24" font-family="monospace" font-size="16" text-anchor="middle">20</text>
    <text x="670" y="70" fill="#fbbf24" font-family="monospace" font-size="16" text-anchor="middle">30</text>

    <text x="560" y="125" fill="#fbbf24" font-family="monospace" font-size="16" text-anchor="middle">10</text>
    <text x="615" y="125" fill="#fbbf24" font-family="monospace" font-size="16" text-anchor="middle">20</text>
    <text x="670" y="125" fill="#fbbf24" font-family="monospace" font-size="16" text-anchor="middle">30</text>

    <text x="560" y="180" fill="#fbbf24" font-family="monospace" font-size="16" text-anchor="middle">10</text>
    <text x="615" y="180" fill="#fbbf24" font-family="monospace" font-size="16" text-anchor="middle">20</text>
    <text x="670" y="180" fill="#fbbf24" font-family="monospace" font-size="16" text-anchor="middle">30</text>

    <!-- Equals Symbol -->
    <text x="730" y="130" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="700" text-anchor="middle">=</text>

    <!-- Final Result Array (3 x 3) -->
    <rect x="760" y="30" width="180" height="180" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="850" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Result (3 × 3)</text>

    <text x="795" y="70" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">11</text>
    <text x="850" y="70" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">22</text>
    <text x="905" y="70" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">33</text>

    <text x="795" y="125" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">14</text>
    <text x="850" y="125" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">25</text>
    <text x="905" y="125" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">36</text>

    <text x="795" y="180" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">17</text>
    <text x="850" y="180" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">28</text>
    <text x="905" y="180" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">39</text>
  </g>

  <!-- The Two Golden Rules Card (Bottom) -->
  <g transform="translate(60, 340)">
    <rect width="880" height="95" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">
      ⚖️ The 2 Compatibility Rules for Broadcasting:
    </text>
    <text x="25" y="55" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      1. Comparing dimensions starting from the <tspan fill="#fbbf24" font-weight="700">RIGHT (trailing edge)</tspan>: they are compatible if they are <tspan fill="#34d399" font-weight="700">EQUAL</tspan>, or one of them is <tspan fill="#34d399" font-weight="700">1</tspan>.
    </text>
    <text x="25" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      2. If a dimension is missing (e.g. 1D vector added to 2D matrix), NumPy pads a <tspan fill="#38bdf8" font-weight="600">1 on the left</tspan> automatically.
    </text>
  </g>

  <!-- Footer Banner -->
  <rect x="60" y="450" width="880" height="32" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <text x="500" y="471" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">
    💡 <tspan fill="#38bdf8" font-weight="600">In Deep Learning:</tspan> Adding biases `X @ W + b` broadcasts a single bias vector `(1 x Neurons)` across a whole batch `(Batch_Size x Neurons)`!
  </text>
</svg>
