<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bg-grad)" />

  <!-- Header -->
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    ATTENTION ALIGNMENT HEATMAP &amp; SOFT ALIGNMENT
  </text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Visualizing How Attention Resolves Syntactic Reordering (English &rarr; French Translation)
  </text>

  <!-- Left: The Heatmap Matrix -->
  <g transform="translate(60, 90)" filter="url(#shadow)">
    <rect width="460" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- English Source Labels (Columns - Top) -->
    <g transform="translate(130, 25)">
      <text x="35" y="15" font-family="monospace" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">The</text>
      <text x="105" y="15" font-family="monospace" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">European</text>
      <text x="180" y="15" font-family="monospace" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">Economic</text>
      <text x="260" y="15" font-family="monospace" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">Area</text>
    </g>

    <!-- French Target Labels (Rows - Left) -->
    <g transform="translate(20, 65)">
      <text x="95" y="40" font-family="monospace" font-size="12" font-weight="800" fill="#a7f3d0" text-anchor="end">"La"</text>
      <text x="95" y="110" font-family="monospace" font-size="12" font-weight="800" fill="#a7f3d0" text-anchor="end">"zone"</text>
      <text x="95" y="180" font-family="monospace" font-size="12" font-weight="800" fill="#a7f3d0" text-anchor="end">"économique"</text>
      <text x="95" y="250" font-family="monospace" font-size="12" font-weight="800" fill="#a7f3d0" text-anchor="end">"européenne"</text>
    </g>

    <!-- Grid Heatmap Cells -->
    <g transform="translate(130, 65)">
      <!-- Row 1: "La" -->
      <!-- [The: 0.94] -->
      <rect x="5" y="10" width="60" height="55" rx="4" fill="#10b981" />
      <text x="35" y="42" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">0.94</text>
      <!-- [European: 0.02] -->
      <rect x="75" y="10" width="60" height="55" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="105" y="42" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0.02</text>
      <!-- [Economic: 0.02] -->
      <rect x="150" y="10" width="60" height="55" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="180" y="42" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0.02</text>
      <!-- [Area: 0.02] -->
      <rect x="230" y="10" width="60" height="55" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="260" y="42" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0.02</text>

      <!-- Row 2: "zone" -> ALIGNS WITH "Area"! (Cross-jump!) -->
      <!-- [The: 0.01] -->
      <rect x="5" y="80" width="60" height="55" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="35" y="112" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0.01</text>
      <!-- [European: 0.03] -->
      <rect x="75" y="80" width="60" height="55" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="105" y="112" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0.03</text>
      <!-- [Economic: 0.04] -->
      <rect x="150" y="80" width="60" height="55" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="180" y="112" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0.04</text>
      <!-- [Area: 0.92] HIGHLIGHT -->
      <rect x="230" y="80" width="60" height="55" rx="4" fill="#10b981" />
      <text x="260" y="112" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">0.92</text>

      <!-- Row 3: "économique" -> ALIGNS WITH "Economic" -->
      <!-- [The: 0.01] -->
      <rect x="5" y="150" width="60" height="55" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="35" y="182" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0.01</text>
      <!-- [European: 0.04] -->
      <rect x="75" y="150" width="60" height="55" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="105" y="182" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0.04</text>
      <!-- [Economic: 0.91] HIGHLIGHT -->
      <rect x="150" y="150" width="60" height="55" rx="4" fill="#10b981" />
      <text x="180" y="182" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">0.91</text>
      <!-- [Area: 0.04] -->
      <rect x="230" y="150" width="60" height="55" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="260" y="182" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0.04</text>

      <!-- Row 4: "européenne" -> ALIGNS WITH "European" -->
      <!-- [The: 0.01] -->
      <rect x="5" y="220" width="60" height="55" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="35" y="252" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0.01</text>
      <!-- [European: 0.93] HIGHLIGHT -->
      <rect x="75" y="220" width="60" height="55" rx="4" fill="#10b981" />
      <text x="105" y="252" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">0.93</text>
      <!-- [Economic: 0.03] -->
      <rect x="150" y="220" width="60" height="55" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="180" y="252" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0.03</text>
      <!-- [Area: 0.03] -->
      <rect x="230" y="220" width="60" height="55" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="260" y="252" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0.03</text>
    </g>

    <text x="230" y="380" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
      Every row sums to 1.0 (Softmax distribution over source tokens)
    </text>
  </g>

  <!-- Right: The 3 Core Insights -->
  <g transform="translate(540, 90)" filter="url(#shadow)">
    <rect width="360" height="420" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="360" height="34" rx="12" fill="#065f46" />
    <text x="180" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      WHAT THE HEATMAP PROVES
    </text>

    <!-- Insight 1 -->
    <g transform="translate(20, 55)">
      <rect width="320" height="85" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#38bdf8">1. Non-Monotonic Word Reordering</text>
      <text x="15" y="44" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">In English: Adjective precedes Noun:</text>
      <text x="15" y="60" font-family="monospace" font-size="10.5" fill="#93c5fd">"European Economic Area"</text>
      <text x="15" y="76" font-family="sans-serif" font-size="10" fill="#34d399">In French: Noun comes first: "zone"!</text>
    </g>

    <!-- Insight 2 -->
    <g transform="translate(20, 155)">
      <rect width="320" height="85" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#f59e0b">2. The Cross-Diagonal Alignment</text>
      <text x="15" y="44" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">The attention weights jumped directly from</text>
      <text x="15" y="60" font-family="monospace" font-size="10.5" fill="#fde68a">"The" &rarr; "Area" (index 0 &rarr; index 3)</text>
      <text x="15" y="76" font-family="sans-serif" font-size="10" fill="#cbd5e1">Then scanned backwards! Classical RNNs failed this.</text>
    </g>

    <!-- Insight 3 -->
    <g transform="translate(20, 255)">
      <rect width="320" height="135" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#34d399">3. The Bridge to Transformers ⭐</text>
      <text x="15" y="46" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">Attention proved that words can talk</text>
      <text x="15" y="64" font-family="sans-serif" font-size="10.5" fill="#a7f3d0" font-weight="800">directly to any other word in O(1) steps,</text>
      <text x="15" y="82" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">without passing through recurrent recurrence.</text>
      <text x="15" y="108" font-family="sans-serif" font-size="11" font-weight="900" fill="#67e8f9">
        This insight launched Phase 7 (Transformers)!
      </text>
    </g>
  </g>
</svg>
