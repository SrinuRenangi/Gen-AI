<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg-grad)" />

  <!-- Title Banner -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    PADDING, STRIDE &amp; RECEPTIVE FIELD EXPANSION
  </text>
  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Controlling Output Spatial Dimensions and How Deep Neurons See Global Image Context
  </text>

  <!-- 3 Main Pillars -->
  <g transform="translate(40, 95)">

    <!-- PILLAR 1: PADDING (VALID vs SAME) -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="270" height="385" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="0" y="0" width="270" height="28" rx="10" fill="#0284c7" />
      <text x="135" y="19" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1. PADDING (P)</text>

      <!-- Zero-Padded Grid Graphic -->
      <g transform="translate(45, 45)">
        <!-- Outer Padded Border (Ring of 0s) -->
        <rect x="0" y="0" width="180" height="180" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
        
        <!-- Padded 0 labels -->
        <text x="18" y="24" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">0</text>
        <text x="54" y="24" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">0</text>
        <text x="90" y="24" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">0</text>
        <text x="126" y="24" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">0</text>
        <text x="162" y="24" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">0</text>

        <!-- Inner Real Image (3x3) -->
        <rect x="36" y="36" width="108" height="108" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <text x="90" y="95" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">Real Image</text>
        <text x="90" y="112" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">(3&times;3 Pixels)</text>
      </g>

      <!-- Comparison Details -->
      <rect x="15" y="240" width="240" height="130" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="25" y="260" font-family="sans-serif" font-size="10" font-weight="700" fill="#f87171">• Valid Padding (P = 0):</text>
      <text x="25" y="278" font-family="sans-serif" font-size="9" fill="#cbd5e1">  No padding. Image shrinks at every layer.</text>
      <text x="25" y="292" font-family="monospace" font-size="9" fill="#94a3b8">  Size: 32 &rarr; 30 &rarr; 28 (Edge info lost)</text>

      <text x="25" y="318" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399">• Same Padding (P = K//2):</text>
      <text x="25" y="336" font-family="sans-serif" font-size="9" fill="#cbd5e1">  Pads with zeros so output size = input size.</text>
      <text x="25" y="352" font-family="monospace" font-size="9" fill="#34d399">  Size: 32 &rarr; 32 &rarr; 32 (Preserved!)</text>
    </g>

    <!-- PILLAR 2: STRIDE (DOWNSAMPLING) -->
    <g transform="translate(305, 0)" filter="url(#shadow)">
      <rect width="270" height="385" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="0" y="0" width="270" height="28" rx="10" fill="#d97706" />
      <text x="135" y="19" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2. STRIDE (S)</text>

      <!-- Graphic for Stride 1 vs Stride 2 -->
      <g transform="translate(30, 45)">
        <!-- Step 1 (S=1) -->
        <rect width="210" height="85" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="15" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Stride S = 1 (Standard):</text>
        <line x1="20" y1="50" x2="190" y2="50" stroke="#475569" stroke-width="2" />
        <circle cx="30" cy="50" r="6" fill="#38bdf8" />
        <circle cx="60" cy="50" r="6" fill="#38bdf8" />
        <circle cx="90" cy="50" r="6" fill="#38bdf8" />
        <circle cx="120" cy="50" r="6" fill="#38bdf8" />
        <text x="105" y="72" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Shifts 1 pixel at a time (Dense)</text>

        <!-- Step 2 (S=2) -->
        <g transform="translate(0, 95)">
          <rect width="210" height="85" rx="6" fill="#0f172a" stroke="#f59e0b" />
          <text x="15" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#fbbf24">Stride S = 2 (Strided Downsampling):</text>
          <line x1="20" y1="50" x2="190" y2="50" stroke="#475569" stroke-width="2" />
          <circle cx="30" cy="50" r="7" fill="#f59e0b" />
          <path d="M 35 42 Q 60 25 85 42" stroke="#fbbf24" stroke-width="2" fill="none" />
          <circle cx="90" cy="50" r="7" fill="#f59e0b" />
          <path d="M 95 42 Q 120 25 145 42" stroke="#fbbf24" stroke-width="2" fill="none" />
          <circle cx="150" cy="50" r="7" fill="#f59e0b" />
          <text x="105" y="72" font-family="sans-serif" font-size="9" fill="#fde68a" text-anchor="middle">Jumps 2 pixels (Halves dimension!)</text>
        </g>
      </g>

      <!-- Dimension Formula Card -->
      <rect x="15" y="240" width="240" height="130" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="120" y="262" font-family="sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">The Universal Sizing Formula:</text>
      <rect x="25" y="275" width="190" height="34" rx="4" fill="#1e293b" />
      <text x="120" y="297" font-family="monospace" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">O = &lfloor;(W - K + 2P)/S&rfloor; + 1</text>
      
      <text x="25" y="330" font-family="sans-serif" font-size="9" fill="#cbd5e1">• W = Input dimension &nbsp;|&nbsp; K = Kernel size</text>
      <text x="25" y="348" font-family="sans-serif" font-size="9" fill="#cbd5e1">• P = Padding count &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp; S = Stride step</text>
    </g>

    <!-- PILLAR 3: RECEPTIVE FIELD EXPANSION -->
    <g transform="translate(610, 0)" filter="url(#shadow)">
      <rect width="270" height="385" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
      <rect x="0" y="0" width="270" height="28" rx="10" fill="#065f46" />
      <text x="135" y="19" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">3. RECEPTIVE FIELD GROWTH</text>

      <!-- Receptive field tree graphic -->
      <g transform="translate(30, 45)">
        <!-- Layer 2 Neuron (Single dot at top) -->
        <circle cx="105" cy="20" r="10" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
        <text x="105" y="24" font-family="monospace" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">N₂</text>
        <text x="130" y="24" font-family="sans-serif" font-size="9" fill="#a7f3d0">Layer 2</text>

        <!-- Pyramid lines to Layer 1 -->
        <path d="M 105 30 L 60 70 L 150 70 Z" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5" />
        <rect x="55" y="70" width="100" height="26" rx="4" fill="#0f172a" stroke="#10b981" />
        <text x="105" y="87" font-family="sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">Layer 1: 3&times;3 area</text>

        <!-- Pyramid lines to Raw Input -->
        <path d="M 55 96 L 15 150 L 195 150 L 155 96 Z" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
        <rect x="15" y="150" width="180" height="30" rx="4" fill="#0f172a" stroke="#38bdf8" />
        <text x="105" y="170" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">Raw Image: 5&times;5 Pixels!</text>
      </g>

      <!-- Explanation Card -->
      <rect x="15" y="240" width="240" height="130" rx="6" fill="#0f172a" stroke="#10b981" />
      <text x="25" y="262" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399">Why Stacking Convolutions Wins:</text>
      <text x="25" y="282" font-family="sans-serif" font-size="9" fill="#cbd5e1">• Two stacked 3&times;3 layers see a <tspan fill="#38bdf8" font-weight="700">5&times;5 patch</tspan>!</text>
      <text x="25" y="300" font-family="sans-serif" font-size="9" fill="#cbd5e1">• Uses 9 + 9 = <tspan fill="#34d399" font-weight="700">18 weights</tspan> instead of</text>
      <text x="25" y="315" font-family="sans-serif" font-size="9" fill="#cbd5e1">  a single 5&times;5 kernel (25 weights).</text>
      <text x="25" y="336" font-family="sans-serif" font-size="9" font-weight="700" fill="#fbbf24">Deep small filters beat giant flat filters!</text>
      <text x="25" y="352" font-family="sans-serif" font-size="8" fill="#94a3b8">(VGGNet Architectural Breakthrough)</text>
    </g>
  </g>

  <!-- Bottom Callout Footer -->
  <rect x="40" y="500" width="880" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="526" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    <tspan fill="#38bdf8" font-weight="700">The Power of Receptive Fields: </tspan> Early CNN layers detect microscopic edges; mid layers detect eyes and noses; deep layers assemble the whole human face!
  </text>
</svg>
