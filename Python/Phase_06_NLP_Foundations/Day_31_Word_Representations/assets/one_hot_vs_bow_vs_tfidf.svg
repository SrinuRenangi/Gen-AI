<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bg-grad)" />

  <!-- Header -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    CLASSICAL WORD REPRESENTATIONS
  </text>
  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    From Sparse One-Hot Encodings to Frequency-Weighted TF-IDF Vectors
  </text>

  <!-- 3 Main Columns -->
  <g transform="translate(60, 95)" filter="url(#shadow)">

    <!-- Column 1: One-Hot Encoding -->
    <g transform="translate(0, 0)">
      <rect width="265" height="410" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2" />
      <rect x="0" y="0" width="265" height="34" rx="12" fill="#be123c" />
      <text x="132" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
        1. ONE-HOT ENCODING
      </text>

      <!-- Matrix visual -->
      <g transform="translate(15, 50)">
        <rect width="235" height="130" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="12" y="24" font-family="monospace" font-size="10" fill="#94a3b8">Vocab: [cat, dog, fish, bird]</text>
        <text x="12" y="50" font-family="monospace" font-size="11" fill="#fda4af">"cat"  : [1, 0, 0, 0]</text>
        <text x="12" y="72" font-family="monospace" font-size="11" fill="#fda4af">"dog"  : [0, 1, 0, 0]</text>
        <text x="12" y="94" font-family="monospace" font-size="11" fill="#fda4af">"fish" : [0, 0, 1, 0]</text>
        <text x="12" y="116" font-family="monospace" font-size="11" fill="#fda4af">"bird" : [0, 0, 0, 1]</text>
      </g>

      <!-- Properties -->
      <g transform="translate(15, 200)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc">Vector Type:</text>
        <text x="0" y="32" font-family="sans-serif" font-size="11" fill="#cbd5e1">Word-level discrete representation</text>

        <text x="0" y="58" font-family="sans-serif" font-size="11" font-weight="800" fill="#f43f5e">Fatal Orthogonality Flaw:</text>
        <text x="0" y="76" font-family="monospace" font-size="11" fill="#fda4af">cat · dog = 0.0 (Orthogonal!)</text>
        <text x="0" y="94" font-family="sans-serif" font-size="10" fill="#94a3b8">Zero semantic distance or similarity</text>

        <text x="0" y="122" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc">Dimensionality:</text>
        <text x="0" y="140" font-family="sans-serif" font-size="11" fill="#cbd5e1">|V| = 50,000+ sparse zeros</text>

        <rect x="0" y="160" width="235" height="36" rx="6" fill="#450a0a" stroke="#f43f5e" />
        <text x="117" y="182" font-family="sans-serif" font-size="10" font-weight="700" fill="#fecdd3" text-anchor="middle">
          Massive sparsity &amp; no context
        </text>
      </g>
    </g>

    <!-- Column 2: Bag of Words (BoW) -->
    <g transform="translate(287, 0)">
      <rect width="265" height="410" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
      <rect x="0" y="0" width="265" height="34" rx="12" fill="#1d4ed8" />
      <text x="132" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
        2. BAG OF WORDS (BoW)
      </text>

      <!-- Matrix visual -->
      <g transform="translate(15, 50)">
        <rect width="235" height="130" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="12" y="24" font-family="monospace" font-size="10" fill="#94a3b8">Doc: "the cat saw another cat"</text>
        <text x="12" y="50" font-family="monospace" font-size="11" fill="#93c5fd">"the"     : 1 count</text>
        <text x="12" y="72" font-family="monospace" font-size="11" fill="#60a5fa" font-weight="800">"cat"     : 2 counts</text>
        <text x="12" y="94" font-family="monospace" font-size="11" fill="#93c5fd">"saw"     : 1 count</text>
        <text x="12" y="116" font-family="monospace" font-size="11" fill="#93c5fd">"another" : 1 count</text>
      </g>

      <!-- Properties -->
      <g transform="translate(15, 200)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc">Vector Type:</text>
        <text x="0" y="32" font-family="sans-serif" font-size="11" fill="#cbd5e1">Document-level word frequency</text>

        <text x="0" y="58" font-family="sans-serif" font-size="11" font-weight="800" fill="#38bdf8">Fatal Order Loss Flaw:</text>
        <text x="0" y="76" font-family="sans-serif" font-size="10" fill="#cbd5e1">"Dog bites man" = "Man bites dog"</text>
        <text x="0" y="94" font-family="sans-serif" font-size="10" fill="#94a3b8">Word order &amp; grammar discarded</text>

        <text x="0" y="122" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc">Stopword Bias:</text>
        <text x="0" y="140" font-family="sans-serif" font-size="11" fill="#cbd5e1">"the", "is" get highest counts!</text>

        <rect x="0" y="160" width="235" height="36" rx="6" fill="#172554" stroke="#3b82f6" />
        <text x="117" y="182" font-family="sans-serif" font-size="10" font-weight="700" fill="#bfdbfe" text-anchor="middle">
          Simple counts, order destroyed
        </text>
      </g>
    </g>

    <!-- Column 3: TF-IDF -->
    <g transform="translate(575, 0)">
      <rect width="265" height="410" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5" />
      <rect x="0" y="0" width="265" height="34" rx="12" fill="#047857" />
      <text x="132" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
        3. TF-IDF VECTORIZATION ⭐
      </text>

      <!-- Matrix visual -->
      <g transform="translate(15, 50)">
        <rect width="235" height="130" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
        <text x="12" y="24" font-family="monospace" font-size="10" fill="#94a3b8">Weight = TF(t,d) × IDF(t,D)</text>
        <text x="12" y="50" font-family="monospace" font-size="11" fill="#6ee7b7">"quantum" : 0.842 (Rare!)</text>
        <text x="12" y="72" font-family="monospace" font-size="11" fill="#34d399">"physics" : 0.519 (Key topic)</text>
        <text x="12" y="94" font-family="monospace" font-size="11" fill="#94a3b8">"system"  : 0.115 (Common)</text>
        <text x="12" y="116" font-family="monospace" font-size="11" fill="#64748b">"the"     : 0.000 (Penalized!)</text>
      </g>

      <!-- Properties -->
      <g transform="translate(15, 200)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc">Vector Type:</text>
        <text x="0" y="32" font-family="sans-serif" font-size="11" fill="#cbd5e1">Information-theoretic importance</text>

        <text x="0" y="58" font-family="sans-serif" font-size="11" font-weight="800" fill="#10b981">Why It Excels in Search:</text>
        <text x="0" y="76" font-family="sans-serif" font-size="10" fill="#a7f3d0">✔ Penalizes ubiquitous words (IDF)</text>
        <text x="0" y="94" font-family="sans-serif" font-size="10" fill="#a7f3d0">✔ Rewards rare, discriminative words</text>

        <text x="0" y="122" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc">L2 Normalized:</text>
        <text x="0" y="140" font-family="sans-serif" font-size="11" fill="#cbd5e1">Fair comparison across doc lengths</text>

        <rect x="0" y="160" width="235" height="36" rx="6" fill="#064e3b" stroke="#10b981" />
        <text x="117" y="182" font-family="sans-serif" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">
          Industry standard for Search &amp; RAG
        </text>
      </g>
    </g>
  </g>
</svg>
