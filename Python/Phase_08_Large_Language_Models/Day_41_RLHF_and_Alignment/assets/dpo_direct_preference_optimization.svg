<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="dpo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#dpo-bg)" />

  <!-- Header -->
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    PPO VS DIRECT PREFERENCE OPTIMIZATION (DPO)
  </text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Replacing Complex Reinforcement Learning with an Implicit Closed-Form Supervised Objective
  </text>

  <!-- COMPARISON PANELS -->
  <g transform="translate(45, 85)" filter="url(#card-shadow)">

    <!-- LEFT PANEL: PPO Architecture (Complex, 4 Models) -->
    <g transform="translate(0, 0)">
      <rect width="420" height="445" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1.8" />
      <rect x="0" y="0" width="420" height="36" rx="14" fill="#881337" />
      <text x="210" y="24" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffe4e6" text-anchor="middle">
        CLASSICAL RLHF VIA PPO (COMPLEX &amp; UNSTABLE)
      </text>

      <!-- 4 Models in Memory -->
      <g transform="translate(20, 50)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="800" fill="#fca5a5">
          REQUIRES 4 FULL MODELS CONCURRENTLY IN VRAM:
        </text>

        <!-- Model 1: Policy -->
        <rect x="0" y="26" width="180" height="42" rx="6" fill="#0f172a" stroke="#f43f5e" />
        <text x="10" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#fca5a5">π_θ (Policy / Actor)</text>
        <text x="10" y="58" font-family="sans-serif" font-size="9" fill="#94a3b8">Active Gradients (Trainable)</text>

        <!-- Model 2: Critic -->
        <rect x="200" y="26" width="180" height="42" rx="6" fill="#0f172a" stroke="#f43f5e" />
        <text x="210" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#fca5a5">V_φ (Critic / Value)</text>
        <text x="210" y="58" font-family="sans-serif" font-size="9" fill="#94a3b8">Active Gradients (Trainable)</text>

        <!-- Model 3: Reference -->
        <rect x="0" y="78" width="180" height="42" rx="6" fill="#0f172a" stroke="#64748b" />
        <text x="10" y="96" font-family="monospace" font-size="11" font-weight="700" fill="#cbd5e1">π_ref (Reference LLM)</text>
        <text x="10" y="110" font-family="sans-serif" font-size="9" fill="#64748b">Frozen (KL Divergence Guard)</text>

        <!-- Model 4: Reward -->
        <rect x="200" y="78" width="180" height="42" rx="6" fill="#0f172a" stroke="#64748b" />
        <text x="210" y="96" font-family="monospace" font-size="11" font-weight="700" fill="#cbd5e1">r_ψ (Reward Model)</text>
        <text x="210" y="110" font-family="sans-serif" font-size="9" fill="#64748b">Frozen (Outputs Scalar Score)</text>
      </g>

      <!-- PPO Loop Diagram -->
      <g transform="translate(20, 185)">
        <rect width="380" height="110" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="190" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle">
          Dynamic Online Sampling &amp; RL Training Loop
        </text>

        <text x="20" y="48" font-family="sans-serif" font-size="10" fill="#cbd5e1">1. Sample completion y ~ π_θ(· | x) dynamically</text>
        <text x="20" y="66" font-family="sans-serif" font-size="10" fill="#cbd5e1">2. Compute Reward: R = r_ψ(x, y) - β · KL(π_θ || π_ref)</text>
        <text x="20" y="84" font-family="sans-serif" font-size="10" fill="#cbd5e1">3. Compute Generalized Advantage Estimator (GAE)</text>
        <text x="20" y="102" font-family="sans-serif" font-size="10" fill="#cbd5e1">4. Clip surrogate loss &amp; update Actor + Critic weights</text>
      </g>

      <!-- Drawbacks -->
      <g transform="translate(20, 310)">
        <rect width="380" height="115" rx="8" fill="#450a0a" stroke="#b91c1c" />
        <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#fecaca">CORE DRAWBACKS:</text>
        <text x="14" y="42" font-family="sans-serif" font-size="10" fill="#fee2e2">✗ Extreme VRAM cost (4 concurrent LLMs in memory)</text>
        <text x="14" y="60" font-family="sans-serif" font-size="10" fill="#fee2e2">✗ Training instability (sensitive to KL β, GAE γ, learning rates)</text>
        <text x="14" y="78" font-family="sans-serif" font-size="10" fill="#fee2e2">✗ Slow throughput: generation bottleneck during training</text>
        <text x="14" y="96" font-family="sans-serif" font-size="10" fill="#fee2e2">✗ Prone to reward hacking and policy collapse</text>
      </g>
    </g>

    <!-- RIGHT PANEL: DPO Architecture (Elegant, 2 Models, Closed-Form) -->
    <g transform="translate(450, 0)">
      <rect width="420" height="445" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.8" />
      <rect x="0" y="0" width="420" height="36" rx="14" fill="#065f46" />
      <text x="210" y="24" font-family="sans-serif" font-size="13" font-weight="800" fill="#d1fae5" text-anchor="middle">
        DIRECT PREFERENCE OPTIMIZATION (DPO) (ELEGANT &amp; FAST)
      </text>

      <!-- 2 Models in Memory -->
      <g transform="translate(20, 50)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="800" fill="#6ee7b7">
          REQUIRES ONLY 2 MODELS (NO REWARD MODEL, NO CRITIC):
        </text>

        <!-- Model 1: Policy -->
        <rect x="0" y="26" width="180" height="42" rx="6" fill="#0f172a" stroke="#10b981" />
        <text x="10" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#6ee7b7">π_θ (Active Policy)</text>
        <text x="10" y="58" font-family="sans-serif" font-size="9" fill="#94a3b8">Active Gradients (Trainable)</text>

        <!-- Model 2: Reference -->
        <rect x="200" y="26" width="180" height="42" rx="6" fill="#0f172a" stroke="#64748b" />
        <text x="210" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#cbd5e1">π_ref (Reference LLM)</text>
        <text x="210" y="58" font-family="sans-serif" font-size="9" fill="#64748b">Frozen (Anchor from SFT)</text>
      </g>

      <!-- Mathematical Breakthrough Box -->
      <g transform="translate(20, 135)">
        <rect width="380" height="160" rx="8" fill="#0f172a" stroke="#10b981" stroke-dasharray="3 3" />
        <text x="190" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">
          The Mathematical Substitution Breakthrough
        </text>

        <text x="15" y="44" font-family="sans-serif" font-size="10" fill="#cbd5e1">Reward is analytically expressed by Policy ratio:</text>
        <rect x="20" y="54" width="340" height="28" rx="4" fill="#064e3b" />
        <text x="190" y="73" font-family="monospace" font-size="11.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">
          r(x, y) = β · log [ π_θ(y|x) / π_ref(y|x) ]
        </text>

        <text x="15" y="102" font-family="sans-serif" font-size="10" fill="#cbd5e1">Direct Binary Cross-Entropy Loss on Pairs (x, y_w, y_l):</text>
        <rect x="20" y="112" width="340" height="34" rx="4" fill="#0f291e" stroke="#059669" />
        <text x="190" y="133" font-family="monospace" font-size="10.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">
          L_DPO = -E [ log σ( β log(π_θ/π_ref)_w - β log(π_θ/π_ref)_l ) ]
        </text>
      </g>

      <!-- Advantages -->
      <g transform="translate(20, 310)">
        <rect width="380" height="115" rx="8" fill="#064e3b" stroke="#059669" />
        <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#a7f3d0">CORE BREAKTHROUGHS:</text>
        <text x="14" y="42" font-family="sans-serif" font-size="10" fill="#d1fae5">✓ 50%+ VRAM savings: No Critic ($V_\phi$) or Reward Model ($r_\psi$)</text>
        <text x="14" y="60" font-family="sans-serif" font-size="10" fill="#d1fae5">✓ 100% Supervised &amp; Stable: Standard binary cross-entropy gradient</text>
        <text x="14" y="78" font-family="sans-serif" font-size="10" fill="#d1fae5">✓ No generation during training: 3x-5x faster throughput</text>
        <text x="14" y="96" font-family="sans-serif" font-size="10" fill="#d1fae5">✓ Adopted universally (Llama 3, Zephyr, Mistral Instruct, Gemma)</text>
      </g>
    </g>

  </g>
</svg>
