<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bg-grad)" />

  <!-- Header -->
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    WHY SCALE BY 1/&radic;dₖ? THE SOFTMAX GRADIENT VANISHING PROOF
  </text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    How High-Dimensional Dot Products Saturate Softmax and Why &radic;dₖ Saves Gradient Descent
  </text>

  <!-- Left Half: Without Scaling (Catastrophe) -->
  <g transform="translate(60, 90)" filter="url(#shadow)">
    <rect width="410" height="420" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2" />
    <rect x="0" y="0" width="410" height="34" rx="12" fill="#9f1239" />
    <text x="205" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      WITHOUT SCALING (Raw Q &times; Kᵀ) ❌
    </text>

    <!-- Mathematical Variance -->
    <g transform="translate(20, 50)">
      <rect width="370" height="75" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="15" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#fda4af">Variance Explodes with Dimension:</text>
      <text x="15" y="44" font-family="monospace" font-size="11" fill="#cbd5e1">Var(q &middot; k) = dₖ</text>
      <text x="15" y="62" font-family="sans-serif" font-size="10.5" fill="#fca5a5">If dₖ = 64 &rarr; Std Dev = &radic;64 = 8.0 &rarr; Dot Products &plusmn;24!</text>
    </g>

    <!-- Softmax Saturated Curve Chart -->
    <g transform="translate(45, 140)">
      <!-- Axes -->
      <line x1="0" y1="140" x2="330" y2="140" stroke="#64748b" stroke-width="1.5" />
      <line x1="165" y1="140" x2="165" y2="10" stroke="#64748b" stroke-width="1.5" />
      <text x="320" y="155" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">Dot Product (z)</text>
      <text x="175" y="20" font-family="sans-serif" font-size="10" fill="#94a3b8">Softmax(z)</text>

      <!-- Saturated Sigmoidal / Softmax Curve -->
      <path d="M 20 138 L 80 138 Q 130 135, 165 75 T 250 12 L 310 12" fill="none" stroke="#ef4444" stroke-width="3" />

      <!-- Flat saturation highlights -->
      <rect x="230" y="5" width="80" height="20" rx="4" fill="#450a0a" stroke="#ef4444" />
      <text x="270" y="19" font-family="sans-serif" font-size="9" font-weight="800" fill="#fca5a5" text-anchor="middle">
        Slope &approx; 0 (Dead!)
      </text>

      <rect x="20" y="125" width="80" height="20" rx="4" fill="#450a0a" stroke="#ef4444" />
      <text x="60" y="139" font-family="sans-serif" font-size="9" font-weight="800" fill="#fca5a5" text-anchor="middle">
        Slope &approx; 0 (Dead!)
      </text>
    </g>

    <!-- Verdict -->
    <g transform="translate(20, 310)">
      <rect width="370" height="90" rx="8" fill="#450a0a" stroke="#f43f5e" />
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#fca5a5">The Vanishing Gradient Catastrophe:</text>
      <text x="15" y="44" font-family="sans-serif" font-size="10.5" fill="#fecdd3">• One token gets Softmax = 1.000, all others get 0.000</text>
      <text x="15" y="62" font-family="monospace" font-size="10.5" fill="#fda4af">&part;Softmax / &part;z = S_i(1 - S_i) = 1(1 - 1) = 0.000!</text>
      <text x="15" y="80" font-family="sans-serif" font-size="10.5" fill="#fecdd3">• Gradient dies. Neural network stops learning.</text>
    </g>
  </g>

  <!-- Right Half: With Scaling (1/sqrt(d_k)) -->
  <g transform="translate(490, 90)" filter="url(#shadow)">
    <rect width="410" height="420" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="410" height="34" rx="12" fill="#047857" />
    <text x="205" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      WITH SCALING (&divide; &radic;dₖ) ⭐
    </text>

    <!-- Mathematical Variance Solution -->
    <g transform="translate(20, 50)">
      <rect width="370" height="75" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="15" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#34d399">Variance Normalized to Exactly 1.0:</text>
      <text x="15" y="44" font-family="monospace" font-size="11" fill="#cbd5e1">Var( (q &middot; k) / &radic;dₖ ) = Var(q &middot; k) / dₖ = 1.00</text>
      <text x="15" y="62" font-family="sans-serif" font-size="10.5" fill="#a7f3d0">Std Dev = 1.0 &rarr; Dot Products land smoothly between -2.0 and +2.0!</text>
    </g>

    <!-- Responsive Softmax Curve Chart -->
    <g transform="translate(45, 140)">
      <!-- Axes -->
      <line x1="0" y1="140" x2="330" y2="140" stroke="#64748b" stroke-width="1.5" />
      <line x1="165" y1="140" x2="165" y2="10" stroke="#64748b" stroke-width="1.5" />
      <text x="320" y="155" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">Scaled Score (z / &radic;dₖ)</text>
      <text x="175" y="20" font-family="sans-serif" font-size="10" fill="#94a3b8">Softmax</text>

      <!-- Smooth active curve -->
      <path d="M 50 130 Q 130 115, 165 75 T 280 20" fill="none" stroke="#10b981" stroke-width="3" />

      <!-- Active linear region box -->
      <rect x="120" y="35" width="90" height="80" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="165" y="65" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">
        ACTIVE ZONE
      </text>
      <text x="165" y="80" font-family="sans-serif" font-size="9" font-weight="800" fill="#a7f3d0" text-anchor="middle">
        High Gradients!
      </text>
      <text x="165" y="95" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">
        [-2.0 to +2.0]
      </text>
    </g>

    <!-- Verdict -->
    <g transform="translate(20, 310)">
      <rect width="370" height="90" rx="8" fill="#064e3b" stroke="#10b981" />
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#a7f3d0">Why It Enables Deep Transformers:</text>
      <text x="15" y="44" font-family="sans-serif" font-size="10.5" fill="#d1fae5">• Keeps Softmax in its responsive linear regime</text>
      <text x="15" y="62" font-family="sans-serif" font-size="10.5" fill="#d1fae5">• Gradients flow freely through 100+ layers without vanishing</text>
      <text x="15" y="80" font-family="sans-serif" font-size="10.5" fill="#d1fae5">• Allows stable training with any head dimension d_k</text>
    </g>
  </g>
</svg>
