<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="500" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="230" y="20" width="490" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    📏 Linear Regression: The Line of Best Fit &amp; Residuals
  </text>

  <!-- Subtitle -->
  <text x="475" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    Finding the line y = wx + b that minimizes the sum of squared vertical errors (Residuals)
  </text>

  <!-- Left Side: The Coordinate Plot (Center at 300, 270) -->
  <g transform="translate(60, 110)">
    <!-- Axes -->
    <line x1="60" y1="280" x2="480" y2="280" stroke="#64748b" stroke-width="2"/>
    <line x1="60" y1="280" x2="60" y2="40" stroke="#64748b" stroke-width="2"/>
    <polygon points="480,275 492,280 480,285" fill="#64748b"/>
    <polygon points="55,40 60,28 65,40" fill="#64748b"/>

    <text x="480" y="305" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Feature X (e.g. Area sqft)</text>
    <text x="50" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Target y (Price)</text>

    <!-- The Best Fit Line: y = 0.5x + 50 (from (60, 250) to (460, 80)) -->
    <line x1="60" y1="250" x2="460" y2="80" stroke="#ef4444" stroke-width="3.5" filter="url(#shadow)"/>
    <text x="360" y="90" fill="#f87171" font-family="monospace" font-size="13" font-weight="700">ŷ = wx + b</text>

    <!-- Intercept indicator on Y axis -->
    <circle cx="60" cy="250" r="4" fill="#f59e0b"/>
    <text x="25" y="255" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">b (Bias)</text>

    <!-- Point 1: (120, 200), line is at 224. Residual = 24 UP -->
    <line x1="120" y1="224" x2="120" y2="190" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="120" cy="190" r="7" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5"/>

    <!-- Point 2: (190, 215), line is at 194. Residual = 21 DOWN -->
    <line x1="190" y1="194" x2="190" y2="225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="190" cy="225" r="7" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5"/>

    <!-- Point 3: (270, 140), line is at 160. Residual = 20 UP (Highlighted) -->
    <line x1="270" y1="160" x2="270" y2="125" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="270" cy="125" r="8" fill="#f59e0b" stroke="#fef08a" stroke-width="2"/>
    <text x="285" y="145" fill="#fde68a" font-family="monospace" font-size="11" font-weight="700">Residual (y - ŷ)</text>

    <!-- Point 4: (340, 150), line is at 131. Residual = 19 DOWN -->
    <line x1="340" y1="131" x2="340" y2="155" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="340" cy="155" r="7" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5"/>

    <!-- Point 5: (420, 80), line is at 97. Residual = 17 UP -->
    <line x1="420" y1="97" x2="420" y2="75" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="420" cy="75" r="7" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5"/>
  </g>

  <!-- Right Side: Explanation Cards -->
  <g transform="translate(560, 110)">
    <!-- Card 1: The Equation -->
    <rect width="340" height="95" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="28" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">📐 The Prediction Equation</text>
    <text x="20" y="58" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="700">
      ŷ = w·x + b
    </text>
    <text x="20" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      w = Weight (Slope / Rate), b = Bias (Y-Intercept)
    </text>

    <!-- Card 2: Mean Squared Error -->
    <rect y="115" width="340" height="110" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="142" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">🎯 Loss Function: MSE</text>
    <text x="20" y="170" fill="#f8fafc" font-family="monospace" font-size="13">
      MSE = (1/m) · Σ (y - ŷ)²
    </text>
    <text x="20" y="195" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      • Squaring turns all negatives into positives
    </text>
    <text x="20" y="212" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      • Heavily penalizes giant mistakes!
    </text>

    <!-- Card 3: The Goal -->
    <rect y="245" width="340" height="75" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="272" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">🤖 How the Computer Trains</text>
    <text x="20" y="295" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      It uses <tspan fill="#38bdf8" font-weight="600">Gradient Descent (Day 08)</tspan> to nudge w and b until MSE is at the absolute minimum!
    </text>
  </g>

  <!-- Bottom Tip Banner -->
  <rect x="60" y="445" width="840" height="35" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <text x="480" y="468" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">
    💡 <tspan fill="#38bdf8" font-weight="600">Taxi Meter Analogy:</tspan> Fare = (₹15/km × distance) + ₹50 base fare. Here, w = 15, x = distance, b = 50.
  </text>
</svg>
