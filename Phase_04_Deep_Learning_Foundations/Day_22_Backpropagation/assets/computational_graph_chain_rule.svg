<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="fwd-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="bwd-arrow" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1 L 0 5 L 8 9 z" fill="#ef4444" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg-grad)" />

  <!-- Title Banner -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    AUTOGRAD COMPUTATIONAL GRAPH: LOCAL DERIVATIVES
  </text>
  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Deconstructing How a Single Node Transforms Upstream Gradients via the Chain Rule
  </text>

  <!-- Main Container -->
  <g transform="translate(60, 95)" filter="url(#shadow)">
    <rect width="840" height="385" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- Left Side: Inputs & Local Gradient Equations -->
    <!-- Input 1: Weight w -->
    <g transform="translate(50, 40)">
      <circle cx="35" cy="35" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <text x="35" y="40" font-family="monospace" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">w</text>
      
      <!-- Forward Arrow -->
      <line x1="60" y1="35" x2="190" y2="120" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#fwd-arrow)" />
      
      <!-- Backward Arrow & Chain Rule Equation -->
      <line x1="180" y1="135" x2="70" y2="50" stroke="#ef4444" stroke-width="2.5" marker-end="url(#bwd-arrow)" />
      <rect x="0" y="70" width="170" height="42" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
      <text x="85" y="88" font-family="monospace" font-size="10" font-weight="700" fill="#f87171" text-anchor="middle">&part;&Lscr;/&part;w = (&part;&Lscr;/&part;z) &middot; (&part;z/&part;w)</text>
      <text x="85" y="104" font-family="monospace" font-size="11" font-weight="800" fill="#fca5a5" text-anchor="middle">= &delta; &middot; x</text>
    </g>

    <!-- Input 2: Data x -->
    <g transform="translate(50, 150)">
      <circle cx="35" cy="35" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <text x="35" y="40" font-family="monospace" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">x</text>
      
      <!-- Forward Arrow -->
      <line x1="60" y1="35" x2="190" y2="40" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#fwd-arrow)" />
      
      <!-- Backward Arrow & Chain Rule Equation -->
      <line x1="180" y1="50" x2="70" y2="45" stroke="#ef4444" stroke-width="2.5" marker-end="url(#bwd-arrow)" />
      <rect x="0" y="65" width="170" height="42" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
      <text x="85" y="83" font-family="monospace" font-size="10" font-weight="700" fill="#f87171" text-anchor="middle">&part;&Lscr;/&part;x = (&part;&Lscr;/&part;z) &middot; (&part;z/&part;x)</text>
      <text x="85" y="99" font-family="monospace" font-size="11" font-weight="800" fill="#fca5a5" text-anchor="middle">= &delta; &middot; w</text>
    </g>

    <!-- Input 3: Bias b -->
    <g transform="translate(50, 260)">
      <circle cx="35" cy="35" r="22" fill="#0f172a" stroke="#fbbf24" stroke-width="2" />
      <text x="35" y="40" font-family="monospace" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle">b</text>
      
      <!-- Forward Arrow -->
      <line x1="60" y1="35" x2="190" y2="-40" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#fwd-arrow)" />
      
      <!-- Backward Arrow & Chain Rule Equation -->
      <line x1="180" y1="-30" x2="70" y2="25" stroke="#ef4444" stroke-width="2.5" marker-end="url(#bwd-arrow)" />
      <rect x="0" y="65" width="170" height="42" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
      <text x="85" y="83" font-family="monospace" font-size="10" font-weight="700" fill="#f87171" text-anchor="middle">&part;&Lscr;/&part;b = (&part;&Lscr;/&part;z) &middot; (&part;z/&part;b)</text>
      <text x="85" y="99" font-family="monospace" font-size="11" font-weight="800" fill="#fca5a5" text-anchor="middle">= &delta; &middot; 1.0</text>
    </g>

    <!-- CENTRAL COMPUTATIONAL NODE -->
    <g transform="translate(320, 95)" filter="url(#shadow)">
      <rect width="180" height="190" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2.5" />
      <rect x="0" y="0" width="180" height="34" rx="14" fill="url(#node-grad)" />
      <text x="90" y="23" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
        OPERATION NODE
      </text>

      <text x="90" y="70" font-family="monospace" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle">z = w&middot;x + b</text>

      <line x1="20" y1="90" x2="160" y2="90" stroke="#334155" />

      <text x="90" y="112" font-family="sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">LOCAL DERIVATIVES:</text>
      <text x="90" y="132" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">&part;z/&part;w = x</text>
      <text x="90" y="152" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">&part;z/&part;x = w</text>
      <text x="90" y="172" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">&part;z/&part;b = 1</text>
    </g>

    <!-- Right Side: Forward Output and Downstream Incoming Gradient -->
    <!-- Forward output arrow -->
    <line x1="505" y1="170" x2="620" y2="170" stroke="#38bdf8" stroke-width="3" marker-end="url(#fwd-arrow)" />
    <text x="560" y="155" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">z (forward)</text>

    <!-- Backward incoming gradient arrow -->
    <line x1="620" y1="210" x2="515" y2="210" stroke="#ef4444" stroke-width="3" marker-end="url(#bwd-arrow)" />
    <text x="565" y="230" font-family="monospace" font-size="11" font-weight="800" fill="#f87171" text-anchor="middle">&part;&Lscr;/&part;z = &delta;</text>
    <text x="565" y="244" font-family="sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">(Incoming from output)</text>

    <!-- Right Box: Upstream Network / Loss -->
    <g transform="translate(630, 115)">
      <rect width="170" height="150" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="85" y="28" font-family="sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">SUBSEQUENT LAYERS</text>
      <text x="85" y="55" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Activation &sigma;(z)</text>
      <text x="85" y="75" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Deeper Layers...</text>
      <text x="85" y="95" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Final Loss &Lscr;(y, ŷ)</text>
      
      <rect x="15" y="110" width="140" height="26" rx="4" fill="#064e3b" />
      <text x="85" y="127" font-family="monospace" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">Sends &delta; backward!</text>
    </g>

    <!-- Bottom summary banner -->
    <rect x="25" y="325" width="790" height="42" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="420" y="350" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">
      <tspan fill="#fbbf24" font-weight="700">The Golden Rule of Autograd: </tspan>
      Gradient with respect to any input = <tspan fill="#f87171" font-weight="700">(Incoming Gradient &part;&Lscr;/&part;z)</tspan> &times; <tspan fill="#38bdf8" font-weight="700">(Local Derivative &part;z/&part;input)</tspan>
    </text>
  </g>

  <!-- Bottom Callout Footer -->
  <rect x="40" y="500" width="880" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="526" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    <tspan fill="#38bdf8" font-weight="700">PyTorch Under the Hood: </tspan> When you call <tspan fill="#f1f5f9" font-family="monospace">loss.backward()</tspan>, PyTorch traverses this exact graph in reverse, executing this exact node multiplication for every tensor!
  </text>
</svg>
