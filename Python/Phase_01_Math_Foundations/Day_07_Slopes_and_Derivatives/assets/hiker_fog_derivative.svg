<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="valleyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="940" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="470" y="44" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">
    THE HIKER IN THE FOG: HOW AI FINDS THE LOWEST ERROR
  </text>
  <text x="470" y="70" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    You cannot see the whole landscape. You feel the ground slope under your boots to step downhill.
  </text>

  <!-- Bowl / Mountain Curve -->
  <path d="M 100 130 Q 470 450 840 130" stroke="#38bdf8" stroke-width="4" fill="none"/>
  <path d="M 100 130 Q 470 450 840 130 L 840 420 L 100 420 Z" fill="url(#valleyGrad)"/>

  <!-- Ground Flat Line at Bottom -->
  <line x1="420" y1="360" x2="520" y2="360" stroke="#10b981" stroke-width="3"/>
  <circle cx="470" cy="360" r="7" fill="#10b981"/>
  <text x="470" y="390" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">
    Slope = 0 (Minimum Error! 🎯)
  </text>

  <!-- LEFT SIDE: NEGATIVE SLOPE -->
  <g transform="translate(180, 240)">
    <!-- Tangent slope line -->
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,3"/>
    <!-- Hiker icon circle -->
    <circle cx="0" cy="0" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-size="14" fill="#ffffff" text-anchor="middle">🚶</text>
    
    <!-- Callout Box Left -->
    <rect x="-140" y="-120" width="220" height="64" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="-30" y="-100" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f87171" text-anchor="middle">NEGATIVE SLOPE (&lt; 0)</text>
    <text x="-30" y="-83" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Ground tilts downhill to right</text>
    <text x="-30" y="-66" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">ACTION: Step RIGHT ➔</text>
  </g>

  <!-- RIGHT SIDE: POSITIVE SLOPE -->
  <g transform="translate(720, 210)">
    <!-- Tangent slope line -->
    <line x1="-50" y1="50" x2="50" y2="-50" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,3"/>
    <!-- Hiker icon circle -->
    <circle cx="0" cy="0" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-size="14" fill="#ffffff" text-anchor="middle">🚶</text>

    <!-- Callout Box Right -->
    <rect x="-80" y="-120" width="220" height="64" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="30" y="-100" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#60a5fa" text-anchor="middle">POSITIVE SLOPE (&gt; 0)</text>
    <text x="30" y="-83" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Ground tilts uphill to right</text>
    <text x="30" y="-66" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">ACTION: Step LEFT ⬅</text>
  </g>

  <!-- Golden Rule Banner at Bottom -->
  <g transform="translate(120, 420)">
    <rect width="700" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="350" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle">
      THE GOLDEN RULE: Always step in the OPPOSITE direction of the slope!  (w_new = w_old - lr * slope)
    </text>
  </g>
</svg>
