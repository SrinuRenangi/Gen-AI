<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="vid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#vid-bg)" />

  <!-- Header -->
  <text x="480" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    VIDEO DIFFUSION &amp; SPATIO-TEMPORAL ATTENTION (SORA / SVD)
  </text>
  <text x="480" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">
    Decomposing (T &times; H &times; W) Video Volumes via Decoupled Spatial and Temporal Attention Mechanisms
  </text>

  <!-- Main Comparison Grid -->
  <g transform="translate(40, 85)" filter="url(#card-shadow)">

    <!-- UPPER ROW: 3D Video Frame Sequence Breakdown -->
    <g transform="translate(0, 0)">
      <rect width="880" height="220" rx="12" fill="#1e293b" stroke="#334155" />

      <!-- Time Axis Line -->
      <path d="M 50 42 L 830 42" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)" />
      <text x="440" y="32" font-family="sans-serif" font-size="11" font-weight="800" fill="#fcd34d" text-anchor="middle">
        TIME DIMENSION (T FRAMES) &rarr; MOTION &amp; LATENT PHYSICS
      </text>

      <!-- 4 Cascading Video Frames -->
      <!-- Frame 1 -->
      <g transform="translate(45, 60)">
        <rect width="170" height="135" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
        <text x="85" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Frame t = 1</text>
        <circle cx="55" cy="75" r="14" fill="#f43f5e" />
        <text x="55" y="80" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">Ball</text>
        <line x1="20" y1="115" x2="150" y2="115" stroke="#475569" stroke-width="2" />
        <text x="85" y="130" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Initial Position (x₁, y₁)</text>
      </g>

      <!-- Frame 2 -->
      <g transform="translate(255, 60)">
        <rect width="170" height="135" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
        <text x="85" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Frame t = 2</text>
        <circle cx="75" cy="60" r="14" fill="#f43f5e" />
        <text x="75" y="65" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">Ball</text>
        <line x1="20" y1="115" x2="150" y2="115" stroke="#475569" stroke-width="2" />
        <text x="85" y="130" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Rising Trajectory (x₂, y₂)</text>
      </g>

      <!-- Frame 3 -->
      <g transform="translate(465, 60)">
        <rect width="170" height="135" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
        <text x="85" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Frame t = 3</text>
        <circle cx="105" cy="50" r="14" fill="#f43f5e" />
        <text x="105" y="55" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">Ball</text>
        <line x1="20" y1="115" x2="150" y2="115" stroke="#475569" stroke-width="2" />
        <text x="85" y="130" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Peak Arc (x₃, y₃)</text>
      </g>

      <!-- Frame 4 -->
      <g transform="translate(675, 60)">
        <rect width="170" height="135" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
        <text x="85" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Frame t = 4</text>
        <circle cx="130" cy="70" r="14" fill="#f43f5e" />
        <text x="130" y="75" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">Ball</text>
        <line x1="20" y1="115" x2="150" y2="115" stroke="#475569" stroke-width="2" />
        <text x="85" y="130" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Descent Phase (x₄, y₄)</text>
      </g>

    </g>

    <!-- LOWER ROW: Decoupled Spatial vs Temporal Attention Blocks -->
    <g transform="translate(0, 235)">

      <!-- Spatial Attention Block (Left) -->
      <g transform="translate(0, 0)">
        <rect width="425" height="200" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.8" />
        <rect x="0" y="0" width="425" height="30" rx="10" fill="#1d4ed8" />
        <text x="212" y="20" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">
          1. 2D SPATIAL ATTENTION (INSIDE EACH FRAME)
        </text>

        <text x="20" y="55" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#93c5fd">
          Operation: Reshape tensor to (B &times; T, H &times; W, C)
        </text>
        <text x="20" y="78" font-family="sans-serif" font-size="10" fill="#cbd5e1">
          • Computes standard self-attention across the (H, W) pixels of each frame.
        </text>
        <text x="20" y="96" font-family="sans-serif" font-size="10" fill="#cbd5e1">
          • Learns static visual fidelity: lighting, shadows, surface textures, shapes.
        </text>
        <text x="20" y="114" font-family="sans-serif" font-size="10" fill="#cbd5e1">
          • Identical to 2D image diffusion models (Stable Diffusion / Midjourney).
        </text>

        <rect x="20" y="132" width="385" height="52" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="35" y="152" font-family="monospace" font-size="9" fill="#38bdf8">
          Q, K, V ∈ ℝ^{(H·W) &times; d}  per frame
        </text>
        <text x="35" y="170" font-family="sans-serif" font-size="9" fill="#94a3b8">
          Ensures high visual crispness within individual frames.
        </text>
      </g>

      <!-- Temporal Attention Block (Right) -->
      <g transform="translate(455, 0)">
        <rect width="425" height="200" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" />
        <rect x="0" y="0" width="425" height="30" rx="10" fill="#b45309" />
        <text x="212" y="20" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">
          2. 1D TEMPORAL ATTENTION (ACROSS TIME FRAMES)
        </text>

        <text x="20" y="55" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#fde68a">
          Operation: Permute and reshape to (B &times; H &times; W, T, C)
        </text>
        <text x="20" y="78" font-family="sans-serif" font-size="10" fill="#cbd5e1">
          • Fixes a spatial pixel coordinate (x, y) and attends across all T frames!
        </text>
        <text x="20" y="96" font-family="sans-serif" font-size="10" fill="#cbd5e1">
          • Learns speed, trajectory, fluid flow, camera panning, and gravity.
        </text>
        <text x="20" y="114" font-family="sans-serif" font-size="10" fill="#cbd5e1">
          • ELIMINATES TEMPORAL FLICKER: guarantees continuous object permanence.
        </text>

        <rect x="20" y="132" width="385" height="52" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="35" y="152" font-family="monospace" font-size="9" fill="#fcd34d">
          Q, K, V ∈ ℝ^{T &times; d}  per spatial location
        </text>
        <text x="35" y="170" font-family="sans-serif" font-size="9" fill="#94a3b8">
          The mathematical secret behind OpenAI Sora and Runway Gen-3.
        </text>
      </g>

    </g>

  </g>
</svg>
