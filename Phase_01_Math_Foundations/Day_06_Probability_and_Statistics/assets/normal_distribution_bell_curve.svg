<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="curveGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="curveGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="curveGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="450" y="44" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">
    THE NORMAL DISTRIBUTION (BELL CURVE) IN AI
  </text>
  <text x="450" y="70" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Why neural networks initialize billions of weights using random numbers from a Bell Curve
  </text>

  <!-- Ground Line (X-Axis) -->
  <line x1="80" y1="360" x2="820" y2="360" stroke="#475569" stroke-width="2"/>
  
  <!-- Bell Curve Shaded Areas -->
  <!-- 3 Sigma Area -->
  <path d="M 170 360 C 230 355, 270 340, 320 300 L 320 360 Z" fill="url(#curveGrad3)"/>
  <path d="M 580 300 C 630 340, 670 355, 730 360 L 580 360 Z" fill="url(#curveGrad3)"/>

  <!-- 2 Sigma Area -->
  <path d="M 320 300 C 350 270, 380 200, 410 140 L 410 360 L 320 360 Z" fill="url(#curveGrad2)"/>
  <path d="M 490 140 C 520 200, 550 270, 580 300 L 580 360 L 490 360 Z" fill="url(#curveGrad2)"/>

  <!-- 1 Sigma Center Area -->
  <path d="M 410 140 C 425 110, 435 95, 450 95 C 465 95, 475 110, 490 140 L 490 360 L 410 360 Z" fill="url(#curveGrad1)"/>

  <!-- Full Outline Curve -->
  <path d="M 80 360 C 180 360, 240 350, 320 300 C 370 260, 400 130, 450 95 C 500 130, 530 260, 580 300 C 660 350, 720 360, 820 360" 
        stroke="#38bdf8" stroke-width="3.5" fill="none"/>

  <!-- Mean Center Line -->
  <line x1="450" y1="95" x2="450" y2="360" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="450" cy="95" r="5" fill="#f59e0b"/>

  <!-- Sigma Markings along X Axis -->
  <!-- -3s -->
  <line x1="170" y1="355" x2="170" y2="365" stroke="#94a3b8" stroke-width="2"/>
  <text x="170" y="385" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">-3σ</text>

  <!-- -2s -->
  <line x1="320" y1="355" x2="320" y2="365" stroke="#94a3b8" stroke-width="2"/>
  <text x="320" y="385" font-family="monospace" font-size="12" fill="#60a5fa" text-anchor="middle">-2σ</text>

  <!-- -1s -->
  <line x1="410" y1="355" x2="410" y2="365" stroke="#94a3b8" stroke-width="2"/>
  <text x="410" y="385" font-family="monospace" font-size="12" fill="#34d399" text-anchor="middle">-1σ</text>

  <!-- Mean (0) -->
  <line x1="450" y1="355" x2="450" y2="365" stroke="#f59e0b" stroke-width="3"/>
  <text x="450" y="388" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle">μ (Mean = 0)</text>

  <!-- +1s -->
  <line x1="490" y1="355" x2="490" y2="365" stroke="#94a3b8" stroke-width="2"/>
  <text x="490" y="385" font-family="monospace" font-size="12" fill="#34d399" text-anchor="middle">+1σ</text>

  <!-- +2s -->
  <line x1="580" y1="355" x2="580" y2="365" stroke="#94a3b8" stroke-width="2"/>
  <text x="580" y="385" font-family="monospace" font-size="12" fill="#60a5fa" text-anchor="middle">+2σ</text>

  <!-- +3s -->
  <line x1="730" y1="355" x2="730" y2="365" stroke="#94a3b8" stroke-width="2"/>
  <text x="730" y="385" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">+3σ</text>

  <!-- Annotations / Callouts -->
  <!-- 68.2% Callout -->
  <rect x="390" y="210" width="120" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="450" y="233" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle">68.2% of Data</text>

  <!-- 95.4% Callout -->
  <text x="580" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">95.4% within ±2σ</text>

  <!-- Weight Initialization Box -->
  <g transform="translate(100, 415)">
    <rect width="700" height="45" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="350" y="27" font-family="monospace" font-size="12" fill="#fef3c7" text-anchor="middle">
      PyTorch Weight Init: torch.randn(size) * 0.02  |  Centers weights near 0 with safe variance!
    </text>
  </g>
</svg>
