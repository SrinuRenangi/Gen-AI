<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="940" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="470" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">
    GRADIENT DESCENT: THE MARBLE ROLLING DOWNHILL
  </text>
  <text x="470" y="68" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Simulating gravity pulling a marble along the path of steepest downhill slope (-∇Loss) to reach 0 error
  </text>

  <!-- 3D Contour Error Bowl -->
  <ellipse cx="470" cy="270" rx="360" ry="140" fill="none" stroke="#334155" stroke-width="2"/>
  <ellipse cx="470" cy="280" rx="280" ry="105" fill="none" stroke="#475569" stroke-width="2"/>
  <ellipse cx="470" cy="290" rx="190" ry="70" fill="none" stroke="#0284c7" stroke-width="2"/>
  <ellipse cx="470" cy="300" rx="100" ry="38" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  <ellipse cx="470" cy="305" rx="30" ry="12" fill="#10b981" stroke="#34d399" stroke-width="2"/>

  <!-- Center Target Marker -->
  <circle cx="470" cy="305" r="5" fill="#ffffff"/>
  <text x="470" y="340" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">
    GLOBAL MINIMUM (Error = 0) 🎯
  </text>

  <!-- Descent Trajectory Path -->
  <path d="M 220 180 Q 280 240 330 260 T 400 290 T 450 302 T 470 305" 
        stroke="#f59e0b" stroke-width="4" fill="none" stroke-dasharray="6,4"/>

  <!-- Step 0: Starting Position -->
  <circle cx="220" cy="180" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <text x="220" y="185" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">0</text>
  
  <rect x="70" y="140" width="130" height="50" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="135" y="160" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">START: Step 0</text>
  <text x="135" y="177" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Error = 34.0</text>

  <!-- Step 5 -->
  <circle cx="330" cy="260" r="10" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="330" y="240" font-family="sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Step 5</text>

  <!-- Step 15 -->
  <circle cx="400" cy="290" r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Step 30 -->
  <circle cx="450" cy="302" r="7" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Final Reached -->
  <circle cx="470" cy="305" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2"/>

  <!-- Formula Callout (Right Box) -->
  <g transform="translate(620, 110)">
    <rect width="280" height="170" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">
      THE CORE UPDATE RULE
    </text>
    
    <rect x="15" y="48" width="250" height="46" rx="6" fill="#0f172a"/>
    <text x="140" y="76" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle">
      W_new = W_old - α ∇Loss
    </text>

    <text x="30" y="115" font-family="sans-serif" font-size="11" fill="#cbd5e1">• W = Current model weights</text>
    <text x="30" y="133" font-family="sans-serif" font-size="11" fill="#cbd5e1">• α = Learning rate (step size)</text>
    <text x="30" y="151" font-family="sans-serif" font-size="11" fill="#cbd5e1">• ∇Loss = Gradient (steepest slope)</text>
  </g>

  <!-- Bottom Summary Banner -->
  <g transform="translate(80, 420)">
    <rect width="780" height="40" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="390" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7" text-anchor="middle">
      Every step moves in the exact direction of negative gradient (-∇), steadily shrinking error to zero!
    </text>
  </g>
</svg>
