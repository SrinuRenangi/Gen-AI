<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="500" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="230" y="20" width="490" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    📈 Linear Regression vs. Logistic Regression (The Sigmoid S-Curve)
  </text>

  <!-- Subtitle -->
  <text x="475" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    Why straight lines fail for classification, and how the Sigmoid squashes predictions into [0.0, 1.0]
  </text>

  <!-- Left Container: Linear Regression Failing on Binary Data -->
  <g transform="translate(60, 110)">
    <rect width="390" height="320" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="360" height="32" rx="6" fill="#991b1b" fill-opacity="0.2"/>
    <text x="195" y="36" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      ❌ Linear Line: Can Predict &lt; 0 or &gt; 1!
    </text>

    <!-- Mini plot axes -->
    <line x1="40" y1="210" x2="350" y2="210" stroke="#64748b" stroke-width="1.5"/>
    <line x1="40" y1="210" x2="40" y2="60" stroke="#64748b" stroke-width="1.5"/>

    <!-- Labels 0 and 1 on Y axis -->
    <text x="25" y="213" fill="#94a3b8" font-family="monospace" font-size="11">0</text>
    <text x="25" y="83" fill="#94a3b8" font-family="monospace" font-size="11">1</text>
    <line x1="35" y1="80" x2="350" y2="80" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Binary dots (y=0 on left, y=1 on right) -->
    <circle cx="70" cy="210" r="5" fill="#38bdf8"/>
    <circle cx="100" cy="210" r="5" fill="#38bdf8"/>
    <circle cx="130" cy="210" r="5" fill="#38bdf8"/>

    <circle cx="260" cy="80" r="5" fill="#34d399"/>
    <circle cx="290" cy="80" r="5" fill="#34d399"/>
    <circle cx="320" cy="80" r="5" fill="#34d399"/>

    <!-- Straight line shooting past 1 and below 0 -->
    <line x1="40" y1="250" x2="350" y2="40" stroke="#ef4444" stroke-width="2.5"/>

    <!-- Highlighted Bad Regions -->
    <rect x="290" y="35" width="70" height="24" rx="4" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1"/>
    <text x="325" y="51" fill="#fca5a5" font-family="monospace" font-size="10" text-anchor="middle">ŷ = 1.4? ❌</text>

    <rect x="45" y="235" width="75" height="24" rx="4" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1"/>
    <text x="82" y="251" fill="#fca5a5" font-family="monospace" font-size="10" text-anchor="middle">ŷ = -0.3? ❌</text>

    <!-- Commentary -->
    <text x="25" y="278" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Probabilities CANNOT be negative or > 1.0</text>
    <text x="25" y="298" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Outliers tilt the line and destroy predictions</text>
  </g>

  <!-- Right Container: Logistic Regression with Sigmoid S-Curve -->
  <g transform="translate(500, 110)">
    <rect width="390" height="320" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="360" height="32" rx="6" fill="#065f46" fill-opacity="0.2"/>
    <text x="195" y="36" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      ✅ Logistic S-Curve: Always Between 0.0 &amp; 1.0!
    </text>

    <!-- Mini plot axes -->
    <line x1="40" y1="210" x2="350" y2="210" stroke="#64748b" stroke-width="1.5"/>
    <line x1="40" y1="210" x2="40" y2="60" stroke="#64748b" stroke-width="1.5"/>

    <!-- Labels 0 and 1 on Y axis -->
    <text x="25" y="213" fill="#94a3b8" font-family="monospace" font-size="11">0</text>
    <text x="25" y="83" fill="#94a3b8" font-family="monospace" font-size="11">1</text>
    <line x1="35" y1="80" x2="350" y2="80" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Threshold line at 0.5 -->
    <line x1="40" y1="145" x2="350" y2="145" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="15" y="148" fill="#fbbf24" font-family="monospace" font-size="10">0.5</text>

    <!-- Binary dots -->
    <circle cx="70" cy="210" r="5" fill="#38bdf8"/>
    <circle cx="100" cy="210" r="5" fill="#38bdf8"/>
    <circle cx="130" cy="210" r="5" fill="#38bdf8"/>

    <circle cx="260" cy="80" r="5" fill="#34d399"/>
    <circle cx="290" cy="80" r="5" fill="#34d399"/>
    <circle cx="320" cy="80" r="5" fill="#34d399"/>

    <!-- The Sigmoid S-Curve: Starts near 208, curves up smoothly through (195, 145), levels off near 82 -->
    <path d="M 40 208 C 140 208, 160 190, 195 145 C 230 100, 250 82, 350 82" 
          fill="none" stroke="#10b981" stroke-width="3.5"/>

    <!-- Formula badge -->
    <rect x="130" y="90" width="130" height="28" rx="6" fill="#0b1329" stroke="#10b981" stroke-width="1"/>
    <text x="195" y="109" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">
      σ(z) = 1 / (1 + e⁻ᶻ)
    </text>

    <!-- Commentary -->
    <text x="25" y="255" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">✅ Always outputs a valid probability: 0% to 100%</text>
    <text x="25" y="275" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• Decision rule: If Probability &gt;= 0.5 → Class 1</text>
    <text x="25" y="295" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">• If Probability &lt; 0.5 → Class 0</text>
  </g>

  <!-- Bottom Tip Banner -->
  <rect x="60" y="445" width="830" height="35" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <text x="475" y="468" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">
    💡 <tspan fill="#38bdf8" font-weight="600">The Secret:</tspan> Despite the word "Regression" in its name, Logistic Regression is used 100% for CLASSIFICATION!
  </text>
</svg>
