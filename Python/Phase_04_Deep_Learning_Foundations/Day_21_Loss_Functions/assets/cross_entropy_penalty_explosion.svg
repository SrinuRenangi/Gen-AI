<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="curve-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg-grad)" />

  <!-- Title Banner -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    CROSS-ENTROPY LOSS &amp; THE CONFIDENTLY WRONG PENALTY
  </text>
  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Why LLMs and Classifiers Use Logarithmic Loss to Severely Punish Arrogant Errors
  </text>

  <!-- Left Main Coordinate Plot -->
  <g transform="translate(60, 100)" filter="url(#shadow)">
    <rect width="520" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- Origin at (90, 320), Top at y=50, Right at x=470 -->
    <!-- Grid axes -->
    <line x1="90" y1="320" x2="480" y2="320" stroke="#64748b" stroke-width="2" />
    <line x1="90" y1="50" x2="90" y2="330" stroke="#64748b" stroke-width="2" />

    <!-- Grid dashes -->
    <line x1="90" y1="260" x2="480" y2="260" stroke="#334155" stroke-dasharray="2,2" />
    <line x1="90" y1="200" x2="480" y2="200" stroke="#334155" stroke-dasharray="2,2" />
    <line x1="90" y1="140" x2="480" y2="140" stroke="#334155" stroke-dasharray="2,2" />
    <line x1="90" y1="80" x2="480" y2="80" stroke="#334155" stroke-dasharray="2,2" />

    <line x1="185" y1="50" x2="185" y2="320" stroke="#334155" stroke-dasharray="2,2" />
    <line x1="280" y1="50" x2="280" y2="320" stroke="#334155" stroke-dasharray="2,2" />
    <line x1="375" y1="50" x2="375" y2="320" stroke="#334155" stroke-dasharray="2,2" />
    <line x1="470" y1="50" x2="470" y2="320" stroke="#334155" stroke-dasharray="2,2" />

    <!-- Ticks & Labels -->
    <text x="90" y="340" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0.0</text>
    <text x="185" y="340" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0.25</text>
    <text x="280" y="340" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0.50</text>
    <text x="375" y="340" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">0.75</text>
    <text x="470" y="340" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">1.00</text>

    <!-- Y-axis labels -->
    <text x="80" y="324" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="end">0.0</text>
    <text x="80" y="264" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="end">1.0</text>
    <text x="80" y="204" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="end">2.0</text>
    <text x="80" y="144" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="end">3.0</text>
    <text x="80" y="84" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="end">4.0</text>

    <text x="280" y="365" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Predicted Probability ŷ (When True Target y = 1) &rarr;</text>
    <text x="80" y="45" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="end">Loss L = -log(ŷ) &uarr;</text>

    <!-- The Steep Logarithmic Loss Curve: L = -ln(y_hat) -->
    <!-- y_hat=1.0 -> y=320, y_hat=0.5 -> y=278, y_hat=0.25 -> y=237, y_hat=0.1 -> y=182, y_hat=0.01 -> y=60 -->
    <path d="M 100 55 C 105 150, 150 250, 280 278 C 360 295, 420 315, 470 320" fill="none" stroke="url(#curve-grad)" stroke-width="3.5" />

    <!-- Highlight Points -->
    <!-- Point 1: ŷ = 0.99 (Confidently Right) -->
    <circle cx="465" cy="318" r="6" fill="#10b981" />
    <text x="465" y="300" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">Near Zero Loss</text>
    <text x="465" y="312" font-family="monospace" font-size="9" fill="#a7f3d0" text-anchor="middle">L &approx; 0.01</text>

    <!-- Point 2: ŷ = 0.50 (Uncertain) -->
    <circle cx="280" cy="278" r="6" fill="#f59e0b" />
    <text x="280" y="255" font-family="sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">Uncertain Guess</text>
    <text x="280" y="268" font-family="monospace" font-size="9" fill="#fde68a" text-anchor="middle">L = 0.693</text>

    <!-- Point 3: ŷ = 0.02 (Confidently Wrong!) -->
    <circle cx="105" cy="85" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <text x="120" y="80" font-family="sans-serif" font-size="11" font-weight="800" fill="#f87171">ASTRONOMICAL PENALTY!</text>
    <text x="120" y="96" font-family="monospace" font-size="10" fill="#fca5a5">Loss explodes toward &infin;</text>
  </g>

  <!-- Right Side Cards -->
  <g transform="translate(610, 100)">

    <!-- Card 1: BCE Formula -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="290" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="0" y="0" width="290" height="24" rx="8" fill="#0284c7" />
      <text x="145" y="17" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">BINARY CROSS-ENTROPY (BCE)</text>
      
      <text x="14" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">-[y&middot;log(ŷ) + (1-y)&middot;log(1-ŷ)]</text>
      <text x="14" y="66" font-family="sans-serif" font-size="11" fill="#cbd5e1">• If y=1: Second term vanishes &rarr; <tspan fill="#38bdf8">-log(ŷ)</tspan></text>
      <text x="14" y="86" font-family="sans-serif" font-size="11" fill="#cbd5e1">• If y=0: First term vanishes &rarr; <tspan fill="#38bdf8">-log(1-ŷ)</tspan></text>
      <text x="14" y="106" font-family="sans-serif" font-size="10" font-weight="600" fill="#34d399">Standard for binary classification!</text>
    </g>

    <!-- Card 2: Categorical Cross-Entropy (LLM Core) -->
    <g transform="translate(0, 135)" filter="url(#shadow)">
      <rect width="290" height="135" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
      <rect x="0" y="0" width="290" height="24" rx="8" fill="#be185d" />
      <text x="145" y="17" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">CATEGORICAL CE (THE LLM LOSS)</text>
      
      <text x="14" y="44" font-family="monospace" font-size="12" font-weight="700" fill="#f472b6">L = - &Sigma; yₖ &middot; log(ŷₖ)</text>
      <text x="14" y="66" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Since only one token is correct,</text>
      <text x="14" y="84" font-family="monospace" font-size="11" fill="#f472b6">  L = -log(P(correct_token))</text>
      <text x="14" y="104" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Used to train <tspan fill="#f472b6" font-weight="700">ChatGPT, Claude &amp; LLaMA</tspan></text>
      <text x="14" y="122" font-family="sans-serif" font-size="10" font-weight="700" fill="#fbbf24">Next-token prediction engine!</text>
    </g>

    <!-- Card 3: Physical Intuition -->
    <g transform="translate(0, 285)" filter="url(#shadow)">
      <rect width="290" height="95" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="14" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#fbbf24">💡 Information Theory Intuition:</text>
      <text x="14" y="44" font-family="sans-serif" font-size="11" fill="#cbd5e1">Cross-entropy measures <tspan fill="#f8fafc" font-weight="700">surprise</tspan>.</text>
      <text x="14" y="62" font-family="sans-serif" font-size="11" fill="#cbd5e1">If the sun rises, surprise = 0.</text>
      <text x="14" y="80" font-family="sans-serif" font-size="11" fill="#cbd5e1">If pigs fly, surprise = &infin; (Massive update!)</text>
    </g>
  </g>

  <!-- Bottom Callout Footer -->
  <rect x="40" y="500" width="880" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="526" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    <tspan fill="#f472b6" font-weight="700">The Power of Logarithms: </tspan> By using <tspan fill="#f1f5f9" font-family="monospace">-log(ŷ)</tspan>, the loss approaches infinity as error approaches 100%. The optimizer is forced to rectify fatal misconceptions instantly.
  </text>
</svg>
