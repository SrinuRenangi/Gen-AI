<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bg-grad)" />

  <!-- Header -->
  <text x="480" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    WORD2VEC: CBOW VS SKIP-GRAM ARCHITECTURES
  </text>
  <text x="480" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Learning Dense Latent Word Vectors from Distributional Context (Mikolov et al., 2013)
  </text>

  <!-- Left: CBOW (Continuous Bag of Words) -->
  <g transform="translate(60, 90)" filter="url(#shadow)">
    <rect width="410" height="420" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect x="0" y="0" width="410" height="34" rx="12" fill="#1d4ed8" />
    <text x="205" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      1. CBOW (Continuous Bag of Words)
    </text>
    <text x="205" y="52" font-family="sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">
      Predict TARGET word from surrounding CONTEXT words
    </text>

    <!-- Context inputs (left) -->
    <g transform="translate(25, 75)">
      <rect width="90" height="30" rx="5" fill="#0f172a" stroke="#334155" />
      <text x="45" y="20" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">w(t-2)</text>

      <rect y="45" width="90" height="30" rx="5" fill="#0f172a" stroke="#334155" />
      <text x="45" y="65" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">w(t-1)</text>

      <rect y="90" width="90" height="30" rx="5" fill="#0f172a" stroke="#334155" />
      <text x="45" y="110" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">w(t+1)</text>

      <rect y="135" width="90" height="30" rx="5" fill="#0f172a" stroke="#334155" />
      <text x="45" y="155" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">w(t+2)</text>
    </g>

    <!-- Projection Layer (Middle) -->
    <g transform="translate(165, 100)">
      <line x1="-40" y1="-10" x2="-5" y2="35" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
      <line x1="-40" y1="35" x2="-5" y2="40" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
      <line x1="-40" y1="80" x2="-5" y2="45" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
      <line x1="-40" y1="125" x2="-5" y2="50" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

      <rect width="80" height="90" rx="8" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2" />
      <text x="40" y="36" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">AVERAGE</text>
      <text x="40" y="52" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">SUM</text>
      <text x="40" y="72" font-family="monospace" font-size="9" fill="#93c5fd" text-anchor="middle">d = 300</text>
    </g>

    <!-- Target Output (Right) -->
    <g transform="translate(295, 125)">
      <line x1="-45" y1="20" x2="-5" y2="20" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />
      <rect width="90" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <text x="45" y="18" font-family="monospace" font-size="11" font-weight="800" fill="#a7f3d0" text-anchor="middle">w(t)</text>
      <text x="45" y="32" font-family="sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">Target Word</text>
    </g>

    <!-- Summary footer -->
    <g transform="translate(20, 275)">
      <rect width="370" height="125" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#38bdf8">CBOW Characteristics:</text>
      <text x="15" y="48" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Input: Context window of 2C words</text>
      <text x="15" y="68" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Smooths over distributional context</text>
      <text x="15" y="88" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Faster training; excels on frequent words</text>
      <text x="15" y="108" font-family="sans-serif" font-size="10.5" fill="#94a3b8">• "The [cat] sat on the mat" → Predict "cat"</text>
    </g>
  </g>

  <!-- Right: Skip-Gram -->
  <g transform="translate(490, 90)" filter="url(#shadow)">
    <rect width="410" height="420" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="410" height="34" rx="12" fill="#047857" />
    <text x="205" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      2. SKIP-GRAM (Distributional Inversion) ⭐
    </text>
    <text x="205" y="52" font-family="sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">
      Predict CONTEXT words given a single TARGET word
    </text>

    <!-- Single Target Input (Left) -->
    <g transform="translate(25, 125)">
      <rect width="90" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <text x="45" y="18" font-family="monospace" font-size="11" font-weight="800" fill="#a7f3d0" text-anchor="middle">w(t)</text>
      <text x="45" y="32" font-family="sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">Target Word</text>
    </g>

    <!-- Projection Bottleneck (Middle) -->
    <g transform="translate(165, 100)">
      <line x1="-45" y1="45" x2="-5" y2="45" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)" />
      <rect width="80" height="90" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <text x="40" y="36" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">DENSE</text>
      <text x="40" y="52" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">VECTOR</text>
      <text x="40" y="72" font-family="monospace" font-size="9" fill="#a7f3d0" text-anchor="middle">d = 300</text>
    </g>

    <!-- Multiple Context Outputs (Right) -->
    <g transform="translate(295, 75)">
      <line x1="-45" y1="70" x2="-5" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
      <line x1="-45" y1="70" x2="-5" y2="60" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
      <line x1="-45" y1="70" x2="-5" y2="105" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
      <line x1="-45" y1="70" x2="-5" y2="150" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />

      <rect width="90" height="30" rx="5" fill="#0f172a" stroke="#334155" />
      <text x="45" y="20" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">w(t-2)</text>

      <rect y="45" width="90" height="30" rx="5" fill="#0f172a" stroke="#334155" />
      <text x="45" y="65" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">w(t-1)</text>

      <rect y="90" width="90" height="30" rx="5" fill="#0f172a" stroke="#334155" />
      <text x="45" y="110" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">w(t+1)</text>

      <rect y="135" width="90" height="30" rx="5" fill="#0f172a" stroke="#334155" />
      <text x="45" y="155" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">w(t+2)</text>
    </g>

    <!-- Summary footer -->
    <g transform="translate(20, 275)">
      <rect width="370" height="125" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#34d399">Skip-Gram Characteristics:</text>
      <text x="15" y="48" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Input: Single target word w(t)</text>
      <text x="15" y="68" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Forces vector to predict all context partners</text>
      <text x="15" y="88" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Learns superior representations for RARE words</text>
      <text x="15" y="108" font-family="sans-serif" font-size="10.5" fill="#6ee7b7">• Powers modern negative sampling embeddings</text>
    </g>
  </g>
</svg>
