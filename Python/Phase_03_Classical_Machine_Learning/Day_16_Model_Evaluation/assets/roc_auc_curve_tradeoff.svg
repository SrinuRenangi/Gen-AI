<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="auc-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg-grad)" />

  <!-- Title Banner -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    THE ROC CURVE &amp; AUC (AREA UNDER THE CURVE)
  </text>
  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Visualizing the Trade-off Between Catching Positives (TPR) and False Alarms (FPR) Across All Thresholds
  </text>

  <!-- Main Chart Area -->
  <!-- Chart Origin is at (140, 440). Width = 400, Height = 340. Top-Right is (540, 100) -->
  <g transform="translate(40, 20)">

    <!-- Grid lines -->
    <g stroke="#334155" stroke-width="1" stroke-dasharray="3,3">
      <!-- Horizontals -->
      <line x1="140" y1="355" x2="540" y2="355" />
      <line x1="140" y1="270" x2="540" y2="270" />
      <line x1="140" y1="185" x2="540" y2="185" />
      <line x1="140" y1="100" x2="540" y2="100" />
      <!-- Verticals -->
      <line x1="240" y1="440" x2="240" y2="100" />
      <line x1="340" y1="440" x2="340" y2="100" />
      <line x1="440" y1="440" x2="440" y2="100" />
      <line x1="540" y1="440" x2="540" y2="100" />
    </g>

    <!-- Shaded AUC for Good Model -->
    <!-- Curve path: (140,440) -> Q1 (180, 160) -> (300, 130) -> (540, 100) then down to (540,440) and back to (140,440) -->
    <path d="M 140 440 C 160 220, 240 130, 540 100 L 540 440 Z" fill="url(#auc-area)" />

    <!-- Axes -->
    <line x1="140" y1="440" x2="550" y2="440" stroke="#94a3b8" stroke-width="2.5" />
    <line x1="140" y1="440" x2="140" y2="90" stroke="#94a3b8" stroke-width="2.5" />

    <!-- Axis Ticks & Labels -->
    <!-- Y-axis (TPR) -->
    <text x="125" y="444" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">0.0</text>
    <text x="125" y="359" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">0.25</text>
    <text x="125" y="274" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">0.50</text>
    <text x="125" y="189" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="end">0.75</text>
    <text x="125" y="104" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="700" text-anchor="end">1.0</text>

    <!-- X-axis (FPR) -->
    <text x="140" y="462" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">0.0</text>
    <text x="240" y="462" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">0.25</text>
    <text x="340" y="462" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">0.50</text>
    <text x="440" y="462" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">0.75</text>
    <text x="540" y="462" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">1.0</text>

    <text x="340" y="492" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">
      False Positive Rate (FPR = 1 - Specificity) &rarr;
    </text>
    <text x="-270" y="90" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle" transform="rotate(-90)">
      True Positive Rate (TPR / Recall) &rarr;
    </text>

    <!-- Diagonal Line: Pure Chance (Coin Toss, AUC = 0.50) -->
    <line x1="140" y1="440" x2="540" y2="100" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>

    <!-- Perfect Classifier (AUC = 1.0) -->
    <path d="M 140 440 L 140 100 L 540 100" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>

    <!-- Good Classifier Curve (AUC = 0.91) -->
    <path d="M 140 440 C 160 220, 240 130, 540 100" fill="none" stroke="#38bdf8" stroke-width="3.5" filter="url(#glow)"/>

    <!-- Threshold points along the curve -->
    <!-- Point A: Conservative threshold (T = 0.8) -->
    <circle cx="170" cy="280" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <text x="185" y="276" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Threshold = 0.8</text>
    <text x="185" y="290" font-family="sans-serif" font-size="10" fill="#cbd5e1">Few false alarms, misses some sick</text>

    <!-- Point B: Balanced threshold (T = 0.5) -->
    <circle cx="230" cy="180" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <text x="245" y="176" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Threshold = 0.5 (Default)</text>
    <text x="245" y="190" font-family="sans-serif" font-size="10" fill="#cbd5e1">High Recall (0.82), Low FPR (0.22)</text>

    <!-- Point C: Aggressive threshold (T = 0.2) -->
    <circle cx="370" cy="125" r="6" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
    <text x="385" y="121" font-family="sans-serif" font-size="11" font-weight="700" fill="#f472b6">Threshold = 0.2</text>
    <text x="385" y="135" font-family="sans-serif" font-size="10" fill="#cbd5e1">Catches 96% sick, higher false alarms</text>

    <!-- Ideal Corner Star -->
    <g transform="translate(140, 100)">
      <circle cx="0" cy="0" r="8" fill="#10b981" />
      <text x="16" y="5" font-family="sans-serif" font-size="11" font-weight="800" fill="#10b981">IDEAL CORNER (0 FPR, 100% TPR)</text>
    </g>
  </g>

  <!-- Right Explanation & Benchmark Panel -->
  <g transform="translate(620, 100)">
    <rect width="300" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="150" y="32" font-family="sans-serif" font-size="15" font-weight="800" fill="#f8fafc" text-anchor="middle">
      UNDERSTANDING AUC SCORES
    </text>

    <!-- Card 1: 1.0 Perfect -->
    <g transform="translate(16, 50)">
      <rect width="268" height="58" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <circle cx="20" cy="29" r="7" fill="#10b981" />
      <text x="35" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#10b981">AUC = 1.0 (Perfect Classifier)</text>
      <text x="35" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8">Separates 100% of positives &amp; negatives</text>
    </g>

    <!-- Card 2: 0.8 - 0.9 Good -->
    <g transform="translate(16, 120)">
      <rect width="268" height="58" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="20" cy="29" r="7" fill="#38bdf8" />
      <text x="35" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#38bdf8">AUC = 0.85 – 0.95 (Excellent)</text>
      <text x="35" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8">Strong practical model in real-world ML</text>
    </g>

    <!-- Card 3: 0.50 Random -->
    <g transform="translate(16, 190)">
      <rect width="268" height="58" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
      <circle cx="20" cy="29" r="7" fill="#64748b" />
      <text x="35" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#94a3b8">AUC = 0.50 (Random Guess)</text>
      <text x="35" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8">Coin flip. The model learned zero signal.</text>
    </g>

    <!-- Card 4: &lt; 0.50 Inverted -->
    <g transform="translate(16, 260)">
      <rect width="268" height="58" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <circle cx="20" cy="29" r="7" fill="#ef4444" />
      <text x="35" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#f87171">AUC &lt; 0.50 (Worse than Guess)</text>
      <text x="35" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8">Predictions are literally backwards!</text>
    </g>

    <!-- Intuition note -->
    <g transform="translate(16, 330)">
      <text x="134" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">
        💡 AUC Physical Intuition:
      </text>
      <text x="134" y="32" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">
        Probability that a randomly chosen positive
      </text>
      <text x="134" y="46" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">
        scores higher than a randomly chosen negative.
      </text>
    </g>
  </g>
</svg>
