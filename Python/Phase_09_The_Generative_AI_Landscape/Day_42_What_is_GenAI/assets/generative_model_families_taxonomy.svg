<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="tax-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="tax-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#tax-bg)" />

  <!-- Title -->
  <text x="480" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    THE 4 FOUNDATIONAL FAMILIES OF GENERATIVE AI
  </text>
  <text x="480" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Architectural Mechanics, Mathematical Objectives, Trade-Offs, and Dominant Modalities
  </text>

  <!-- 4 Column Grid -->
  <g transform="translate(30, 80)" filter="url(#tax-shadow)">

    <!-- 1. AUTOREGRESSIVE MODELS -->
    <g transform="translate(0, 0)">
      <rect width="210" height="450" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
      <rect x="0" y="0" width="210" height="34" rx="10" fill="#0284c7" />
      <text x="105" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
        1. AUTOREGRESSIVE
      </text>

      <g transform="translate(12, 48)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="800" fill="#38bdf8">CORE FORMULATION:</text>
        <rect x="0" y="20" width="186" height="42" rx="4" fill="#0f172a" stroke="#0284c7" />
        <text x="93" y="38" font-family="monospace" font-size="9" font-weight="700" fill="#7dd3fc" text-anchor="middle">P(X) = ∏ P(x_i | x_&lt;i)</text>
        <text x="93" y="52" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Chain Rule of Probability</text>

        <text x="0" y="82" font-family="sans-serif" font-size="10" font-weight="800" fill="#f8fafc">How It Works:</text>
        <text x="0" y="98" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Predicts one token/pixel</text>
        <text x="0" y="112" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">  at a time from left to right</text>
        <text x="0" y="126" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Feeds previous predictions</text>
        <text x="0" y="140" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">  back in as new context</text>

        <rect x="0" y="160" width="186" height="85" rx="6" fill="#064e3b" />
        <text x="8" y="180" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#6ee7b7">✓ SUPERPOWERS:</text>
        <text x="8" y="198" font-family="sans-serif" font-size="9" fill="#d1fae5">• Exact log-likelihood</text>
        <text x="8" y="214" font-family="sans-serif" font-size="9" fill="#d1fae5">• Unrivaled logical reasoning</text>
        <text x="8" y="230" font-family="sans-serif" font-size="9" fill="#d1fae5">• Universal for text and code</text>

        <rect x="0" y="255" width="186" height="75" rx="6" fill="#450a0a" />
        <text x="8" y="275" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#fca5a5">✗ DRAWBACKS:</text>
        <text x="8" y="293" font-family="sans-serif" font-size="9" fill="#fee2e2">• Slow sequential O(N) sampling</text>
        <text x="8" y="309" font-family="sans-serif" font-size="9" fill="#fee2e2">• High KV-cache memory usage</text>

        <g transform="translate(0, 345)">
          <text x="0" y="12" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#93c5fd">ICONIC EXAMPLES:</text>
          <text x="0" y="28" font-family="sans-serif" font-size="9" fill="#cbd5e1">GPT-4, Claude 3.5, Llama 3,</text>
          <text x="0" y="42" font-family="sans-serif" font-size="9" fill="#cbd5e1">Mistral, MusicLM, Suno</text>
        </g>
      </g>
    </g>

    <!-- 2. GANS -->
    <g transform="translate(230, 0)">
      <rect width="210" height="450" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.8" />
      <rect x="0" y="0" width="210" height="34" rx="10" fill="#e11d48" />
      <text x="105" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
        2. GANs (ADVERSARIAL)
      </text>

      <g transform="translate(12, 48)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="800" fill="#fb7185">CORE FORMULATION:</text>
        <rect x="0" y="20" width="186" height="42" rx="4" fill="#0f172a" stroke="#e11d48" />
        <text x="93" y="38" font-family="monospace" font-size="8" font-weight="700" fill="#fda4af" text-anchor="middle">min_G max_D V(D, G)</text>
        <text x="93" y="52" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Two-Player Zero-Sum Game</text>

        <text x="0" y="82" font-family="sans-serif" font-size="10" font-weight="800" fill="#f8fafc">How It Works:</text>
        <text x="0" y="98" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Generator (forger) creates</text>
        <text x="0" y="112" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">  fakes from random noise</text>
        <text x="0" y="126" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Discriminator (detective)</text>
        <text x="0" y="140" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">  spots real vs fake</text>

        <rect x="0" y="160" width="186" height="85" rx="6" fill="#064e3b" />
        <text x="8" y="180" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#6ee7b7">✓ SUPERPOWERS:</text>
        <text x="8" y="198" font-family="sans-serif" font-size="9" fill="#d1fae5">• Blazing fast (1 forward pass)</text>
        <text x="8" y="214" font-family="sans-serif" font-size="9" fill="#d1fae5">• Razor-sharp high frequencies</text>
        <text x="8" y="230" font-family="sans-serif" font-size="9" fill="#d1fae5">• No multi-step sampling</text>

        <rect x="0" y="255" width="186" height="75" rx="6" fill="#450a0a" />
        <text x="8" y="275" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#fca5a5">✗ DRAWBACKS:</text>
        <text x="8" y="293" font-family="sans-serif" font-size="9" fill="#fee2e2">• Mode Collapse (drops diversity)</text>
        <text x="8" y="309" font-family="sans-serif" font-size="9" fill="#fee2e2">• Infamously unstable training</text>

        <g transform="translate(0, 345)">
          <text x="0" y="12" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#fca5a5">ICONIC EXAMPLES:</text>
          <text x="0" y="28" font-family="sans-serif" font-size="9" fill="#cbd5e1">StyleGAN 2/3, CycleGAN,</text>
          <text x="0" y="42" font-family="sans-serif" font-size="9" fill="#cbd5e1">Pix2Pix, BigGAN</text>
        </g>
      </g>
    </g>

    <!-- 3. VAES -->
    <g transform="translate(460, 0)">
      <rect width="210" height="450" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.8" />
      <rect x="0" y="0" width="210" height="34" rx="10" fill="#059669" />
      <text x="105" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
        3. VAEs (VARIATIONAL)
      </text>

      <g transform="translate(12, 48)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="800" fill="#34d399">CORE FORMULATION:</text>
        <rect x="0" y="20" width="186" height="42" rx="4" fill="#0f172a" stroke="#059669" />
        <text x="93" y="38" font-family="monospace" font-size="8" font-weight="700" fill="#a7f3d0" text-anchor="middle">max ELBO = E[log p] - KL</text>
        <text x="93" y="52" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Evidence Lower Bound</text>

        <text x="0" y="82" font-family="sans-serif" font-size="10" font-weight="800" fill="#f8fafc">How It Works:</text>
        <text x="0" y="98" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Encodes image into μ and σ</text>
        <text x="0" y="112" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">  of continuous Gaussian latent</text>
        <text x="0" y="126" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Reparameterization trick</text>
        <text x="0" y="140" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">  allows backpropagation</text>

        <rect x="0" y="160" width="186" height="85" rx="6" fill="#064e3b" />
        <text x="8" y="180" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#6ee7b7">✓ SUPERPOWERS:</text>
        <text x="8" y="198" font-family="sans-serif" font-size="9" fill="#d1fae5">• Smooth, interpolatable latent</text>
        <text x="8" y="214" font-family="sans-serif" font-size="9" fill="#d1fae5">• Mathematically principled</text>
        <text x="8" y="230" font-family="sans-serif" font-size="9" fill="#d1fae5">• Powers Latent Diffusion!</text>

        <rect x="0" y="255" width="186" height="75" rx="6" fill="#450a0a" />
        <text x="8" y="275" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#fca5a5">✗ DRAWBACKS:</text>
        <text x="8" y="293" font-family="sans-serif" font-size="9" fill="#fee2e2">• Blurry samples (MSE loss averages</text>
        <text x="8" y="309" font-family="sans-serif" font-size="9" fill="#fee2e2">  possible pixel distributions)</text>

        <g transform="translate(0, 345)">
          <text x="0" y="12" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#6ee7b7">ICONIC EXAMPLES:</text>
          <text x="0" y="28" font-family="sans-serif" font-size="9" fill="#cbd5e1">Original Kingma VAE, VQ-VAE,</text>
          <text x="0" y="42" font-family="sans-serif" font-size="9" fill="#cbd5e1">Stable Diffusion VAE Encoder</text>
        </g>
      </g>
    </g>

    <!-- 4. DIFFUSION -->
    <g transform="translate(690, 0)">
      <rect width="210" height="450" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.8" />
      <rect x="0" y="0" width="210" height="34" rx="10" fill="#7e22ce" />
      <text x="105" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
        4. DIFFUSION MODELS
      </text>

      <g transform="translate(12, 48)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="800" fill="#c084fc">CORE FORMULATION:</text>
        <rect x="0" y="20" width="186" height="42" rx="4" fill="#0f172a" stroke="#7e22ce" />
        <text x="93" y="38" font-family="monospace" font-size="8" font-weight="700" fill="#e9d5ff" text-anchor="middle">min ||ε - ε_θ(x_t, t)||^2</text>
        <text x="93" y="52" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Iterative Score Matching</text>

        <text x="0" y="82" font-family="sans-serif" font-size="10" font-weight="800" fill="#f8fafc">How It Works:</text>
        <text x="0" y="98" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Forward: destroys data into</text>
        <text x="0" y="112" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">  pure Gaussian noise via Markov</text>
        <text x="0" y="126" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">• Reverse: neural net removes</text>
        <text x="0" y="140" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">  noise step-by-step</text>

        <rect x="0" y="160" width="186" height="85" rx="6" fill="#064e3b" />
        <text x="8" y="180" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#6ee7b7">✓ SUPERPOWERS:</text>
        <text x="8" y="198" font-family="sans-serif" font-size="9" fill="#d1fae5">• Unrivaled visual photorealism</text>
        <text x="8" y="214" font-family="sans-serif" font-size="9" fill="#d1fae5">• Rock-solid training stability</text>
        <text x="8" y="230" font-family="sans-serif" font-size="9" fill="#d1fae5">• Extreme diversity (no mode drop)</text>

        <rect x="0" y="255" width="186" height="75" rx="6" fill="#450a0a" />
        <text x="8" y="275" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#fca5a5">✗ DRAWBACKS:</text>
        <text x="8" y="293" font-family="sans-serif" font-size="9" fill="#fee2e2">• Slow multi-step sampling (20-50</text>
        <text x="8" y="309" font-family="sans-serif" font-size="9" fill="#fee2e2">  steps, though solved by LCM/Flow)</text>

        <g transform="translate(0, 345)">
          <text x="0" y="12" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#d8b4fe">ICONIC EXAMPLES:</text>
          <text x="0" y="28" font-family="sans-serif" font-size="9" fill="#cbd5e1">Stable Diffusion, Midjourney, DALL-E 3,</text>
          <text x="0" y="42" font-family="sans-serif" font-size="9" fill="#cbd5e1">Flux, Sora, AudioLDM</text>
        </g>
      </g>
    </g>

  </g>
</svg>
