<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cache-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg-grad)" />

  <!-- Header -->
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    THE AUTOREGRESSIVE GENERATION LOOP &amp; KV CACHING
  </text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    How LLMs Generate Text One Token at a Time &amp; Why KV Caching Cuts Generation Latency by 90%
  </text>

  <!-- Left: Autoregressive Loop -->
  <g transform="translate(60, 90)" filter="url(#shadow)">
    <rect width="410" height="430" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="32" rx="12" fill="#1d4ed8" />
    <text x="205" y="21" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      1. THE NEXT-TOKEN AUTOREGRESSIVE LOOP
    </text>

    <!-- Context Window Input -->
    <g transform="translate(25, 50)">
      <rect width="360" height="40" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" font-family="sans-serif" font-size="10" font-weight="800" fill="#94a3b8">PROMPT CONTEXT:</text>
      <text x="135" y="25" font-family="monospace" font-size="11" font-weight="800" fill="#93c5fd">"The capital of France is"</text>
    </g>

    <!-- Transformer Decoder Stack -->
    <g transform="translate(25, 110)">
      <line x1="180" y1="-20" x2="180" y2="0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
      <rect width="360" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="180" y="28" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
        TRANSFORMER DECODER (e.g. 32 Layers)
      </text>
      <text x="180" y="48" font-family="monospace" font-size="10" fill="#93c5fd" text-anchor="middle">
        Self-Attention &rarr; FFN &rarr; Output Projection
      </text>
      <text x="180" y="68" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
        Computes logits over 128,000 vocabulary tokens
      </text>
    </g>

    <!-- Sampling Block -->
    <g transform="translate(25, 215)">
      <line x1="180" y1="-20" x2="180" y2="0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
      <rect width="360" height="80" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="180" y="24" font-family="sans-serif" font-size="11" font-weight="900" fill="#a7f3d0" text-anchor="middle">
        SAMPLING STRATEGY (Temperature, Top-p)
      </text>
      <text x="180" y="44" font-family="monospace" font-size="11" fill="#6ee7b7" text-anchor="middle">
        P("Paris") = 97.4% | P("Lyon") = 1.2%
      </text>
      <text x="180" y="64" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">
        Sampled New Token: " Paris" &check;
      </text>
    </g>

    <!-- Feedback Loop Arrow (Append & Repeat) -->
    <g transform="translate(25, 315)">
      <path d="M 180 -20 L 180 50 L 380 50 L 380 -245 L 360 -245" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow-blue)" />
      <rect width="360" height="50" rx="6" fill="#0f172a" stroke="#f59e0b" />
      <text x="180" y="22" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#fbbf24" text-anchor="middle">
        Append " Paris" &rarr; Repeat for Next Token!
      </text>
      <text x="180" y="38" font-family="sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">
        Stops only when emitting &lt;|end_of_text|&gt; or max tokens
      </text>
    </g>
  </g>

  <!-- Right: KV Caching Mechanism -->
  <g transform="translate(490, 90)" filter="url(#shadow)">
    <rect width="410" height="430" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="410" height="32" rx="12" fill="#047857" />
    <text x="205" y="21" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      2. THE KEY-VALUE (KV) CACHE BREAKTHROUGH ⭐
    </text>

    <!-- Without KV Cache (Bad) -->
    <g transform="translate(20, 50)">
      <rect width="370" height="95" rx="8" fill="#0f172a" stroke="#f43f5e" />
      <text x="15" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#fca5a5">Without KV Cache (Naive):</text>
      <text x="15" y="42" font-family="sans-serif" font-size="10" fill="#fecdd3">
        To generate token #1,000, the GPU must re-compute
      </text>
      <text x="15" y="58" font-family="sans-serif" font-size="10" fill="#fecdd3">
        Keys and Values for all 999 previous tokens!
      </text>
      <text x="15" y="80" font-family="monospace" font-size="10" font-weight="900" fill="#ef4444">
        Compute cost: O(N²) &mdash; Unacceptably slow!
      </text>
    </g>

    <!-- With KV Cache (Saved) -->
    <g transform="translate(20, 160)">
      <rect width="370" height="135" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="15" y="22" font-family="sans-serif" font-size="11" font-weight="900" fill="#a7f3d0">With KV Cache (Production LLM Standard):</text>
      <text x="15" y="42" font-family="sans-serif" font-size="10" fill="#cbd5e1">
        • Keys &amp; Values of past tokens are cached in VRAM
      </text>
      <text x="15" y="58" font-family="sans-serif" font-size="10" fill="#cbd5e1">
        • When generating token t, compute Q, K, V ONLY for token t!
      </text>
      <text x="15" y="74" font-family="sans-serif" font-size="10" fill="#34d399">
        • Append k_t and v_t to the cache table
      </text>
      <rect x="15" y="88" width="340" height="34" rx="6" fill="#064e3b" />
      <text x="185" y="109" font-family="monospace" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">
        Per-token decode cost slashed to O(N)!
      </text>
    </g>

    <!-- Memory Footprint Formula Box -->
    <g transform="translate(20, 310)">
      <rect width="370" height="100" rx="8" fill="#020617" stroke="#334155" />
      <text x="15" y="22" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#fbbf24">
        KV CACHE VRAM FOOTPRINT EQUATION:
      </text>
      <text x="15" y="44" font-family="monospace" font-size="10" fill="#67e8f9">
        Bytes = 2 &times; 2 &times; n_layers &times; n_heads &times; d_k &times; seq_len
      </text>
      <text x="15" y="64" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">
        For LLaMA-70B with 4,096 context length:
      </text>
      <text x="15" y="82" font-family="sans-serif" font-size="10" font-weight="800" fill="#f43f5e">
        KV Cache alone consumes &approx; 20 GB of GPU VRAM per user!
      </text>
    </g>
  </g>
</svg>
