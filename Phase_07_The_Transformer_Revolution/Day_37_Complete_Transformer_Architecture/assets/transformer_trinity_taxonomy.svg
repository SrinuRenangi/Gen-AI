<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bg-grad)" />

  <!-- Header -->
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    THE TRANSFORMER TRINITY TAXONOMY
  </text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    How One Architecture Split into Three Empires: Encoder-Only, Decoder-Only, and Encoder-Decoder
  </text>

  <!-- 3 Columns -->
  <g transform="translate(60, 90)" filter="url(#shadow)">

    <!-- Column 1: Encoder-Only (BERT) -->
    <g transform="translate(0, 0)">
      <rect width="265" height="415" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
      <rect x="0" y="0" width="265" height="34" rx="12" fill="#1d4ed8" />
      <text x="132" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
        1. ENCODER-ONLY
      </text>

      <!-- Subtitle -->
      <text x="132" y="55" font-family="monospace" font-size="11" font-weight="800" fill="#93c5fd" text-anchor="middle">
        BERT, RoBERTa, DeBERTa
      </text>

      <!-- Mask Visual -->
      <g transform="translate(15, 70)">
        <rect width="235" height="75" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="12" y="22" font-family="sans-serif" font-size="10" font-weight="800" fill="#94a3b8">ATTENTION MASK:</text>
        <text x="12" y="42" font-family="monospace" font-size="11" fill="#38bdf8">FULL BIDIRECTIONAL</text>
        <text x="12" y="60" font-family="sans-serif" font-size="10" fill="#cbd5e1">Every token sees past &amp; future</text>
      </g>

      <!-- Pre-training Task -->
      <g transform="translate(15, 160)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc">Pre-training Objective:</text>
        <text x="0" y="32" font-family="monospace" font-size="10.5" fill="#93c5fd">Masked LM (MLM)</text>
        <text x="0" y="48" font-family="sans-serif" font-size="10" fill="#94a3b8">"The [MASK] sat on mat" &rarr; cat</text>

        <text x="0" y="76" font-family="sans-serif" font-size="11" font-weight="800" fill="#38bdf8">Best Use Cases:</text>
        <text x="0" y="94" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Text Classification (Spam/Sentiment)</text>
        <text x="0" y="112" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Named Entity Recognition (NER)</text>
        <text x="0" y="130" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Search &amp; RAG Dense Embeddings</text>
        <text x="0" y="148" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Legal / Medical Contract Analysis</text>
      </g>

      <rect x="15" y="360" width="235" height="35" rx="6" fill="#172554" stroke="#3b82f6" />
      <text x="132" y="382" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#bfdbfe" text-anchor="middle">
        The Master of UNDERSTANDING
      </text>
    </g>

    <!-- Column 2: Decoder-Only (GPT / LLaMA) -->
    <g transform="translate(287, 0)">
      <rect width="265" height="415" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5" />
      <rect x="0" y="0" width="265" height="34" rx="12" fill="#047857" />
      <text x="132" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
        2. DECODER-ONLY ⭐
      </text>

      <!-- Subtitle -->
      <text x="132" y="55" font-family="monospace" font-size="11" font-weight="800" fill="#a7f3d0" text-anchor="middle">
        GPT-4, LLaMA-3, Mistral, Claude
      </text>

      <!-- Mask Visual -->
      <g transform="translate(15, 70)">
        <rect width="235" height="75" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
        <text x="12" y="22" font-family="sans-serif" font-size="10" font-weight="800" fill="#a7f3d0">ATTENTION MASK:</text>
        <text x="12" y="42" font-family="monospace" font-size="11" fill="#34d399">CAUSAL (LOWER TRIANGLE)</text>
        <text x="12" y="60" font-family="sans-serif" font-size="10" fill="#a7f3d0">Cannot look into future! (j &le; i)</text>
      </g>

      <!-- Pre-training Task -->
      <g transform="translate(15, 160)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc">Pre-training Objective:</text>
        <text x="0" y="32" font-family="monospace" font-size="10.5" fill="#34d399">Next-Token Prediction (Causal)</text>
        <text x="0" y="48" font-family="sans-serif" font-size="10" fill="#94a3b8">"The cat sat on" &rarr; predict "the"</text>

        <text x="0" y="76" font-family="sans-serif" font-size="11" font-weight="800" fill="#10b981">Why It Won Generative AI:</text>
        <text x="0" y="94" font-family="sans-serif" font-size="10.5" fill="#a7f3d0">• Unified Autoregressive Generation</text>
        <text x="0" y="112" font-family="sans-serif" font-size="10.5" fill="#a7f3d0">• In-Context Learning (Few-Shot Prompting)</text>
        <text x="0" y="130" font-family="sans-serif" font-size="10.5" fill="#a7f3d0">• Complex Multi-Step Reasoning &amp; Code</text>
        <text x="0" y="148" font-family="sans-serif" font-size="10.5" fill="#a7f3d0">• Standard architecture of all LLMs!</text>
      </g>

      <rect x="15" y="360" width="235" height="35" rx="6" fill="#064e3b" stroke="#10b981" />
      <text x="132" y="382" font-family="sans-serif" font-size="10.5" font-weight="900" fill="#a7f3d0" text-anchor="middle">
        The Emperor of GENERATION
      </text>
    </g>

    <!-- Column 3: Encoder-Decoder (T5 / BART) -->
    <g transform="translate(575, 0)">
      <rect width="265" height="415" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
      <rect x="0" y="0" width="265" height="34" rx="12" fill="#7e22ce" />
      <text x="132" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
        3. ENCODER-DECODER
      </text>

      <!-- Subtitle -->
      <text x="132" y="55" font-family="monospace" font-size="11" font-weight="800" fill="#e9d5ff" text-anchor="middle">
        T5, BART, Original Vaswani
      </text>

      <!-- Mask Visual -->
      <g transform="translate(15, 70)">
        <rect width="235" height="75" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="12" y="22" font-family="sans-serif" font-size="10" font-weight="800" fill="#c084fc">ATTENTION MECHANISM:</text>
        <text x="12" y="42" font-family="monospace" font-size="11" fill="#e9d5ff">BIDIRECTIONAL + CROSS</text>
        <text x="12" y="60" font-family="sans-serif" font-size="10" fill="#cbd5e1">Encoder reads full; Decoder outputs</text>
      </g>

      <!-- Pre-training Task -->
      <g transform="translate(15, 160)">
        <text x="0" y="14" font-family="sans-serif" font-size="11" font-weight="800" fill="#f8fafc">Pre-training Objective:</text>
        <text x="0" y="32" font-family="monospace" font-size="10.5" fill="#c084fc">Sequence-to-Sequence Span Corruption</text>
        <text x="0" y="48" font-family="sans-serif" font-size="10" fill="#94a3b8">Source text &rarr; Target transformation</text>

        <text x="0" y="76" font-family="sans-serif" font-size="11" font-weight="800" fill="#a855f7">Best Use Cases:</text>
        <text x="0" y="94" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Language Translation (English &rarr; German)</text>
        <text x="0" y="112" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Abstractive Long-Doc Summarization</text>
        <text x="0" y="130" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Grammar Error Correction (Grammarly)</text>
        <text x="0" y="148" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">• Text-to-Speech (TTS) alignment</text>
      </g>

      <rect x="15" y="360" width="235" height="35" rx="6" fill="#3b0764" stroke="#a855f7" />
      <text x="132" y="382" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#f3e8ff" text-anchor="middle">
        The Master of TRANSFORMATION
      </text>
    </g>
  </g>
</svg>
