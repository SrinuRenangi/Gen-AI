<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bio-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="map-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bg-grad)" />

  <!-- Title Banner -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    FROM BIOLOGY TO MATHEMATICS: THE ARTIFICIAL NEURON
  </text>
  <text x="480" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    How Biological Brain Cells Inspired Frank Rosenblatt's 1958 Perceptron Architecture
  </text>

  <!-- LEFT PANEL: BIOLOGICAL NEURON -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="420" height="385" rx="12" fill="#1e293b" stroke="#0d9488" stroke-width="1.5" />
    <rect x="0" y="0" width="420" height="32" rx="12" fill="url(#bio-grad)" />
    <text x="210" y="21" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">
      🧠 BIOLOGICAL NEURON (Human Brain)
    </text>

    <!-- Dendrites -->
    <g stroke="#2dd4bf" stroke-width="2.5" fill="none">
      <path d="M 40 100 Q 80 120 120 160" />
      <path d="M 30 160 Q 75 165 120 170" />
      <path d="M 40 220 Q 80 200 120 180" />
      <path d="M 20 80 Q 40 100 50 110" />
      <path d="M 20 240 Q 40 220 50 210" />
    </g>
    <text x="35" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#2dd4bf">Dendrites</text>
    <text x="35" y="78" font-family="sans-serif" font-size="9" fill="#94a3b8">(Input receivers)</text>

    <!-- Cell Body (Soma) -->
    <circle cx="160" cy="170" r="42" fill="#115e59" stroke="#14b8a6" stroke-width="2" />
    <circle cx="160" cy="170" r="16" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="160" y="165" font-family="sans-serif" font-size="10" font-weight="800" fill="#ccfbf1" text-anchor="middle">SOMA</text>
    <text x="160" y="177" font-family="sans-serif" font-size="8" fill="#5eead4" text-anchor="middle">(Cell Body)</text>
    <text x="160" y="230" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Sums electrical charge</text>

    <!-- Axon & Myelin Sheaths -->
    <line x1="202" y1="170" x2="330" y2="170" stroke="#14b8a6" stroke-width="4" />
    <rect x="215" y="158" width="26" height="24" rx="4" fill="#0f766e" stroke="#2dd4bf" stroke-width="1" />
    <rect x="250" y="158" width="26" height="24" rx="4" fill="#0f766e" stroke="#2dd4bf" stroke-width="1" />
    <rect x="285" y="158" width="26" height="24" rx="4" fill="#0f766e" stroke="#2dd4bf" stroke-width="1" />
    <text x="260" y="148" font-family="sans-serif" font-size="10" font-weight="700" fill="#2dd4bf" text-anchor="middle">Axon Cable</text>

    <!-- Axon Terminals / Synapses -->
    <g stroke="#2dd4bf" stroke-width="2" fill="none">
      <path d="M 330 170 Q 360 140 390 120" />
      <path d="M 330 170 Q 370 170 395 170" />
      <path d="M 330 170 Q 360 200 390 220" />
      <circle cx="390" cy="120" r="4" fill="#14b8a6" />
      <circle cx="395" cy="170" r="4" fill="#14b8a6" />
      <circle cx="390" cy="220" r="4" fill="#14b8a6" />
    </g>
    <text x="365" y="95" font-family="sans-serif" font-size="11" font-weight="700" fill="#2dd4bf" text-anchor="middle">Synapses</text>
    <text x="365" y="108" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">(Outputs fired)</text>

    <!-- Biology Summary Box -->
    <rect x="18" y="265" width="384" height="100" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="30" y="290" font-family="sans-serif" font-size="11" font-weight="700" fill="#5eead4">Biological Mechanism:</text>
    <text x="30" y="310" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Signals arrive via neurotransmitters at dendrites.</text>
    <text x="30" y="328" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Soma accumulates voltage. If threshold (~ -55mV) is</text>
    <text x="30" y="346" font-family="sans-serif" font-size="11" fill="#cbd5e1">  reached, an "Action Potential" fires down the axon (All-or-Nothing).</text>
  </g>

  <!-- RIGHT PANEL: ARTIFICIAL NEURON (PERCEPTRON) -->
  <g transform="translate(500, 95)" filter="url(#shadow)">
    <rect width="420" height="385" rx="12" fill="#1e293b" stroke="#2563eb" stroke-width="1.5" />
    <rect x="0" y="0" width="420" height="32" rx="12" fill="url(#ai-grad)" />
    <text x="210" y="21" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">
      🤖 ARTIFICIAL NEURON (The Perceptron)
    </text>

    <!-- Inputs x1, x2, x3 -->
    <circle cx="45" cy="100" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="45" y="104" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">x₁</text>

    <circle cx="45" cy="170" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="45" y="174" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">x₂</text>

    <circle cx="45" cy="240" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="45" y="244" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">xₙ</text>

    <!-- Bias input -->
    <circle cx="160" cy="70" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="160" y="74" font-family="monospace" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle">+b</text>
    <line x1="160" y1="84" x2="160" y2="128" stroke="#f59e0b" stroke-width="2" marker-end="url(#map-arrow)" />

    <!-- Synaptic Weight Connections -->
    <line x1="61" y1="100" x2="135" y2="155" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
    <text x="85" y="118" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">w₁</text>

    <line x1="61" y1="170" x2="130" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
    <text x="85" y="164" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">w₂</text>

    <line x1="61" y1="240" x2="135" y2="185" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
    <text x="85" y="226" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">wₙ</text>

    <!-- Summation Node (Soma equivalent) -->
    <circle cx="160" cy="170" r="32" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2" />
    <text x="160" y="166" font-family="sans-serif" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="middle">&Sigma;</text>
    <text x="160" y="182" font-family="monospace" font-size="8" fill="#93c5fd" text-anchor="middle">w·x + b</text>

    <!-- Connector to Activation -->
    <line x1="192" y1="170" x2="235" y2="170" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)" />
    <text x="212" y="162" font-family="monospace" font-size="10" fill="#93c5fd" text-anchor="middle">z</text>

    <!-- Activation Function Node (Threshold) -->
    <rect x="245" y="140" width="60" height="60" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <!-- Step function icon -->
    <path d="M 255 180 L 275 180 L 275 155 L 295 155" stroke="#a5b4fc" stroke-width="2.5" fill="none" />
    <text x="275" y="194" font-family="sans-serif" font-size="9" font-weight="700" fill="#c7d2fe" text-anchor="middle">&sigma;(z)</text>

    <!-- Output Arrow -->
    <line x1="305" y1="170" x2="365" y2="170" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)" />
    <circle cx="380" cy="170" r="16" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="380" y="174" font-family="monospace" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle">y</text>
    <text x="380" y="202" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">{0, 1}</text>

    <!-- Math Summary Box -->
    <rect x="18" y="265" width="384" height="100" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="30" y="290" font-family="sans-serif" font-size="11" font-weight="700" fill="#60a5fa">Mathematical Formula:</text>
    <text x="30" y="312" font-family="monospace" font-size="12" fill="#f8fafc">1. z = &Sigma;(wᵢ &middot; xᵢ) + b = wᵀx + b</text>
    <text x="30" y="334" font-family="monospace" font-size="12" fill="#34d399">2. y = 1 if z &ge; 0 else 0  (Step Function)</text>
    <text x="30" y="352" font-family="sans-serif" font-size="10" fill="#94a3b8">Weights (w) = Synaptic strengths, Bias (b) = Excitation threshold</text>
  </g>

  <!-- Bottom Mapping Equivalence Banner -->
  <rect x="40" y="495" width="880" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="516" font-family="sans-serif" font-size="11" font-weight="700" fill="#f1f5f9" text-anchor="middle">
    EXACT 1-to-1 EQUIVALENCES:
  </text>
  <text x="480" y="534" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    Dendrites &harr; <tspan fill="#38bdf8" font-weight="600">Inputs (x)</tspan> &nbsp;|&nbsp; 
    Synaptic Strength &harr; <tspan fill="#38bdf8" font-weight="600">Weights (w)</tspan> &nbsp;|&nbsp; 
    Soma Accumulator &harr; <tspan fill="#60a5fa" font-weight="600">Weighted Sum (&Sigma;wx + b)</tspan> &nbsp;|&nbsp; 
    Action Potential &harr; <tspan fill="#34d399" font-weight="600">Activation Function &sigma;(z)</tspan>
  </text>
</svg>
