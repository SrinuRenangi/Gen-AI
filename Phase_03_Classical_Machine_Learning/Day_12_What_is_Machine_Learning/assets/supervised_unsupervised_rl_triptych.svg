<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="500" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Badge -->
  <rect x="230" y="20" width="490" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="475" y="47" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    🧭 The 3 Main Types of Machine Learning
  </text>

  <!-- Subtitle -->
  <text x="475" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    Supervised (With Teacher) • Unsupervised (Self-Discovery) • Reinforcement (Rewards &amp; Penalties)
  </text>

  <!-- Three Columns Layout -->
  <!-- Column 1: Supervised Learning -->
  <g transform="translate(50, 110)">
    <rect width="265" height="320" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="235" height="32" rx="6" fill="#1d4ed8" fill-opacity="0.2"/>
    <text x="132" y="36" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      1. Supervised Learning
    </text>

    <!-- Visual Icon Box -->
    <rect x="25" y="60" width="215" height="75" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
    <text x="55" y="95" font-size="24">🐱</text>
    <text x="95" y="92" fill="#e2e8f0" font-family="monospace" font-size="11">Input: Photo</text>
    <text x="95" y="110" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">Label: "Cat" ✅</text>

    <text x="25" y="160" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
      🔑 Core Concept:
    </text>
    <text x="25" y="180" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      You provide both <tspan fill="#60a5fa">Features (X)</tspan> and the <tspan fill="#34d399">Answer Key (y)</tspan>.
    </text>

    <text x="25" y="215" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
      🎯 The Two Sub-Tasks:
    </text>
    <text x="25" y="235" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      • <tspan fill="#f59e0b" font-weight="600">Regression:</tspan> Predict a continuous number (House price, stock price).
    </text>
    <text x="25" y="260" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      • <tspan fill="#10b981" font-weight="600">Classification:</tspan> Predict a category (Spam/Not Spam, Disease diagnosis).
    </text>

    <rect x="20" y="280" width="225" height="26" rx="4" fill="#0f172a"/>
    <text x="132" y="297" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Used in 85% of commercial ML!</text>
  </g>

  <!-- Column 2: Unsupervised Learning -->
  <g transform="translate(342, 110)">
    <rect width="265" height="320" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="235" height="32" rx="6" fill="#065f46" fill-opacity="0.2"/>
    <text x="132" y="36" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      2. Unsupervised Learning
    </text>

    <!-- Visual Icon Box -->
    <rect x="25" y="60" width="215" height="75" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
    <text x="50" y="95" font-size="20">👥 👥 👥</text>
    <text x="132" y="118" fill="#fbbf24" font-family="monospace" font-size="10" text-anchor="middle">NO labels provided!</text>

    <text x="25" y="160" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
      🔑 Core Concept:
    </text>
    <text x="25" y="180" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      You give data with <tspan fill="#ef4444">NO answer keys</tspan>. The AI finds hidden patterns on its own.
    </text>

    <text x="25" y="215" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
      🎯 Primary Applications:
    </text>
    <text x="25" y="235" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      • <tspan fill="#34d399" font-weight="600">Clustering:</tspan> Customer segmentation (bargain hunters vs luxury buyers).
    </text>
    <text x="25" y="260" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      • <tspan fill="#38bdf8" font-weight="600">Dimensionality Reduction:</tspan> PCA, compressing 1536D vectors to 2D.
    </text>

    <rect x="20" y="280" width="225" height="26" rx="4" fill="#0f172a"/>
    <text x="132" y="297" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Self-discovery of clusters!</text>
  </g>

  <!-- Column 3: Reinforcement Learning -->
  <g transform="translate(635, 110)">
    <rect width="265" height="320" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="235" height="32" rx="6" fill="#b45309" fill-opacity="0.2"/>
    <text x="132" y="36" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      3. Reinforcement Learning
    </text>

    <!-- Visual Icon Box -->
    <rect x="25" y="60" width="215" height="75" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
    <text x="50" y="105" font-size="24">🤖 🎮</text>
    <text x="120" y="90" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">+10 Reward ⭐</text>
    <text x="120" y="110" fill="#ef4444" font-family="monospace" font-size="11" font-weight="700">-50 Penalty 💥</text>

    <text x="25" y="160" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
      🔑 Core Concept:
    </text>
    <text x="25" y="180" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      An <tspan fill="#fbbf24">Agent</tspan> takes actions in an <tspan fill="#38bdf8">Environment</tspan> to maximize a score.
    </text>

    <text x="25" y="215" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
      🎯 Famous Examples:
    </text>
    <text x="25" y="235" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      • AlphaGo (defusing world Go champion).
    </text>
    <text x="25" y="255" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      • Self-driving car steering policies.
    </text>
    <text x="25" y="272" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">
      • RLHF in ChatGPT (aligning LLM answers)!
    </text>

    <rect x="20" y="285" width="225" height="26" rx="4" fill="#0f172a"/>
    <text x="132" y="302" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Trial &amp; Error feedback loops!</text>
  </g>

  <!-- Bottom Global Summary Banner -->
  <rect x="50" y="445" width="850" height="35" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1"/>
  <text x="475" y="468" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">
    💡 <tspan fill="#38bdf8" font-weight="600">Our Focus in Phase 3:</tspan> We will master Supervised Learning (Regression &amp; Classification) — the engine that powers real-world data science!
  </text>
</svg>
