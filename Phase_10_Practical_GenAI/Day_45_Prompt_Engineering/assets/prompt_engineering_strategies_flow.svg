<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="pe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="pe-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#pe-bg)" />

  <!-- Header -->
  <text x="480" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    THE PROMPT ENGINEERING SPECTRUM: FROM ZERO-SHOT TO REACT
  </text>
  <text x="480" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">
    Activating Latent Capabilities, Structuring Context, and Enforcing Deterministic Reasoning Patterns
  </text>

  <!-- 4 Strategy Cards -->
  <g transform="translate(30, 80)" filter="url(#pe-shadow)">

    <!-- 1. ZERO-SHOT & FEW-SHOT -->
    <g transform="translate(0, 0)">
      <rect width="210" height="450" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8" />
      <rect x="0" y="0" width="210" height="34" rx="10" fill="#1d4ed8" />
      <text x="105" y="22" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">
        1. FEW-SHOT LEARNING
      </text>

      <g transform="translate(12, 45)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="800" fill="#93c5fd">MENTAL MODEL:</text>
        <text x="0" y="28" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">"Show, don't just tell."</text>
        <text x="0" y="44" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">Anchors target distribution</text>
        <text x="0" y="58" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">via in-context demos.</text>

        <!-- Prompt Preview Box -->
        <rect x="0" y="75" width="186" height="155" rx="6" fill="#0f172a" stroke="#1e40af" />
        <text x="8" y="93" font-family="monospace" font-size="8.5" fill="#93c5fd">Review: "Fast shipping!"</text>
        <text x="8" y="107" font-family="monospace" font-size="8.5" fill="#34d399">Sentiment: Positive</text>
        <text x="8" y="127" font-family="monospace" font-size="8.5" fill="#93c5fd">Review: "Broke day 1."</text>
        <text x="8" y="141" font-family="monospace" font-size="8.5" fill="#f87171">Sentiment: Negative</text>
        <text x="8" y="161" font-family="monospace" font-size="8.5" fill="#fcd34d">Review: "Fits well."</text>
        <text x="8" y="175" font-family="monospace" font-size="8.5" fill="#38bdf8">Sentiment: [PREDICT]</text>

        <rect x="0" y="245" width="186" height="85" rx="6" fill="#064e3b" />
        <text x="8" y="265" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#6ee7b7">KEY ADVANTAGES:</text>
        <text x="8" y="283" font-family="sans-serif" font-size="9" fill="#d1fae5">• Sets tone &amp; schema</text>
        <text x="8" y="299" font-family="sans-serif" font-size="9" fill="#d1fae5">• Enforces format rigidity</text>
        <text x="8" y="315" font-family="sans-serif" font-size="9" fill="#d1fae5">• Solves niche classifications</text>

        <rect x="0" y="340" width="186" height="85" rx="6" fill="#450a0a" />
        <text x="8" y="360" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#fca5a5">LIMITATIONS:</text>
        <text x="8" y="378" font-family="sans-serif" font-size="9" fill="#fee2e2">• Consumes context tokens</text>
        <text x="8" y="394" font-family="sans-serif" font-size="9" fill="#fee2e2">• Vulnerable to demo bias</text>
        <text x="8" y="410" font-family="sans-serif" font-size="9" fill="#fee2e2">• Cannot do complex math</text>
      </g>
    </g>

    <!-- 2. CHAIN-OF-THOUGHT (CoT) -->
    <g transform="translate(230, 0)">
      <rect width="210" height="450" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.8" />
      <rect x="0" y="0" width="210" height="34" rx="10" fill="#059669" />
      <text x="105" y="22" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">
        2. CHAIN-OF-THOUGHT (CoT)
      </text>

      <g transform="translate(12, 45)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="800" fill="#34d399">MENTAL MODEL:</text>
        <text x="0" y="28" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">"Think step-by-step."</text>
        <text x="0" y="44" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">Allocates test-time compute</text>
        <text x="0" y="58" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">as intermediate tokens.</text>

        <!-- Prompt Preview Box -->
        <rect x="0" y="75" width="186" height="155" rx="6" fill="#0f172a" stroke="#047857" />
        <text x="8" y="93" font-family="monospace" font-size="8.5" fill="#fcd34d">Q: 15 apples. Ate 4.</text>
        <text x="8" y="107" font-family="monospace" font-size="8.5" fill="#fcd34d">Bought 8. Total?</text>
        <text x="8" y="127" font-family="monospace" font-size="8" fill="#34d399">Thought: 15 - 4 = 11.</text>
        <text x="8" y="141" font-family="monospace" font-size="8" fill="#34d399">Then 11 + 8 = 19.</text>
        <text x="8" y="161" font-family="monospace" font-size="8.5" fill="#6ee7b7">Answer: 19 apples.</text>

        <rect x="0" y="245" width="186" height="85" rx="6" fill="#064e3b" />
        <text x="8" y="265" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#6ee7b7">KEY ADVANTAGES:</text>
        <text x="8" y="283" font-family="sans-serif" font-size="9" fill="#d1fae5">• Unlocks reasoning</text>
        <text x="8" y="299" font-family="sans-serif" font-size="9" fill="#d1fae5">• Solves multi-step logic</text>
        <text x="8" y="315" font-family="sans-serif" font-size="9" fill="#d1fae5">• Transparent audit trail</text>

        <rect x="0" y="340" width="186" height="85" rx="6" fill="#450a0a" />
        <text x="8" y="360" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#fca5a5">LIMITATIONS:</text>
        <text x="8" y="378" font-family="sans-serif" font-size="9" fill="#fee2e2">• Higher token latency &amp; cost</text>
        <text x="8" y="394" font-family="sans-serif" font-size="9" fill="#fee2e2">• Cannot backtrack if initial</text>
        <text x="8" y="410" font-family="sans-serif" font-size="9" fill="#fee2e2">  step has arithmetic error</text>
      </g>
    </g>

    <!-- 3. SELF-CONSISTENCY -->
    <g transform="translate(460, 0)">
      <rect width="210" height="450" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8" />
      <rect x="0" y="0" width="210" height="34" rx="10" fill="#b45309" />
      <text x="105" y="22" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">
        3. SELF-CONSISTENCY
      </text>

      <g transform="translate(12, 45)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="800" fill="#fde68a">MENTAL MODEL:</text>
        <text x="0" y="28" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">"Majority vote ensemble."</text>
        <text x="0" y="44" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">Samples k independent CoT</text>
        <text x="0" y="58" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">paths and votes on answer.</text>

        <!-- Prompt Preview Box -->
        <rect x="0" y="75" width="186" height="155" rx="6" fill="#0f172a" stroke="#92400e" />
        <text x="8" y="93" font-family="monospace" font-size="8" fill="#cbd5e1">Path 1 (T=0.7) &rarr; "19"</text>
        <text x="8" y="109" font-family="monospace" font-size="8" fill="#cbd5e1">Path 2 (T=0.7) &rarr; "23" ✗</text>
        <text x="8" y="125" font-family="monospace" font-size="8" fill="#cbd5e1">Path 3 (T=0.7) &rarr; "19"</text>
        <text x="8" y="141" font-family="monospace" font-size="8" fill="#cbd5e1">Path 4 (T=0.7) &rarr; "19"</text>
        <text x="8" y="161" font-family="sans-serif" font-size="9" font-weight="800" fill="#fcd34d">Majority Vote (3/4):</text>
        <text x="8" y="177" font-family="monospace" font-size="9.5" font-weight="700" fill="#34d399">FINAL ANSWER = 19</text>

        <rect x="0" y="245" width="186" height="85" rx="6" fill="#064e3b" />
        <text x="8" y="265" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#6ee7b7">KEY ADVANTAGES:</text>
        <text x="8" y="283" font-family="sans-serif" font-size="9" fill="#d1fae5">• +10-20% accuracy boost</text>
        <text x="8" y="299" font-family="sans-serif" font-size="9" fill="#d1fae5">• Cancels out random slips</text>
        <text x="8" y="315" font-family="sans-serif" font-size="9" fill="#d1fae5">• Highly robust for math</text>

        <rect x="0" y="340" width="186" height="85" rx="6" fill="#450a0a" />
        <text x="8" y="360" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#fca5a5">LIMITATIONS:</text>
        <text x="8" y="378" font-family="sans-serif" font-size="9" fill="#fee2e2">• k-times more API cost ($$)</text>
        <text x="8" y="394" font-family="sans-serif" font-size="9" fill="#fee2e2">• Slower overall throughput</text>
      </g>
    </g>

    <!-- 4. SYSTEM & JSON SCHEMA -->
    <g transform="translate(690, 0)">
      <rect width="210" height="450" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.8" />
      <rect x="0" y="0" width="210" height="34" rx="10" fill="#7e22ce" />
      <text x="105" y="22" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">
        4. STRUCTURED JSON
      </text>

      <g transform="translate(12, 45)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="800" fill="#d8b4fe">MENTAL MODEL:</text>
        <text x="0" y="28" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">"Deterministic API output."</text>
        <text x="0" y="44" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">Guarantees machine-parsable</text>
        <text x="0" y="58" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">JSON via grammar masks.</text>

        <!-- Prompt Preview Box -->
        <rect x="0" y="75" width="186" height="155" rx="6" fill="#0f172a" stroke="#6b21a8" />
        <text x="8" y="93" font-family="monospace" font-size="8" fill="#d8b4fe">{</text>
        <text x="16" y="109" font-family="monospace" font-size="8" fill="#38bdf8">"sentiment": "pos",</text>
        <text x="16" y="125" font-family="monospace" font-size="8" fill="#38bdf8">"confidence": 0.98,</text>
        <text x="16" y="141" font-family="monospace" font-size="8" fill="#38bdf8">"entities": [</text>
        <text x="24" y="157" font-family="monospace" font-size="8" fill="#cbd5e1">"Apple", "iPhone"</text>
        <text x="16" y="173" font-family="monospace" font-size="8" fill="#38bdf8">]</text>
        <text x="8" y="189" font-family="monospace" font-size="8" fill="#d8b4fe">}</text>

        <rect x="0" y="245" width="186" height="85" rx="6" fill="#064e3b" />
        <text x="8" y="265" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#6ee7b7">KEY ADVANTAGES:</text>
        <text x="8" y="283" font-family="sans-serif" font-size="9" fill="#d1fae5">• Zero JSONDecodeError</text>
        <text x="8" y="299" font-family="sans-serif" font-size="9" fill="#d1fae5">• Direct Pydantic validation</text>
        <text x="8" y="315" font-family="sans-serif" font-size="9" fill="#d1fae5">• Integrates into pipelines</text>

        <rect x="0" y="340" width="186" height="85" rx="6" fill="#450a0a" />
        <text x="8" y="360" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#fca5a5">LIMITATIONS:</text>
        <text x="8" y="378" font-family="sans-serif" font-size="9" fill="#fee2e2">• Grammar constraints can</text>
        <text x="8" y="394" font-family="sans-serif" font-size="9" fill="#fee2e2">  slightly lower creative</text>
        <text x="8" y="410" font-family="sans-serif" font-size="9" fill="#fee2e2">  reasoning depth</text>
      </g>
    </g>

  </g>
</svg>
