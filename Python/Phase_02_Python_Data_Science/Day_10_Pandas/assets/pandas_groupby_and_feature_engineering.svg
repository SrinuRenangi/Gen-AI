<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="560" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Header -->
  <text x="500" y="42" fill="#f8fafc" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" text-anchor="middle">
    PANDAS FOR AI &amp; ML: SPLIT-APPLY-COMBINE &amp; FEATURE PIPELINES
  </text>
  <text x="500" y="68" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    How raw tabular databases transform into clean, grouped, and encoded numerical tensors for models
  </text>

  <!-- ================= LEFT HALF: SPLIT-APPLY-COMBINE ================= -->
  <rect x="30" y="95" width="460" height="435" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="50" y="83" width="240" height="26" rx="6" fill="#0284c7"/>
  <text x="170" y="100" fill="#ffffff" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">
    1. SPLIT - APPLY - COMBINE
  </text>

  <!-- Stage 1: Raw DataFrame -->
  <rect x="50" y="125" width="130" height="130" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="125" width="130" height="26" rx="8" fill="#334155"/>
  <text x="115" y="142" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">Raw Data</text>
  <text x="65" y="170" fill="#38bdf8" font-family="monospace" font-size="10">Dept   | Salary</text>
  <text x="65" y="188" fill="#cbd5e1" font-family="monospace" font-size="10">AI     | 140k</text>
  <text x="65" y="206" fill="#fbbf24" font-family="monospace" font-size="10">Web    |  95k</text>
  <text x="65" y="224" fill="#cbd5e1" font-family="monospace" font-size="10">AI     | 160k</text>
  <text x="65" y="242" fill="#fbbf24" font-family="monospace" font-size="10">Web    | 105k</text>

  <!-- Arrow: Split -->
  <path d="M 185 190 L 225 155" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 185 190 L 225 225" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <text x="200" y="180" fill="#94a3b8" font-size="9" font-weight="700">SPLIT</text>

  <!-- Stage 2: Groups (Split) -->
  <rect x="235" y="130" width="105" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="287" y="148" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Group: 'AI'</text>
  <text x="245" y="166" fill="#e2e8f0" font-family="monospace" font-size="10">[140k, 160k]</text>

  <rect x="235" y="200" width="105" height="60" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="287" y="218" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">Group: 'Web'</text>
  <text x="245" y="236" fill="#e2e8f0" font-family="monospace" font-size="10">[95k, 105k]</text>

  <!-- Arrow: Apply -->
  <path d="M 345 160 L 375 185" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M 345 230 L 375 205" stroke="#34d399" stroke-width="2" fill="none"/>
  <text x="355" y="175" fill="#34d399" font-size="9" font-weight="700">APPLY</text>
  <text x="355" y="222" fill="#34d399" font-size="9" font-family="monospace">.mean()</text>

  <!-- Stage 3: Aggregated Result (Combine) -->
  <rect x="385" y="150" width="90" height="90" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <rect x="385" y="150" width="90" height="22" rx="8" fill="#059669"/>
  <text x="430" y="165" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">COMBINED</text>
  <text x="395" y="190" fill="#38bdf8" font-family="monospace" font-size="10">AI:  150k</text>
  <text x="395" y="215" fill="#fbbf24" font-family="monospace" font-size="10">Web: 100k</text>

  <!-- Bottom Code Banner in Split-Apply Box -->
  <rect x="50" y="280" width="420" height="75" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="65" y="302" fill="#38bdf8" font-family="monospace" font-size="11"># One-liner in Pandas:</text>
  <text x="65" y="322" fill="#f8fafc" font-family="monospace" font-size="11">df.groupby('Dept')['Salary'].mean()</text>
  <text x="65" y="342" fill="#94a3b8" font-family="monospace" font-size="10"># &rarr; Generates summary tensor inputs for training</text>

  <rect x="50" y="370" width="420" height="140" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="65" y="392" fill="#a78bfa" font-size="12" font-weight="700">💡 Why This Matters for Generative AI:</text>
  <text x="65" y="415" fill="#cbd5e1" font-size="11">• In RAG: Group reference documents by topic/source before vector chunking.</text>
  <text x="65" y="435" fill="#cbd5e1" font-size="11">• In Agent Memory: Aggregate conversation logs by user ID or session ID.</text>
  <text x="65" y="455" fill="#cbd5e1" font-size="11">• In Data Drift: Groupby monitors output distribution shifts across cohorts.</text>
  <text x="65" y="475" fill="#34d399" font-size="11">• Vectorized C-speed: Grouping 1,000,000 rows executes in milliseconds!</text>

  <!-- ================= RIGHT HALF: FEATURE ENGINEERING PIPELINE ================= -->
  <rect x="510" y="95" width="460" height="435" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="530" y="83" width="280" height="26" rx="6" fill="#7e22ce"/>
  <text x="670" y="100" fill="#ffffff" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">
    2. ML &amp; AI FEATURE ENGINEERING
  </text>

  <!-- Step 1: Raw Dirty Data -->
  <rect x="530" y="125" width="420" height="75" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="545" y="145" fill="#ef4444" font-size="11" font-weight="700">Step 1: Clean Missing Data (Imputation)</text>
  <text x="545" y="168" fill="#94a3b8" font-family="monospace" font-size="10">Age = [25, NaN, 31, 28] &rarr; df['Age'].fillna(df['Age'].median())</text>
  <text x="545" y="188" fill="#cbd5e1" font-size="10">Neural nets cannot compute matrix multiplications on NaN values!</text>

  <!-- Step 2: One-Hot Encoding -->
  <rect x="530" y="215" width="420" height="135" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="545" y="235" fill="#c084fc" font-size="11" font-weight="700">Step 2: One-Hot Encoding (Strings &rarr; Binary Vectors)</text>
  <text x="545" y="256" fill="#94a3b8" font-family="monospace" font-size="10">Categorical Strings: ['Delhi', 'Mumbai', 'Bangalore']</text>
  <text x="545" y="278" fill="#38bdf8" font-family="monospace" font-size="10">Delhi     &rarr; [ 1,  0,  0 ]</text>
  <text x="545" y="296" fill="#fbbf24" font-family="monospace" font-size="10">Mumbai    &rarr; [ 0,  1,  0 ]</text>
  <text x="545" y="314" fill="#34d399" font-family="monospace" font-size="10">Bangalore &rarr; [ 0,  0,  1 ]</text>
  <text x="545" y="336" fill="#cbd5e1" font-size="10">pd.get_dummies(df, columns=['City']) prepares data for weight multiplication.</text>

  <!-- Step 3: Export to PyTorch / Model -->
  <rect x="530" y="365" width="420" height="145" rx="8" fill="#090d16" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="545" y="388" fill="#34d399" font-size="12" font-weight="700">Step 3: Direct Bridge to PyTorch &amp; ML Models</text>
  <text x="545" y="412" fill="#f8fafc" font-family="monospace" font-size="11">X_tensor = torch.tensor(df.to_numpy(), dtype=torch.float32)</text>
  <text x="545" y="438" fill="#cbd5e1" font-size="11">Pandas structures raw databases into mathematically valid matrix tensors:</text>
  <text x="545" y="460" fill="#38bdf8" font-family="monospace" font-size="11">X in R^(N x D)  ---(@ W)---&gt;  Predictions y_hat in R^N</text>
  <text x="545" y="488" fill="#94a3b8" font-size="10">Without Pandas data wrangling, machine learning models cannot ingest real data.</text>
</svg>
