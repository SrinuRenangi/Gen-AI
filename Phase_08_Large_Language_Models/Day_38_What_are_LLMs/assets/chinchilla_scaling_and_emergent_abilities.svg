<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="curve-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bg-grad)" />

  <!-- Header -->
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    CHINCHILLA SCALING LAWS &amp; EMERGENT ABILITIES
  </text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    The Mathematical Formulas Dictating Compute, Parameters, and the Sudden Emergence of Intelligence
  </text>

  <!-- Left: Chinchilla Scaling Laws (DeepMind 2022) -->
  <g transform="translate(60, 90)" filter="url(#shadow)">
    <rect width="410" height="420" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="32" rx="12" fill="#1d4ed8" />
    <text x="205" y="21" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      1. CHINCHILLA SCALING (HOFFMANN ET AL., 2022)
    </text>

    <!-- Formula Box -->
    <g transform="translate(20, 50)">
      <rect width="370" height="75" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="185" y="26" font-family="monospace" font-size="13" font-weight="900" fill="#38bdf8" text-anchor="middle">
        Compute Budget: C &approx; 6 &times; N &times; D (FLOPs)
      </text>
      <text x="185" y="48" font-family="sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">
        N = Model Parameters | D = Training Tokens
      </text>
      <text x="185" y="65" font-family="monospace" font-size="10" font-weight="800" fill="#a7f3d0" text-anchor="middle">
        Optimal Ratio: D &approx; 20 &times; N
      </text>
    </g>

    <!-- Model Comparison Table / Chart -->
    <g transform="translate(20, 140)">
      <!-- Card A: GPT-3 (Undertrained) -->
      <rect width="370" height="65" rx="6" fill="#450a0a" stroke="#f43f5e" />
      <text x="15" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#fca5a5">GPT-3 (2020) &mdash; Severely Undertrained!</text>
      <text x="15" y="40" font-family="monospace" font-size="10.5" fill="#fecdd3">N = 175 Billion Params | D = 300 Billion Tokens</text>
      <text x="15" y="55" font-family="sans-serif" font-size="9.5" fill="#fda4af">Token-to-parameter ratio: 1.7:1 (Far below optimal 20:1!)</text>

      <!-- Card B: LLaMA (Compute Optimal) -->
      <g transform="translate(0, 75)">
        <rect width="370" height="75" rx="6" fill="#064e3b" stroke="#10b981" />
        <text x="15" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#a7f3d0">LLaMA-1 (2023) &mdash; Chinchilla Optimal! ⭐</text>
        <text x="15" y="40" font-family="monospace" font-size="10.5" fill="#6ee7b7">N = 65 Billion Params | D = 1.4 Trillion Tokens</text>
        <text x="15" y="55" font-family="sans-serif" font-size="9.5" fill="#d1fae5">Token-to-parameter ratio: 21.5:1 (Exact Chinchilla sweet spot)</text>
        <text x="15" y="68" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">Result: 65B model OUTPERFORMED 175B GPT-3!</text>
      </g>
    </g>

    <!-- Summary note -->
    <g transform="translate(20, 310)">
      <rect width="370" height="90" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#38bdf8">The Modern Pre-training Rule:</text>
      <text x="15" y="44" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">Do not build giant bloated models and starve them of data.</text>
      <text x="15" y="62" font-family="sans-serif" font-size="10.5" fill="#a7f3d0">Build smaller, lean models and train them on TRILLIONS of tokens!</text>
      <text x="15" y="78" font-family="sans-serif" font-size="10" fill="#94a3b8">(Cheaper inference, faster latency, superior accuracy).</text>
    </g>
  </g>

  <!-- Right: Emergent Abilities (Wei et al., 2022) -->
  <g transform="translate(490, 90)" filter="url(#shadow)">
    <rect width="410" height="420" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="410" height="32" rx="12" fill="#047857" />
    <text x="205" y="21" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
      2. EMERGENT ABILITIES AT SCALE (WEI ET AL., 2022)
    </text>

    <!-- Curve Graph of Emergence -->
    <g transform="translate(45, 60)">
      <!-- Axes -->
      <line x1="0" y1="180" x2="330" y2="180" stroke="#64748b" stroke-width="1.5" />
      <line x1="0" y1="180" x2="0" y2="20" stroke="#64748b" stroke-width="1.5" />
      <text x="320" y="198" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="end">Model Scale (Parameters)</text>
      <text x="10" y="25" font-family="sans-serif" font-size="10" fill="#94a3b8">Accuracy (%)</text>

      <!-- Parameter ticks -->
      <text x="50" y="195" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">1B</text>
      <text x="130" y="195" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">10B</text>
      <text x="210" y="195" font-family="sans-serif" font-size="9" fill="#fbbf24" font-weight="800" text-anchor="middle">~50B Threshold</text>
      <text x="290" y="195" font-family="sans-serif" font-size="9" fill="#10b981" font-weight="800" text-anchor="middle">175B+</text>

      <!-- Flat line then sharp upward hockey stick -->
      <path d="M 0 178 L 180 176 Q 220 170, 240 90 T 310 30" fill="none" stroke="url(#curve-grad)" stroke-width="3.5" />

      <!-- Emergent Phase Transition Annotation -->
      <line x1="210" y1="180" x2="210" y2="30" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" />
      <circle cx="240" cy="90" r="5" fill="#10b981" />
      <text x="250" y="85" font-family="sans-serif" font-size="10" font-weight="900" fill="#a7f3d0">
        Phase Transition!
      </text>
    </g>

    <!-- Capabilities List -->
    <g transform="translate(20, 275)">
      <rect width="370" height="125" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#a7f3d0">
        What Suddenly Appears Above the Threshold:
      </text>
      <text x="15" y="46" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">
        • Multi-Step Math Reasoning (Chain-of-Thought)
      </text>
      <text x="15" y="66" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">
        • In-Context Code Generation (Python, SQL, C++)
      </text>
      <text x="15" y="86" font-family="sans-serif" font-size="10.5" fill="#cbd5e1">
        • Unseen Language Translation &amp; Humor Explanation
      </text>
      <text x="15" y="106" font-family="sans-serif" font-size="10" fill="#67e8f9">
        Nobody explicitly programmed these skills &mdash; they EMERGED!
      </text>
    </g>
  </g>
</svg>
