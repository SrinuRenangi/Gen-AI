<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="vlm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="vlm-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="vlm-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="vlm-arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="vlm-arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#vlm-bg)" />

  <!-- Header -->
  <text x="480" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    MULTIMODAL VISION-LANGUAGE MODEL ARCHITECTURE (LLaVA / GPT-4V)
  </text>
  <text x="480" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">
    Bridging Vision and Language by Projecting Visual Patches into the LLM's Native Token Embedding Space
  </text>

  <!-- Main Pipeline Layout -->
  <g transform="translate(40, 85)" filter="url(#vlm-shadow)">

    <!-- 1. LEFT COLUMN: Visual Encoding Stream -->
    <g transform="translate(0, 0)">
      <rect width="250" height="430" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8" />
      <rect x="0" y="0" width="250" height="34" rx="12" fill="#1d4ed8" />
      <text x="125" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
        1. VISION ENCODER (ViT)
      </text>

      <!-- Raw Image Input -->
      <g transform="translate(20, 50)">
        <rect width="210" height="90" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="105" y="45" font-family="sans-serif" font-size="30" text-anchor="middle">🖼️ 🐕</text>
        <text x="105" y="75" font-family="monospace" font-size="10" fill="#93c5fd" text-anchor="middle">Input Image: 336&times;336&times;3</text>
      </g>

      <!-- Patch Splitting -->
      <g transform="translate(20, 155)">
        <text x="105" y="14" font-family="sans-serif" font-size="10" font-weight="700" fill="#cbd5e1" text-anchor="middle">
          Cut into 14&times;14 Pixel Patches
        </text>
        <text x="105" y="30" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">
          (336/14)&sup2; = 576 Visual Patches
        </text>
        <path d="M 105 38 L 105 52" stroke="#38bdf8" stroke-width="2" marker-end="url(#vlm-arrow-blue)" />
      </g>

      <!-- Pretrained ViT Backbone -->
      <g transform="translate(20, 220)">
        <rect width="210" height="90" rx="8" fill="#0f172a" stroke="#2563eb" />
        <text x="105" y="26" font-family="sans-serif" font-size="11" font-weight="800" fill="#93c5fd" text-anchor="middle">
          CLIP-ViT-L/14 (Frozen)
        </text>
        <text x="105" y="45" font-family="sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">24 Transformer Blocks</text>
        <text x="105" y="62" font-family="sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Spatial Self-Attention</text>
        <text x="105" y="78" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Outputs 576 &times; 1024-dim vectors</text>
      </g>

      <!-- Modality Projector MLP -->
      <g transform="translate(20, 325)">
        <rect width="210" height="85" rx="8" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
        <text x="105" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">
          MODALITY PROJECTOR (MLP)
        </text>
        <text x="105" y="44" font-family="sans-serif" font-size="9" fill="#e9d5ff" text-anchor="middle">Linear Layer: 1024 &rarr; 4096 dim</text>
        <text x="105" y="60" font-family="sans-serif" font-size="9" fill="#e9d5ff" text-anchor="middle">Aligns visual vectors to LLM space</text>
        <text x="105" y="76" font-family="monospace" font-size="9" font-weight="700" fill="#f5d0fe" text-anchor="middle">Z_v ∈ ℝ^{576 &times; 4096}</text>
      </g>
    </g>

    <!-- Connector Arrow from Projector to LLM Input -->
    <path d="M 255 370 L 305 370" stroke="#c084fc" stroke-width="3" marker-end="url(#vlm-arrow-purple)" />

    <!-- 2. CENTER-RIGHT: Unified LLM Processing Stream -->
    <g transform="translate(315, 0)">
      <rect width="565" height="430" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8" />
      <rect x="0" y="0" width="565" height="34" rx="12" fill="#065f46" />
      <text x="282" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
        2. AUTOREGRESSIVE LLM BACKBONE (LLaMA / VICUNA / GEMINI)
      </text>

      <!-- Unified Token Sequence Strip -->
      <g transform="translate(20, 50)">
        <rect width="525" height="75" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="15" y="22" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#f8fafc">
          THE UNIFIED INPUT SEQUENCE: INTERLEAVING SIGHT AND TEXT
        </text>

        <!-- Visual Tokens Box -->
        <rect x="15" y="32" width="220" height="32" rx="4" fill="#581c87" stroke="#a855f7" />
        <text x="125" y="52" font-family="monospace" font-size="9.5" font-weight="700" fill="#f3e8ff" text-anchor="middle">
          &lt;image&gt; [576 Visual Tokens] &lt;/image&gt;
        </text>

        <!-- Plus -->
        <text x="245" y="53" font-family="sans-serif" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle">+</text>

        <!-- Text Tokens Box -->
        <rect x="260" y="32" width="250" height="32" rx="4" fill="#0369a1" stroke="#38bdf8" />
        <text x="385" y="52" font-family="monospace" font-size="9" font-weight="700" fill="#e0f2fe" text-anchor="middle">
          "What breed is this dog?"
        </text>
      </g>

      <!-- LLM Processing Engine -->
      <g transform="translate(20, 140)">
        <rect width="525" height="175" rx="8" fill="#0f172a" stroke="#059669" />
        <text x="262" y="25" font-family="sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle">
          Decoder-Only Transformer Blocks (32 Layers)
        </text>
        <text x="262" y="45" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">
          Causal Self-Attention treats image tokens EXACTLY like normal words!
        </text>

        <rect x="30" y="60" width="465" height="95" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="45" y="82" font-family="sans-serif" font-size="10" font-weight="700" fill="#93c5fd">
          How Visual Reasoning Happens Inside Attention:
        </text>
        <text x="45" y="100" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">
          • The text token "breed" attends to visual tokens corresponding to the dog's ears and snout.
        </text>
        <text x="45" y="118" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">
          • Multimodal self-attention dynamically fuses physical geometry with linguistic knowledge.
        </text>
        <text x="45" y="136" font-family="sans-serif" font-size="9.5" fill="#cbd5e1">
          • No separate vision model needed for answering &mdash; the LLM handles all reasoning!
        </text>
      </g>

      <!-- Autoregressive Output -->
      <g transform="translate(20, 330)">
        <rect width="525" height="80" rx="8" fill="#064e3b" stroke="#10b981" />
        <text x="15" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#a7f3d0">
          GENERATED TEXT RESPONSE:
        </text>
        <text x="15" y="48" font-family="sans-serif" font-size="10.5" fill="#ffffff">
          &ldquo;Based on the distinctive golden coat, floppy ears, and friendly snout,&rdquo;
        </text>
        <text x="15" y="66" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#6ee7b7">
          &ldquo;this is a Golden Retriever.&rdquo;
        </text>
      </g>

    </g>

  </g>
</svg>
