<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="580" rx="16" fill="url(#bgGrad2)" stroke="#334155" stroke-width="2"/>

  <!-- Title Header -->
  <text x="500" y="42" fill="#f8fafc" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" text-anchor="middle">
    ESSENTIAL AI &amp; GENAI VISUALIZATIONS IN MATPLOTLIB
  </text>
  <text x="500" y="68" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    From training convergence curves to modern Transformer multi-head attention heatmaps
  </text>

  <!-- ================= CHART 1: LOSS CURVES (TOP LEFT) ================= -->
  <rect x="35" y="95" width="445" height="215" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="45" y="105" width="180" height="22" rx="4" fill="#1e293b"/>
  <text x="135" y="120" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. Training vs Val Loss Curve</text>
  
  <!-- Axes -->
  <line x1="80" y1="270" x2="440" y2="270" stroke="#64748b" stroke-width="1.5"/>
  <line x1="80" y1="145" x2="80" y2="270" stroke="#64748b" stroke-width="1.5"/>
  <text x="260" y="295" fill="#94a3b8" font-size="10" text-anchor="middle">Epochs (Training Steps)</text>
  <text x="65" y="145" fill="#94a3b8" font-size="10" text-anchor="end">Loss</text>

  <!-- Curves -->
  <!-- Training Loss (Smooth descending blue) -->
  <path d="M 85 160 Q 150 250, 430 255" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Validation Loss (Descends then diverges pink/red -> Overfitting!) -->
  <path d="M 85 170 Q 180 240, 260 230 T 430 190" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="5,3"/>

  <!-- Legend & Badges -->
  <rect x="290" y="138" width="135" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <line x1="300" y1="150" x2="320" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <text x="328" y="153" fill="#cbd5e1" font-size="9">Train Loss</text>
  <line x1="300" y1="168" x2="320" y2="168" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="328" y="171" fill="#f43f5e" font-size="9">Val Loss (Overfit!)</text>

  <!-- Overfitting Annotation -->
  <circle cx="260" cy="230" r="5" fill="#fbbf24"/>
  <text x="260" y="215" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">Best Model (Early Stop)</text>

  <!-- ================= CHART 2: RESIDUAL SCATTER PLOT (TOP RIGHT) ================= -->
  <rect x="520" y="95" width="445" height="215" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="530" y="105" width="190" height="22" rx="4" fill="#1e293b"/>
  <text x="625" y="120" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">2. Regression Predictions vs True</text>

  <!-- Axes -->
  <line x1="565" y1="270" x2="925" y2="270" stroke="#64748b" stroke-width="1.5"/>
  <line x1="565" y1="145" x2="565" y2="270" stroke="#64748b" stroke-width="1.5"/>
  <text x="745" y="295" fill="#94a3b8" font-size="10" text-anchor="middle">Actual Price ($y$)</text>
  <text x="550" y="145" fill="#94a3b8" font-size="10" text-anchor="end">Predicted ($\hat{y}$)</text>

  <!-- Perfect 45-degree line -->
  <line x1="575" y1="260" x2="915" y2="155" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="880" y="175" fill="#fbbf24" font-size="9">Perfect Fit (y = ŷ)</text>

  <!-- Scatter Points -->
  <circle cx="610" cy="245" r="4" fill="#38bdf8" opacity="0.85"/>
  <circle cx="650" cy="235" r="4" fill="#38bdf8" opacity="0.85"/>
  <circle cx="680" cy="220" r="4" fill="#38bdf8" opacity="0.85"/>
  <circle cx="710" cy="225" r="4" fill="#38bdf8" opacity="0.85"/>
  <circle cx="750" cy="205" r="4" fill="#38bdf8" opacity="0.85"/>
  <circle cx="790" cy="190" r="4" fill="#38bdf8" opacity="0.85"/>
  <circle cx="820" cy="180" r="4" fill="#38bdf8" opacity="0.85"/>
  <circle cx="860" cy="175" r="4" fill="#38bdf8" opacity="0.85"/>
  <circle cx="890" cy="162" r="4" fill="#38bdf8" opacity="0.85"/>
  <!-- Outlier -->
  <circle cx="730" cy="160" r="4" fill="#ef4444"/>
  <text x="730" y="150" fill="#ef4444" font-size="8" text-anchor="middle">Outlier</text>

  <!-- ================= CHART 3: TRANSFORMER ATTENTION HEATMAP (BOTTOM FULL SPAN) ================= -->
  <rect x="35" y="325" width="930" height="235" rx="10" fill="#0b1120" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="45" y="335" width="290" height="24" rx="4" fill="#7e22ce"/>
  <text x="190" y="351" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">
    3. TRANSFORMER SELF-ATTENTION MATRIX HEATMAP
  </text>
  <text x="350" y="351" fill="#c084fc" font-size="11" font-family="monospace">plt.imshow(attention_matrix, cmap='magma')</text>

  <!-- Tokens List: ["The", "animal", "didn't", "cross", "because", "it", "was", "tired"] -->
  <!-- Token Query labels (Y-axis) -->
  <text x="135" y="385" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="end">The</text>
  <text x="135" y="410" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="end">robot</text>
  <text x="135" y="435" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="end">didn't</text>
  <text x="135" y="460" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="end">cross</text>
  <text x="135" y="485" fill="#38bdf8" font-weight="bold" font-size="10" font-family="monospace" text-anchor="end">&rarr; it</text>
  <text x="135" y="510" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="end">was</text>
  <text x="135" y="535" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="end">tired</text>

  <!-- Token Key labels (X-axis) -->
  <text x="160" y="370" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">The</text>
  <text x="210" y="370" fill="#fbbf24" font-weight="bold" font-size="10" font-family="monospace" text-anchor="middle">robot</text>
  <text x="260" y="370" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">didn't</text>
  <text x="310" y="370" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">cross</text>
  <text x="360" y="370" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">it</text>
  <text x="410" y="370" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">was</text>
  <text x="460" y="370" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">tired</text>

  <!-- Heatmap Cells Grid (7x7) -->
  <!-- Col 1: The -->
  <rect x="145" y="375" width="30" height="20" fill="#1e1b4b"/>
  <rect x="145" y="400" width="30" height="20" fill="#312e81"/>
  <rect x="145" y="425" width="30" height="20" fill="#1e1b4b"/>
  <rect x="145" y="450" width="30" height="20" fill="#1e1b4b"/>
  <rect x="145" y="475" width="30" height="20" fill="#312e81"/>
  <rect x="145" y="500" width="30" height="20" fill="#1e1b4b"/>
  <rect x="145" y="525" width="30" height="20" fill="#1e1b4b"/>

  <!-- Col 2: robot (HIGH ATTENTION FROM "it"!) -->
  <rect x="195" y="375" width="30" height="20" fill="#312e81"/>
  <rect x="195" y="400" width="30" height="20" fill="#818cf8"/>
  <rect x="195" y="425" width="30" height="20" fill="#312e81"/>
  <rect x="195" y="450" width="30" height="20" fill="#4338ca"/>
  <!-- Highlighted cell: Query 'it' attends to Key 'robot' (0.88 score!) -->
  <rect x="195" y="475" width="30" height="20" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
  <text x="210" y="490" fill="#0f172a" font-weight="900" font-size="9" text-anchor="middle">0.88</text>
  <rect x="195" y="500" width="30" height="20" fill="#4338ca"/>
  <rect x="195" y="525" width="30" height="20" fill="#312e81"/>

  <!-- Cols 3-7: remaining cells -->
  <g fill="#1e1b4b">
    <rect x="245" y="375" width="30" height="20"/><rect x="295" y="375" width="30" height="20"/><rect x="345" y="375" width="30" height="20"/><rect x="395" y="375" width="30" height="20"/><rect x="445" y="375" width="30" height="20"/>
    <rect x="245" y="400" width="30" height="20"/><rect x="295" y="400" width="30" height="20"/><rect x="345" y="400" width="30" height="20"/><rect x="395" y="400" width="30" height="20"/><rect x="445" y="400" width="30" height="20"/>
    <rect x="245" y="425" width="30" height="20" fill="#6366f1"/><rect x="295" y="425" width="30" height="20"/><rect x="345" y="425" width="30" height="20"/><rect x="395" y="425" width="30" height="20"/><rect x="445" y="425" width="30" height="20"/>
    <rect x="245" y="450" width="30" height="20"/><rect x="295" y="450" width="30" height="20" fill="#818cf8"/><rect x="345" y="450" width="30" height="20"/><rect x="395" y="450" width="30" height="20"/><rect x="445" y="450" width="30" height="20"/>
    <rect x="245" y="475" width="30" height="20"/><rect x="295" y="475" width="30" height="20"/><rect x="345" y="475" width="30" height="20" fill="#4338ca"/><rect x="395" y="475" width="30" height="20"/><rect x="445" y="475" width="30" height="20" fill="#312e81"/>
    <rect x="245" y="500" width="30" height="20"/><rect x="295" y="500" width="30" height="20"/><rect x="345" y="500" width="30" height="20"/><rect x="395" y="500" width="30" height="20" fill="#6366f1"/><rect x="445" y="500" width="30" height="20"/>
    <rect x="245" y="525" width="30" height="20"/><rect x="295" y="525" width="30" height="20"/><rect x="345" y="525" width="30" height="20"/><rect x="395" y="525" width="30" height="20"/><rect x="445" y="525" width="30" height="20" fill="#a855f7"/>
  </g>

  <!-- Heatmap Callout Panel -->
  <rect x="510" y="380" width="435" height="155" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="530" y="405" fill="#f8fafc" font-size="13" font-weight="700">🔍 How Attention Heatmaps Decode LLMs:</text>
  <text x="530" y="430" fill="#cbd5e1" font-size="11">• Notice cell (Query: <tspan fill="#38bdf8">'it'</tspan>, Key: <tspan fill="#fbbf24">'robot'</tspan>) glowing yellow with score 0.88.</text>
  <text x="530" y="450" fill="#cbd5e1" font-size="11">• The LLM understands that the pronoun "it" refers to "the robot"!</text>
  <text x="530" y="470" fill="#cbd5e1" font-size="11">• In Phase 7 (Day 35–37), we will calculate this exact matrix with:</text>
  <text x="545" y="492" fill="#34d399" font-family="monospace" font-size="12">Attention(Q, K, V) = softmax(Q K^T / sqrt(d_k)) * V</text>
  <text x="530" y="518" fill="#94a3b8" font-size="10">Matplotlib heatmaps make the invisible internal reasoning of Transformer models transparent!</text>
</svg>
